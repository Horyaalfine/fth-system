function renderBranchCashPosition(){
  var summary=state.data.hq_summary||[];
  var transfers=state.data.hq_transfers||[];
  var allPayments=state.data.payments||[];
  var totalCashIn=summary.reduce(function(s,b){return s+parseFloat(b.cash_collected||0);},0);
  var totalTransferred=summary.reduce(function(s,b){return s+parseFloat(b.transferred_to_hq||0);},0);
  var netHeld=totalCashIn-totalTransferred;
  var totalAll=allPayments.reduce(function(s,p){return s+parseFloat(p.amount||0);},0);
  var nonCashIn=totalAll-totalCashIn;
  var monthMap={};
  allPayments.forEach(function(p){
    var mo=(p.payment_date||'').slice(0,7);if(!mo)return;
    if(!monthMap[mo])monthMap[mo]={month:mo,cashIn:0,otherIn:0,transferred:0};
    if(p.method==='cash')monthMap[mo].cashIn+=parseFloat(p.amount||0);
    else monthMap[mo].otherIn+=parseFloat(p.amount||0);
  });
  transfers.forEach(function(t){
    var mo=(t.transfer_date||'').slice(0,7);if(!mo)return;
    if(!monthMap[mo])monthMap[mo]={month:mo,cashIn:0,otherIn:0,transferred:0};
    monthMap[mo].transferred+=parseFloat(t.amount||0);
  });
  var months=Object.values(monthMap).sort(function(a,b){return b.month.localeCompare(a.month);});
  function fmtMo(mo){var p=mo.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1).toLocaleDateString('en-GB',{month:'short',year:'numeric'});}
  var c='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;">'
    +'<div class="card" style="padding:16px;text-align:center;border-top:3px solid #059669;"><div style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Cash Received</div><div style="font-size:22px;font-weight:800;color:#065f46;">&#163;'+totalCashIn.toFixed(2)+'</div><div style="font-size:11px;color:#6b7280;margin-top:4px;">Cash payments from parents</div></div>'
    +'<div class="card" style="padding:16px;text-align:center;border-top:3px solid #3b82f6;"><div style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Non-Cash Received</div><div style="font-size:22px;font-weight:800;color:#1e40af;">&#163;'+nonCashIn.toFixed(2)+'</div><div style="font-size:11px;color:#6b7280;margin-top:4px;">Bank transfer / card / cheque</div></div>'
    +'<div class="card" style="padding:16px;text-align:center;border-top:3px solid #f59e0b;"><div style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Transferred to HQ</div><div style="font-size:22px;font-weight:800;color:#92400e;">&#163;'+totalTransferred.toFixed(2)+'</div><div style="font-size:11px;color:#6b7280;margin-top:4px;">Cash sent to head office</div></div>'
    +'<div class="card" style="padding:16px;text-align:center;border-top:3px solid '+(netHeld>=0?'#0ea5e9':'#dc2626')+';"><div style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Net Cash at Branch</div><div style="font-size:22px;font-weight:800;color:'+(netHeld>=0?'#0369a1':'#dc2626')+';">&#163;'+Math.abs(netHeld).toFixed(2)+'</div><div style="font-size:11px;color:#6b7280;margin-top:4px;">Cash in &#8212; Transferred out</div></div>'
    +'</div>';
  var bt='';
  if(summary.length>1){
    var brows=summary.map(function(b){var h=parseFloat(b.held_at_branch||0);return '<tr><td style="padding:7px 10px;font-weight:600;">'+b.branch_name+'</td><td style="padding:7px 10px;color:#065f46;font-weight:600;">&#163;'+parseFloat(b.cash_collected||0).toFixed(2)+'</td><td style="padding:7px 10px;color:#92400e;font-weight:600;">&#163;'+parseFloat(b.transferred_to_hq||0).toFixed(2)+'</td><td style="padding:7px 10px;color:'+(h>=0?'#0369a1':'#dc2626')+';font-weight:700;">&#163;'+Math.abs(h).toFixed(2)+'</td></tr>';}).join('');
    bt='<div class="card" style="padding:16px;margin-bottom:16px;"><div style="font-size:13px;font-weight:700;margin-bottom:10px;">Per-Branch Cash Position</div><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:#f3f4f6;"><th style="padding:7px 10px;text-align:left;">Branch</th><th style="padding:7px 10px;text-align:left;">Cash Received</th><th style="padding:7px 10px;text-align:left;">Transferred to HQ</th><th style="padding:7px 10px;text-align:left;">Net Held</th></tr></thead><tbody>'+brows+'</tbody></table></div>';
  }
  var mr=months.map(function(mo){var net=mo.cashIn-mo.transferred;return '<tr><td style="padding:7px 10px;font-size:13px;">'+fmtMo(mo.month)+'</td><td style="padding:7px 10px;font-size:13px;color:#065f46;font-weight:600;">&#163;'+mo.cashIn.toFixed(2)+'</td><td style="padding:7px 10px;font-size:13px;color:#1e40af;">&#163;'+mo.otherIn.toFixed(2)+'</td><td style="padding:7px 10px;font-size:13px;color:#92400e;font-weight:600;">&#163;'+mo.transferred.toFixed(2)+'</td><td style="padding:7px 10px;font-size:13px;color:'+(net>=0?'#0369a1':'#dc2626')+';font-weight:700;">&#163;'+Math.abs(net).toFixed(2)+(net<0?' (over)':'')+'</td></tr>';}).join('');

  return c+bt+mt;
}

      html+='<div class="empty-state">Select a month and click Load to see progress records</div>';
    }
  }

  return html;
}

function renderSessionPlan(){

    html+='<div class="field"><label>Session</label><select id="reg-slot-filter"><option value="">All sessions</option>';
    allSlots.forEach(function(s){html+='<option value="'+s+'" '+(s===regSlot?'selected':'')+'>'+s+'</option>';});
    html+='</select></div>';
    html+='<div class="field"><label>Subject</label><select id="reg-subject-filter"><option value="">All subjects</option>';
    allSubjects.forEach(function(s){html+='<option value="'+s+'" '+(s===regSubject?'selected':'')+'>'+s+'</option>';});
    html+='</select></div>';
    html+='</div>';
    html+='<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">';
    html+='<span style="font-size:13px;font-weight:600;">'+filtered.length+' students</span>';
    Object.keys(subjCounts).sort().forEach(function(subj){
      html+='<span class="badge badge-accent">'+subj+': '+subjCounts[subj]+'</span>';

    html+='</div></div>';
    // Table
    // Mode toggle
    html+='<div style="display:flex;gap:8px;margin-bottom:12px;">';
    html+='<button class="btn '+(regMode==='view'?'btn-primary':'')+'" data-action="reg-mode" data-mode="view">📋 View Register</button>';
    html+='<button class="btn '+(regMode==='setup'?'btn-primary':'')+'" data-action="reg-mode" data-mode="setup">⚙ Bulk Timetable Setup</button>';
    html+='</div>';

    if(regMode==='setup'){
      // Bulk timetable setup
      var setupSlot=state.setupSlot||'';
      var setupSubject=state.setupSubject||'';
      var setupDayType=state.setupDayType||'';
      var ALL_SESSIONS=[
        {key:'Weekday Session 1 (17:00-19:00)',dayType:'weekday'},
        {key:'Weekday Session 2 (19:00-21:00)',dayType:'weekday'},
        {key:'Saturday Session 1 (09:00-11:00)',dayType:'saturday'},
        {key:'Saturday Session 2 (11:15-13:15)',dayType:'saturday'},
        {key:'Saturday Session 3 (14:00-16:00)',dayType:'saturday'},
        {key:'Saturday Session 4 (16:15-18:15)',dayType:'saturday'},
        {key:'Sunday Session 1 (09:00-11:00)',dayType:'sunday'},
        {key:'Sunday Session 2 (11:15-13:15)',dayType:'sunday'},
        {key:'Sunday Session 3 (14:00-16:00)',dayType:'sunday'},
        {key:'Sunday Session 4 (16:15-18:15)',dayType:'sunday'},
      ];
      var ALL_SUBJECTS=['Maths','English','Science','History','Geography','Other'];
      var allStudents=(state.data.students||[]).filter(function(s){return s.status==='active';}).sort(function(a,b){return (a.admission_id||'').localeCompare(b.admission_id||'');});
      html+='<div class="card" style="margin-bottom:14px;">';
      html+='<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent);">Select a session and subject, then tick which students attend:</div>';

      html+='<div class="field"><label>Session</label><select id="setup-slot-sel"><option value="">— pick session —</option>';
      ALL_SESSIONS.forEach(function(s){html+='<option value="'+s.key+'" data-daytype="'+s.dayType+'" '+(s.key===setupSlot?'selected':'')+'>'+s.key+'</option>';});
      html+='</select></div>';
      html+='<div class="field"><label>Subject</label><select id="setup-subject-sel"><option value="">— pick subject —</option>';
      ALL_SUBJECTS.forEach(function(s){html+='<option value="'+s+'" '+(s===setupSubject?'selected':'')+'>'+s+'</option>';});
      html+='</select></div>';
      html+='</div></div>';
      if(setupSlot&&setupSubject){
        // Get already-enrolled students for this slot+subject
        var enrolled=allTT.filter(function(t){return t.slot===setupSlot&&t.subject===setupSubject;}).map(function(t){return t.student_id;});

        html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);">';

        html+='<button class="btn btn-sm btn-outline" data-action="setup-clear-all">Clear all</button>';
        html+='<button class="btn btn-sm btn-primary" data-action="setup-save-bulk">✓ Save selection</button>';
        html+='</div></div>';
        html+='<div class="table-wrap"><table style="margin:0;">';
        html+='<thead><tr><th style="width:40px;padding:8px 12px;"><input type="checkbox" id="setup-check-all" style="width:16px;height:16px;"></th><th>Ad No.</th><th>Name</th><th>Year</th></tr></thead><tbody>';
        allStudents.forEach(function(s){
          var chk=enrolled.includes(s.id)?'checked':'';
          html+='<tr>';
          html+='<td style="padding:7px 12px;"><input type="checkbox" class="setup-entry" data-student="'+s.id+'" '+chk+' style="width:16px;height:16px;"></td>';
          html+='<td style="font-size:12px;color:var(--text3);">'+(s.admission_id||'—')+'</td>';
          html+='<td style="font-weight:500;">'+s.name+'</td>';
          html+='<td>'+(s.year_group||'—')+'</td>';
          html+='</tr>';
        });
        html+='</tbody></table></div></div>';
      }else{
        html+='<div class="card" style="text-align:center;color:var(--text3);padding:32px;">Select a session and subject above to see the student list.</div>';
      }
      return html;
    }

    // VIEW MODE
    html+='<div class="table-wrap"><table>';
    html+='<thead><tr><th>Ad No.</th><th>Name</th><th>Year</th><th>Day</th><th>Session</th><th>Subject</th></tr></thead><tbody>';
    if(filtered.length===0){
      html+='<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:24px;">No students match these filters</td></tr>';
    }else{
      filtered.sort(function(a,b){return (a.admission_id||'').localeCompare(b.admission_id||'');}).forEach(function(t){
        html+='<tr>';
        html+='<td style="font-size:12px;color:var(--text3);">'+(t.admission_id||'—')+'</td>';
        html+='<td style="font-weight:500;">'+(t.student_name||'—')+'</td>';
        html+='<td>'+(t.year_group||'—')+'</td>';
        html+='<td>'+t.day_type.charAt(0).toUpperCase()+t.day_type.slice(1)+'</td>';
        html+='<td style="font-size:12px;">'+t.slot+'</td>';
        html+='<td><span class="badge badge-gray">'+t.subject+'</span></td>';
        html+='</tr>';
      });
    }
    html+='</tbody></table></div>';
    return html;
  }

  // ── TAB 2: LESSON PLAN ──────────────────────────────────────────
  if(planTab==='lesson'){
    var lpDate=state.lpDate||new Date().toISOString().slice(0,10);
    var lpMaxPer=state.lpMaxPer||5;
    var lpMode=state.lpMode||'full';
    var lpSlot=state.lpSlot||'';
    var lpSubject=state.lpSubject||'';
    var draft=state.planDraft||null;
    function getDayType(d){var wd=new Date(d+'T00:00:00').getDay();return wd===6?'saturday':wd===0?'sunday':'weekday';}
    var dayType=getDayType(lpDate);
    var allExpected=allTT.filter(function(t){return t.day_type===dayType;});
    function slotIsAM2(slot){var m=(slot||'').match(/\((\d+):/);return m&&parseInt(m[1])<14;}
    var expected=lpMode==='am'?allExpected.filter(function(t){return slotIsAM2(t.slot);}):lpMode==='pm'?allExpected.filter(function(t){return !slotIsAM2(t.slot);}):lpMode==='single'&&lpSlot&&lpSubject?allExpected.filter(function(t){return t.slot===lpSlot&&t.subject===lpSubject;}):allExpected;
    var subjSlotCounts={};
    allExpected.forEach(function(t){var k=t.slot+'||'+t.subject;if(!subjSlotCounts[k])subjSlotCounts[k]=0;subjSlotCounts[k]++;});
    // Duplicate check
    var existingForDate=(state.data.sessions||[]).filter(function(s){return s.date===lpDate&&(!state.currentBranch||s.branch_id===state.currentBranch);});
    var duplicateSlotSubj=lpMode==='single'&&lpSlot&&lpSubject?existingForDate.filter(function(s){return s.slot===lpSlot&&s.subject===lpSubject;}):[];
    var hasAMDuplicate=lpMode==='am'&&existingForDate.some(function(s){return slotIsAM2(s.slot);});
    var hasPMDuplicate=lpMode==='pm'&&existingForDate.some(function(s){return !slotIsAM2(s.slot);});
    var hasFullDayDuplicate=lpMode==='full'&&existingForDate.length>0;
    html+='<div class="card" style="margin-bottom:14px;">';
    // Mode selector — AM/PM for weekends, Session 1/2 for weekdays
    var isWeekday=dayType==='weekday';
    html+='<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">';
    html+='<button class="btn '+(lpMode==='full'?'btn-primary':'')+'" data-action="lp-mode" data-mode="full">📅 Full Day</button>';
    if(isWeekday){
      html+='<button class="btn '+(lpMode==='am'?'btn-primary':'')+'" data-action="lp-mode" data-mode="am">🌙 Session 1 (5pm–7pm)</button>';
      html+='<button class="btn '+(lpMode==='pm'?'btn-primary':'')+'" data-action="lp-mode" data-mode="pm">🌙 Session 2 (7pm–9pm)</button>';
    }else{
      html+='<button class="btn '+(lpMode==='am'?'btn-primary':'')+'" data-action="lp-mode" data-mode="am">☀️ AM Shift (9am–1:15pm)</button>';
      html+='<button class="btn '+(lpMode==='pm'?'btn-primary':'')+'" data-action="lp-mode" data-mode="pm">🌤️ PM Shift (2pm–6:15pm)</button>';
    }
    html+='</div>';
    html+='<div class="form-grid">';
    html+='<div class="field"><label>Plan date</label><input type="date" id="lp-date" value="'+lpDate+'"></div>';
    html+='<div class="field"><label>Max students per table</label><input type="number" id="lp-max-per" value="'+lpMaxPer+'" min="5" max="20" style="width:80px;"></div>';
    if(lpMode==='single'){
      var daySlots=[...new Set(allExpected.map(function(t){return t.slot;}))].sort();
      var slotSubjects=lpSlot?[...new Set(allExpected.filter(function(t){return t.slot===lpSlot;}).map(function(t){return t.subject;}))].sort():[];
      html+='<div class="field"><label>Session slot</label><select id="lp-slot-sel"><option value="">— select slot —</option>';
      daySlots.forEach(function(sl){html+='<option value="'+sl+'" '+(sl===lpSlot?'selected':'')+'>'+sl+'</option>';});
      html+='</select></div>';
      html+='<div class="field"><label>Subject</label><select id="lp-subj-sel" '+(lpSlot?'':'disabled')+'><option value="">— select subject —</option>';
      slotSubjects.forEach(function(sb){html+='<option value="'+sb+'" '+(sb===lpSubject?'selected':'')+'>'+sb+'</option>';});
      html+='</select></div>';
    }
    html+='</div>';
    html+='<div style="margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">';
    var dtLabel=dayType.charAt(0).toUpperCase()+dayType.slice(1);
    html+='<span style="font-size:13px;"><strong>'+dtLabel+'</strong>';
    if(lpMode==='full')html+=' · <strong>'+allExpected.length+'</strong> students expected (full day)';
    else if(lpMode==='am')html+=' · <strong>'+expected.length+'</strong> students — AM Shift';
    else if(lpMode==='pm')html+=' · <strong>'+expected.length+'</strong> students — PM Shift';
    else if(lpMode==='single'&&lpSlot&&lpSubject)html+=' · <strong>'+expected.length+'</strong> students in this lesson';
    html+='</span>';
    if(lpMode==='full'||lpMode==='am'||lpMode==='pm'){
      Object.keys(subjSlotCounts).sort().filter(function(k){
        var slot=k.split('||')[0];
        if(lpMode==='am')return slotIsAM2(slot);
        if(lpMode==='pm')return !slotIsAM2(slot);
        return true;
      }).forEach(function(k){
        var parts=k.split('||');
        html+='<span class="badge badge-gray">'+parts[1]+' ('+parts[0].replace(/.*\(|\).*/g,'')+') ×'+subjSlotCounts[k]+'</span>';
      });
    }
    html+='</div>';
    // Duplicate warnings
    if(duplicateSlotSubj.length>0){
      html+='<div style="margin-top:10px;padding:10px 14px;background:var(--amber-bg);border-radius:var(--radius);border-left:3px solid var(--amber);font-size:13px;color:var(--amber-text);">⚠️ A plan already exists for this slot and subject on '+lpDate+'. Check the Report tab before saving.</div>';
    }
    if(hasAMDuplicate){
      html+='<div style="margin-top:10px;padding:10px 14px;background:var(--amber-bg);border-radius:var(--radius);border-left:3px solid var(--amber);font-size:13px;color:var(--amber-text);">⚠️ AM Shift sessions already exist for '+lpDate+'. Check the Report tab before generating a new plan.</div>';
    }
    if(hasPMDuplicate){
      html+='<div style="margin-top:10px;padding:10px 14px;background:var(--amber-bg);border-radius:var(--radius);border-left:3px solid var(--amber);font-size:13px;color:var(--amber-text);">⚠️ PM Shift sessions already exist for '+lpDate+'. Check the Report tab before generating a new plan.</div>';
    }
    if(hasFullDayDuplicate){
      html+='<div style="margin-top:10px;padding:10px 14px;background:var(--amber-bg);border-radius:var(--radius);border-left:3px solid var(--amber);font-size:13px;color:var(--amber-text);">⚠️ Sessions already exist for '+lpDate+' ('+existingForDate.length+' sessions saved). Check the Report tab before generating a new plan.</div>';
    }
    html+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">';
    var canGenerate=lpMode==='full'||lpMode==='am'||lpMode==='pm'||(lpMode==='single'&&lpSlot&&lpSubject);
    if(canGenerate){html+='<button class="btn btn-primary" data-action="lp-generate">⚡ Auto-Generate Plan</button>';}
    html+='<button class="btn btn-secondary" data-action="lp-manual">✏ Manual Plan</button>';
    if(draft&&draft.tables!==undefined){
      html+='<button class="btn btn-success" data-action="lp-save">✓ Save Plan</button>';
      html+='<button class="btn btn-danger btn-sm" data-action="lp-clear-draft">🗑 Clear</button>';
    }
    html+='</div></div>';

    if(!draft||!draft.tables){
      if(expected.length===0){
        html+='<div class="card" style="text-align:center;color:var(--text3);padding:32px;">No students registered for '+dtLabel+' sessions.<br>Go to a student profile and set their timetable first.</div>';
      }else{
        html+='<div class="card" style="text-align:center;color:var(--text3);padding:32px;">Click <strong>Auto-Generate Plan</strong> to auto-create tables, or <strong>Manual Plan</strong> to build from scratch.</div>';
      }
    }else{
      // Show draft tables
      if(draft.tables.length===0){
        html+='<div class="card" style="text-align:center;color:var(--text3);padding:20px;margin-bottom:12px;">Draft started — use <strong>＋ Add Blank Table</strong> below to build your plan.</div>';
      }
      var slots=[...new Set(draft.tables.map(function(t){return t.slot;}))].sort();
      slots.forEach(function(slot){
        var slotTables=draft.tables.filter(function(t){return t.slot===slot;});
        html+='<div style="margin-bottom:8px;padding:8px 0 4px 0;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;">'+slot+'</div>';
        html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;">';
        slotTables.forEach(function(tbl,idx){
          var tblIdx=draft.tables.indexOf(tbl);
          var teacher=staff.find(function(s){return s.id===tbl.teacher_id;});
          html+='<div class="card" style="border-top:3px solid var(--accent);padding:12px;">';
          html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
          html+='<span style="font-weight:700;">T'+tbl.table_no+' · <span class="badge badge-gray">'+tbl.subject+'</span>'+(tbl.ks?'<span class="badge badge-accent" style="margin-left:4px;font-size:10px;">'+tbl.ks+'</span>':'')+'</span>';
          html+='<button class="btn btn-sm btn-danger" data-action="lp-remove-table" data-idx="'+tblIdx+'">×</button>';
          html+='</div>';
          html+='<div style="margin-bottom:8px;"><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:3px;">Teacher</label>';
          html+='<select data-action="lp-set-teacher" data-idx="'+tblIdx+'" style="width:100%;font-size:13px;">';
          html+='<option value="">— assign teacher —</option>';
          staff.forEach(function(s){html+='<option value="'+s.id+'" '+(tbl.teacher_id===s.id?'selected':'')+'>'+s.name+(s.subject?' ('+s.subject+')':'')+' </option>';});
          html+='</select></div>';
          html+='<div style="font-size:11px;color:var(--text3);margin-bottom:4px;">'+tbl.students.length+' students</div>';
          html+='<table style="margin:0;font-size:12px;width:100%;">';
          html+='<thead><tr><th style="padding:2px 6px 2px 0;">Ad No.</th><th style="padding:2px 6px 2px 0;">Name</th><th style="padding:2px 0;">Year</th><th style="padding:2px 0;"></th></tr></thead><tbody>';
          tbl.students.forEach(function(st,stIdx){
            html+='<tr>';
            html+='<td style="padding:2px 6px 2px 0;color:var(--text3);">'+(st.admission_id||'—')+'</td>';
            html+='<td style="padding:2px 6px 2px 0;font-weight:500;">'+(st.student_name||'—')+'</td>';
            html+='<td style="padding:2px 4px 2px 0;">'+(st.year_group||'—')+'</td>';
            html+='<td style="padding:2px 0;">';
            // Move to dropdown - show all other tables in draft
            var otherDraftTables=draft.tables.filter(function(t){return t!==tbl;});
            if(otherDraftTables.length>0){
              html+='<select data-action="lp-move-student" data-from="'+tblIdx+'" data-student="'+stIdx+'" style="font-size:10px;padding:1px 2px;max-width:70px;" title="Move to table">';
              html+='<option value="">&#8599; Move</option>';
              otherDraftTables.forEach(function(t){var ds=t.slot!==tbl.slot?' ('+t.slot.replace(/.*\(|\).*/g,'')+')':'';html+='<option value="'+draft.tables.indexOf(t)+'">&#8594; T'+t.table_no+ds+'</option>';});
              html+='</select>';
            }
            html+='</td>';
            html+='</tr>';
          });
          // Add student to draft table
          var alreadyIn=tbl.students.map(function(s){return s.admission_id;});
          var addable=allTT.filter(function(t){return t.slot===tbl.slot&&t.subject===tbl.subject&&alreadyIn.indexOf(t.admission_id)<0;});
          if(addable.length>0){
            html+='<tr><td colspan="4" style="padding-top:4px;">';
            html+='<select data-action="lp-add-student" data-idx="'+tblIdx+'" style="width:100%;font-size:11px;padding:2px 4px;">';
            html+='<option value="">＋ Add student...</option>';
            addable.forEach(function(st){html+='<option value="'+st.admission_id+'">'+st.student_name+' ('+st.admission_id+(st.year_group?' · '+st.year_group:'')+')' +'</option>';});
            html+='</select>';
            html+='</td></tr>';
          }
          html+='</tbody></table></div>';
        });
        html+='</div>';
      });
      // Add blank table button
      var knownSlots=[...new Set(allTT.filter(function(t){return t.day_type===draft.dayType;}).map(function(t){return t.slot;}))].sort();
      html+='<div style="margin-top:4px;padding:10px 0;border-top:1px solid var(--border);">';
      html+='<button class="btn btn-secondary btn-sm" data-action="lp-add-table-btn">＋ Add Blank Table</button>';
      if(state.lpAddingTable){
        html+='<div style="display:inline-flex;gap:8px;align-items:center;margin-left:10px;flex-wrap:wrap;">';
        html+='<select id="lp-add-slot" style="font-size:12px;padding:3px 6px;"><option value="">Slot...</option>';
        knownSlots.forEach(function(sl){html+='<option value="'+sl+'">'+sl+'</option>';});
        html+='</select>';
        html+='<select id="lp-add-subj" style="font-size:12px;padding:3px 6px;"><option value="">Subject...</option>';
        ['Maths','English','Science','Arabic','Islamic Studies','Other'].forEach(function(sb){html+='<option value="'+sb+'">'+sb+'</option>';});
        html+='</select>';
        html+='<button class="btn btn-primary btn-sm" data-action="lp-add-table-confirm">Add</button>';
        html+='<button class="btn btn-sm" data-action="lp-add-table-cancel">Cancel</button>';
        html+='</div>';
      }
      html+='</div>';
    }
    return html;

function renderCatchup(){
  const owed=state.data.catchup_owed||[];
  const scheduled=state.data.catchup_scheduled||[];
  const completed=state.data.catchup_completed||[];
  const sessions=state.data.sessions||[];
  const students=state.data.students||[];
  const tab=state.catchupTab||'owed';

  function statusBadge(s){
    if(s==='owed') return '<span class="badge badge-danger">Owed</span>';
    if(s==='scheduled') return '<span class="badge badge-amber">Scheduled</span>';
    if(s==='completed') return '<span class="badge badge-success">Completed</span>';
    return '<span class="badge badge-gray">'+s+'</span>';
  }

  function buildTable(list, showActions){
    if(!list.length) return '<div class="empty-state" style="padding:30px;">No catch-up lessons in this category</div>';
    let rows='';
    list.forEach(function(c){
      rows+='<tr>';
      rows+='<td><strong>'+c.student_name+'</strong></td>';
      rows+='<td><span class="id-code">'+c.admission_id+'</span></td>';
      rows+='<td><span class="badge badge-gray">'+(c.subject||'—')+'</span></td>';
      rows+='<td style="font-size:12px;">'+(c.missed_date||'—')+'</td>';
      rows+='<td>'+(c.missed_slot||'—')+'</td>';
      rows+='<td>'+statusBadge(c.status)+'</td>';
      rows+='<td style="font-size:12px;color:var(--text3);">'+(c.catchup_date_actual||c.scheduled_date||'—')+'</td>';
      rows+='<td style="font-size:12px;color:var(--text3);">'+(c.notes||'—')+'</td>';
      if(showActions){
        rows+='<td><div class="row-actions">';
        if(c.status==='owed') rows+='<button class="btn btn-sm btn-primary" data-action="schedule-catchup" data-id="'+c.id+'">Schedule</button>';
        if(c.status==='scheduled') rows+='<button class="btn btn-sm btn-success" data-action="complete-catchup" data-id="'+c.id+'">Complete</button>';
        rows+='<button class="btn btn-sm btn-danger" data-action="del-catchup" data-id="'+c.id+'">Del</button>';
        rows+='</div></td>';
      } else {
        rows+='<td></td>';
      }
      rows+='</tr>';
    });
    return rows;
  }

  let html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">';
  html+='<div><div class="section-title">Catch-up lessons</div>';
  html+='<div class="section-sub">Students who missed sessions and are entitled to catch-up</div></div>';
  html+='<button class="btn btn-primary" data-action="add-catchup">+ Log catch-up owed</button>';
  html+='</div>';

  // Summary cards
  html+='<div class="metrics-grid" style="margin-bottom:20px;">';
  html+='<div class="metric-card" style="border-top:3px solid var(--danger);"><div class="metric-label">Owed</div><div class="metric-value" style="color:var(--danger-text);">'+owed.length+'</div><div class="metric-sub">Pending scheduling</div></div>';
  html+='<div class="metric-card" style="border-top:3px solid var(--amber);"><div class="metric-label">Scheduled</div><div class="metric-value" style="color:var(--amber-text);">'+scheduled.length+'</div><div class="metric-sub">Awaiting completion</div></div>';
  html+='<div class="metric-card" style="border-top:3px solid var(--success);"><div class="metric-label">Completed</div><div class="metric-value" style="color:var(--success-text);">'+completed.length+'</div><div class="metric-sub">Done</div></div>';
  html+='</div>';

  // Tabs
  html+='<div class="tab-bar" style="margin-bottom:16px;">';
  html+='<div class="tab '+(tab==='owed'?'active':'')+'" data-action="catchup-tab" data-tab="owed">Owed ('+owed.length+')</div>';
  html+='<div class="tab '+(tab==='scheduled'?'active':'')+'" data-action="catchup-tab" data-tab="scheduled">Scheduled ('+scheduled.length+')</div>';
  html+='<div class="tab '+(tab==='completed'?'active':'')+'" data-action="catchup-tab" data-tab="completed">Completed ('+completed.length+')</div>';
  html+='</div>';

  const activeList = tab==='owed'?owed:tab==='scheduled'?scheduled:completed;
  html+='<div class="card" style="padding:0;overflow:hidden;">';
  html+='<div class="table-wrap"><table>';
  html+='<thead><tr><th>Student</th><th>ID</th><th>Subject</th><th>Missed date</th><th>Slot</th><th>Status</th><th>Catch-up date</th><th>Notes</th><th></th></tr></thead>';
  html+='<tbody>'+buildTable(activeList, true)+'</tbody>';
  html+='</table></div></div>';
  return html;
}

  html+='</div>';

  // ── Student picker ──
  html+='<div class="card" style="margin-bottom:20px;padding:16px;">';
  html+='<div class="field" style="margin:0;max-width:400px;"><label>Select student</label>';
  html+='<select id="sp-student-select" onchange="state.spStudentId=this.value?parseInt(this.value):null;state.spTab=\'attendance\';refreshPage();">';
  html+='<option value="">— choose a student —</option>';
  students.filter(s=>s.status==="active").sort((a,b)=>a.name.localeCompare(b.name)).forEach(function(s){
    html+='<option value="'+s.id+'"'+(s.id===spid?' selected':'')+'>'+s.name+' ('+s.admission_id+')</option>';
  });
  html+='</select></div></div>';

  if(!spid||!student){
    html+='<div class="empty-state" style="padding:60px;text-align:center;"><div style="font-size:48px;margin-bottom:12px;">👤</div><div style="color:var(--text2);">Select a student to view their full profile</div></div>';
    return html;
  }

  const attData  = state.data['sp_att_'+spid]  || {};
  const attRecs  = attData.records  || [];
  const attSumm  = attData.summary  || {};
  const progRecs = state.data['sp_prog_'+spid]  || [];
  const testRecs = state.data['sp_tests_'+spid] || [];
  const catchRecs= (state.data['sp_catchup_'+spid]||[]).filter(c=>c.student_id===spid);

  const totalSess = parseInt(attSumm.total)||0;
  const present   = parseInt(attSumm.present)||0;
  const absent    = parseInt(attSumm.absent)||0;
  const attPct    = totalSess>0?Math.round(present/totalSess*100):0;

  const avgScore = testRecs.length
    ? Math.round(testRecs.reduce((a,t)=>a+(parseFloat(t.score_pct)||0),0)/testRecs.length)
    : null;

  const latestProg = progRecs[0];
  const owedCatchup = catchRecs.filter(c=>c.status==='owed').length;

  // ── Action buttons ──
  html+='<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">';
  html+='<button class="btn btn-primary" data-action="print-student-progress" data-id="'+spid+'">🖨 Print</button>';
  html+='<button class="btn" data-action="export-student-progress" data-id="'+spid+'">⬇ Export CSV</button>';
  html+='<button class="btn" data-action="email-student-progress" data-id="'+spid+'">✉ Email to Parent</button>';
  html+='</div>';

  // ── Student info strip ──
  html+='<div class="card" style="margin-bottom:16px;padding:16px;background:var(--accent);color:#fff;">';
  html+='<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;">';
  html+='<div><div style="font-size:20px;font-weight:700;">'+student.name+'</div>';
  html+='<div style="opacity:0.85;font-size:13px;">'+student.admission_id+' · '+(student.year_group||'Year —')+' · '+(student.branch_name||student.branch_id||'')+'</div></div>';
  const subjs=(student.subjects||(student.subject?student.subject:''))||'';
  if(subjs) html+='<div style="font-size:13px;opacity:0.85;">📚 '+subjs+'</div>';
  html+='</div></div>';

  // ── KPI cards ──
  const pctColor=attPct>=80?'var(--success)':attPct>=60?'var(--amber)':'var(--danger)';
  html+='<div class="metrics-grid" style="margin-bottom:20px;">';
  html+='<div class="metric-card" style="border-top:3px solid '+pctColor+';">';
  html+='<div class="metric-label">Attendance</div>';
  html+='<div class="metric-value" style="color:'+pctColor+';">'+attPct+'%</div>';
  html+='<div class="metric-sub">'+present+' present / '+absent+' absent</div></div>';

  const scoreColor=avgScore===null?'var(--text3)':avgScore>=70?'var(--success)':avgScore>=50?'var(--amber)':'var(--danger)';
  html+='<div class="metric-card" style="border-top:3px solid '+scoreColor+';">';
  html+='<div class="metric-label">Avg Test Score</div>';
  html+='<div class="metric-value" style="color:'+scoreColor+';">'+(avgScore!==null?avgScore+'%':'—')+'</div>';
  html+='<div class="metric-sub">'+testRecs.length+' test'+(testRecs.length===1?'':'s')+' recorded</div></div>';

  html+='<div class="metric-card" style="border-top:3px solid var(--text3);">';
  html+='<div class="metric-label">Progress Notes</div>';
  html+='<div class="metric-value">'+progRecs.length+'</div>';
  html+='<div class="metric-sub">'+(latestProg?'Last: '+latestProg.date:'No notes yet')+'</div></div>';

  const catchColor=owedCatchup>0?'var(--danger)':'var(--success)';
  html+='<div class="metric-card" style="border-top:3px solid '+catchColor+';">';
  html+='<div class="metric-label">Catch-up Owed</div>';
  html+='<div class="metric-value" style="color:'+catchColor+';">'+owedCatchup+'</div>';
  html+='<div class="metric-sub">'+catchRecs.length+' total logged</div></div>';
  html+='</div>';

  // ── Tabs ──
  const spTab=state.spTab||'attendance';
  html+='<div class="tab-bar" style="margin-bottom:16px;">';
  ['attendance','tests','progress','catchup'].forEach(function(t){
    const labels={attendance:'Attendance ('+attRecs.length+')',tests:'Tests ('+testRecs.length+')',progress:'Progress Notes ('+progRecs.length+')',catchup:'Catch-up ('+catchRecs.length+')'};
    html+='<div class="tab '+(spTab===t?'active':'')+'" data-action="sp-tab" data-tab="'+t+'">'+labels[t]+'</div>';
  });
  html+='</div>';

  // ── Tab content ──
  html+='<div class="card" style="padding:0;overflow:hidden;">';

  if(spTab==='attendance'){
    if(!attRecs.length){ html+='<div class="empty-state" style="padding:30px;">No attendance records found</div>'; }
    else {
      html+='<div class="table-wrap"><table>';
      html+='<thead><tr><th>Date</th><th>Subject</th><th>Slot</th><th>Status</th><th>Notes</th></tr></thead><tbody>';
      attRecs.slice(0,50).forEach(function(r){
        const badge=r.status==='present'?'<span class="badge badge-success">Present</span>':'<span class="badge badge-danger">Absent</span>';
        html+='<tr><td>'+r.date+'</td><td>'+(r.subject||'—')+'</td><td>'+(r.slot||'—')+'</td><td>'+badge+'</td><td style="color:var(--text3);font-size:12px;">'+(r.notes||'')+'</td></tr>';
      });
      html+='</tbody></table></div>';
    }
  }

  else if(spTab==='tests'){
    if(!testRecs.length){ html+='<div class="empty-state" style="padding:30px;">No test records found</div>'; }
    else {
      html+='<div class="table-wrap"><table>';
      html+='<thead><tr><th>Date</th><th>Subject</th><th>Book / Unit</th><th>Score</th><th>Retest</th><th>Action Plan</th></tr></thead><tbody>';
      testRecs.forEach(function(r){
        const sc=parseFloat(r.score_pct)||0;
        const col=sc>=70?'var(--success)':sc>=50?'var(--amber)':'var(--danger)';
        const rsc=r.retest_score_pct!=null?parseFloat(r.retest_score_pct)+'%':'—';
        html+='<tr>';
        html+='<td>'+r.test_date+'</td>';
        html+='<td><span class="badge badge-gray">'+(r.subject||'—')+'</span></td>';
        html+='<td style="font-size:12px;">'+(r.book_unit||'—')+'</td>';
        html+='<td><strong style="color:'+col+';">'+sc+'%</strong></td>';
        html+='<td>'+rsc+'</td>';
        html+='<td style="font-size:12px;color:var(--text3);">'+(r.action_plan||'—')+'</td>';
        html+='</tr>';
      });
      html+='</tbody></table></div>';
    }
  }

  else if(spTab==='progress'){
    if(!progRecs.length){ html+='<div class="empty-state" style="padding:30px;">No progress notes found</div>'; }
    else {
      html+='<div style="padding:16px;display:flex;flex-direction:column;gap:12px;">';
      progRecs.slice(0,30).forEach(function(r){
        const stars='★'.repeat(r.rating||0)+'☆'.repeat(5-(r.rating||0));
        const ratingColor=r.rating>=4?'var(--success)':r.rating>=3?'var(--amber)':'var(--danger)';
        html+='<div style="border:1px solid var(--border);border-radius:8px;padding:12px;">';
        html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
        html+='<div style="display:flex;gap:8px;align-items:center;">';
        html+='<span class="badge badge-gray">'+(r.subject||'General')+'</span>';
        html+='<span style="color:'+ratingColor+';font-size:14px;">'+stars+'</span>';
        html+='</div>';
        html+='<div style="font-size:12px;color:var(--text3);">'+r.date+' · '+(r.staff_name||'Unknown')+'</div>';
        html+='</div>';
        html+='<div style="font-size:13px;color:var(--text1);">'+(r.comment||'<em style="color:var(--text3);">No comment</em>')+'</div>';
        html+='</div>';
      });
      html+='</div>';
    }
  }

  else if(spTab==='catchup'){
    if(!catchRecs.length){ html+='<div class="empty-state" style="padding:30px;">No catch-up lessons logged for this student</div>'; }
    else {
      html+='<div class="table-wrap"><table>';
      html+='<thead><tr><th>Subject</th><th>Missed date</th><th>Status</th><th>Catch-up date</th><th>Notes</th></tr></thead><tbody>';
      catchRecs.forEach(function(c){
        const badge=c.status==='owed'?'<span class="badge badge-danger">Owed</span>':c.status==='scheduled'?'<span class="badge badge-amber">Scheduled</span>':'<span class="badge badge-success">Completed</span>';
        html+='<tr>';
        html+='<td><span class="badge badge-gray">'+(c.subject||'—')+'</span></td>';
        html+='<td>'+(c.missed_date||c.missed_date_actual||'—')+'</td>';
        html+='<td>'+badge+'</td>';
        html+='<td>'+(c.catchup_date_actual||c.scheduled_date||'—')+'</td>';
        html+='<td style="font-size:12px;color:var(--text3);">'+(c.notes||'—')+'</td>';
        html+='</tr>';
      });
      html+='</tbody></table></div>';
    }
  }

  html+='</div>';
  return html;
}

function renderLessonReports(){
  const sessions=state.data.sessions||[];
  const lrMode=state.lrMode||'enter';
  const selId=state.lrSessionId;
  const selSess=sessions.find(s=>s.id===selId);
  const reports=selId?(state.data['lr_'+selId]||[]):[];
  const attRecs=selId?(state.data['lr_att_'+selId]||[]):[];
  const tab=state.lrTab||'report';
  const branchStudents=selId?(state.data['sess_students_'+selId]||[]):[];
  const checkedCount=reports.filter(r=>r.supervisor_checked).length;
  const lrDate=state.lrDate||'';

  // helper
  function sName(st){return st.student_name||st.name||'Unknown';}

  let html='';
  html+='<div class="section-title" style="margin-bottom:4px;">Lesson reports</div>';
  html+='<div class="section-sub">Daily lesson log — teacher notes and supervisor checks</div>';

  // Mode toggle
  html+='<div style="display:flex;gap:8px;margin-bottom:16px;">';
  html+='<button class="btn btn-sm '+(lrMode==='enter'?'btn-primary':'')+'" data-action="lr-mode" data-mode="enter">✏️ Enter Reports</button>';
  html+='<button class="btn btn-sm '+(lrMode==='view'?'btn-primary':'')+'" data-action="lr-mode" data-mode="view">📋 View Report</button>';
  html+='</div>';

  // ── VIEW REPORT MODE ──────────────────────────────────────
  if(lrMode==='view'){
    var dates=[...new Set(sessions.map(function(s){return s.date;}).filter(Boolean))].sort().reverse();
    html+='<div class="card" style="margin-bottom:14px;">';
    html+='<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">';
    html+='<div class="field" style="margin:0;flex:1;min-width:200px;"><label>Select date</label><select id="lr-date-select"><option value="">— choose date —</option>';
    dates.forEach(function(d){
      var dl=new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
      html+='<option value="'+d+'" '+(d===lrDate?'selected':'')+'>'+dl+'</option>';
    });
    html+='</select></div>';
    if(lrDate){
      html+='<button class="btn btn-primary" onclick="printLessonReportView()">🖨 Print</button>';
      html+='<button class="btn btn-secondary" onclick="exportLessonReportExcel()">📄 Export Excel</button>';
    }
    html+='</div></div>';

    if(!lrDate){
      html+='<div class="card" style="text-align:center;color:var(--text3);padding:40px;">Select a date to view the report.</div>';
      return html;
    }

    var daySess=sessions.filter(function(s){return s.date===lrDate;});
    if(!daySess.length){
      html+='<div class="card" style="text-align:center;color:var(--text3);padding:40px;">No sessions found for this date.</div>';
      return html;
    }

    var bySlot={};
    daySess.forEach(function(s){if(!bySlot[s.slot])bySlot[s.slot]=[];bySlot[s.slot].push(s);});
    var slotKeys=Object.keys(bySlot).sort();
    var dateLabel=new Date(lrDate+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    html+='<div style="font-size:18px;font-weight:800;margin-bottom:4px;">Lesson Report — '+dateLabel+'</div>';

    slotKeys.forEach(function(slot,si){
      var tables=bySlot[slot].slice().sort(function(a,b){return (a.table_no||0)-(b.table_no||0);});
      html+='<div style="margin-bottom:24px;">';
      html+='<div style="background:var(--accent);color:#fff;padding:10px 16px;border-radius:var(--radius) var(--radius) 0 0;font-size:15px;font-weight:700;">Session '+(si+1)+': '+slot+'</div>';
      html+='<div style="border:1px solid var(--accent);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;">';
      tables.forEach(function(s,ti){
        var studs=state.data['sess_students_'+s.id]||[];
        var rpts=state.data['lr_'+s.id]||[];
        var atts=state.data['lr_att_'+s.id]||[];
        var attMap={};atts.forEach(function(a){attMap[a.student_id]=a.status;});
        var repMap={};rpts.forEach(function(r){repMap[r.student_id]=r;});
        var borderTop=ti>0?'border-top:1px solid var(--border);':'';
        html+='<div style="padding:12px 16px;'+borderTop+'">';
        html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">';
        html+='<span style="font-weight:700;font-size:13px;">Table '+s.table_no+'</span>';
        html+='<span class="badge badge-gray">'+(s.subject||'—')+'</span>';
        html+='<span style="font-size:12px;color:var(--text3);">Teacher: '+(s.staff_name||'Unassigned')+'</span>';
        var rptDone=rpts.length;var supDone=rpts.filter(function(r){return r.supervisor_checked;}).length;
        html+='<span class="badge '+(rptDone===studs.length&&studs.length>0?'badge-success':'badge-amber')+'" style="margin-left:auto;">'+rptDone+'/'+studs.length+' reports</span>';
        html+='<span class="badge '+(supDone===rptDone&&rptDone>0?'badge-success':'badge-gray')+'">'+supDone+'/'+rptDone+' checked</span>';
        html+='</div>';
        if(!studs.length){html+='<div style="font-size:12px;color:var(--text3);">No students loaded — select this table in Enter Reports to initialise.</div></div>';return;}
        html+='<table style="width:100%;font-size:12px;border-collapse:collapse;">';
        html+='<thead><tr style="background:var(--surface2);"><th style="padding:5px 8px;text-align:left;">Student</th><th style="padding:5px 8px;">Att.</th><th style="padding:5px 8px;">Classwork</th><th style="padding:5px 8px;">HW set</th><th style="padding:5px 8px;">HW marked</th><th style="padding:5px 8px;">WWW</th><th style="padding:5px 8px;">EBI</th><th style="padding:5px 8px;">Checked</th></tr></thead><tbody>';
        studs.forEach(function(st){
          var stId=st.student_id||st.id;
          var att=attMap[stId]||'—';
          var rep=repMap[stId]||{};
          var attBadge=att==='present'?'badge-success':att==='absent'?'badge-danger':'badge-gray';
          var chkBadge=rep.supervisor_checked?'badge-success':'badge-gray';
          html+='<tr style="border-top:1px solid var(--border);">';
          html+='<td style="padding:5px 8px;font-weight:500;">'+(sName(st))+'<br><span style="color:var(--text3);font-size:10px;">'+(st.admission_id||'')+'</span></td>';
          html+='<td style="padding:5px 8px;text-align:center;"><span class="badge '+attBadge+'">'+att+'</span></td>';
          html+='<td style="padding:5px 8px;">'+(rep.classwork_completed||'—')+'</td>';
          html+='<td style="padding:5px 8px;">'+(rep.homework_set||'—')+'</td>';
          html+='<td style="padding:5px 8px;text-align:center;">'+(rep.homework_marked?'✓':'✗')+'</td>';
          html+='<td style="padding:5px 8px;">'+(rep.www||'—')+'</td>';
          html+='<td style="padding:5px 8px;">'+(rep.ebi||'—')+'</td>';
          html+='<td style="padding:5px 8px;text-align:center;"><span class="badge '+chkBadge+'">'+(rep.supervisor_checked?'✓':'—')+'</span></td>';
          html+='</tr>';
        });
        html+='</tbody></table></div>';
      });
      html+='</div></div>';
    });
    return html;
  }

  // ── ENTER REPORTS MODE ────────────────────────────────────
  html+=`
  <div class="card" style="margin-bottom:16px;">
    <div class="field"><label>Select session (table)</label>
    <select id="lr-session-select">
      <option value="">— choose a session —</option>
      ${sessions.map(s=>`<option value="${s.id}" ${s.id===selId?'selected':''}>${new Date(s.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} · ${s.slot} · ${s.branch_name} · Table ${s.table_no||'?'} · ${s.subject||'?'} · ${s.staff_name||'Unassigned'}</option>`).join('')}
    </select></div>
  </div>

  ${selSess?`
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
    <div class="metric-card"><div class="metric-label">Session</div><div class="metric-value" style="font-size:14px;">${new Date(selSess.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></div>
    <div class="metric-card"><div class="metric-label">Students</div><div class="metric-value">${branchStudents.length}</div></div>
    <div class="metric-card"><div class="metric-label">Reports logged</div><div class="metric-value" style="color:var(--success-text);">${reports.length}</div></div>
    <div class="metric-card"><div class="metric-label">Supervisor checks</div><div class="metric-value" style="color:${checkedCount===reports.length&&reports.length>0?'var(--success-text)':'var(--amber-text)'};">${checkedCount}/${reports.length}</div></div>
  </div>

  <div class="tab-bar">
    <div class="tab ${tab==='report'?'active':''}" data-action="lr-tab" data-tab="report">Lesson report</div>
    <div class="tab ${tab==='supervisor'?'active':''}" data-action="lr-tab" data-tab="supervisor">Supervisor check</div>
  </div>

  ${tab==='report'?`
  <div style="display:flex;flex-direction:column;gap:12px;">
    ${branchStudents.map(st=>{
      const sn=st.student_name||st.name||'Unknown';
      const att=attRecs.find(a=>a.student_id===(st.student_id||st.id));
      const rep=reports.find(r=>r.student_id===(st.student_id||st.id))||{};
      const isPresent=att?.status==='present';
      return `<div class="card" style="border-left:3px solid ${isPresent?'var(--success)':'var(--border)'};">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="avatar av-teal" style="width:32px;height:32px;font-size:11px;">${avatarInitials(sn)}</div>
            <div><strong style="font-size:14px;">${sn}</strong> <span class="id-code">${st.admission_id}</span></div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            ${att?`<span class="badge ${att.status==='present'?'badge-success':'badge-danger'}">${att.status}</span>`:'<span class="badge badge-gray">Not marked</span>'}
            ${rep.supervisor_checked?'<span class="badge badge-success">✓ Checked</span>':'<span class="badge badge-amber">Pending check</span>'}
          </div>
        </div>
        ${isPresent||rep.classwork_completed?`
        <div class="form-grid" style="gap:12px;">
          <div class="field"><label>Classwork completed</label><input type="text" class="lr-classwork" data-student="${st.student_id||st.id}" value="${rep.classwork_completed||''}" placeholder="e.g. Fractions pp.24-26"></div>
          <div class="field"><label>Homework set</label><input type="text" class="lr-hw-set" data-student="${st.student_id||st.id}" value="${rep.homework_set||''}" placeholder="e.g. pg 27-30 Q1-10"></div>
          <div class="field" style="grid-column:1/-1;"><label>Diary entry / activity</label><input type="text" class="lr-diary" data-student="${st.student_id||st.id}" value="${rep.diary_entry||''}" placeholder="Brief description of today's lesson activity"></div>
          <div class="field"><label>What Went Well (WWW)</label><textarea class="lr-www" data-student="${st.student_id||st.id}" rows="2" style="resize:vertical;">${rep.www||''}</textarea></div>
          <div class="field"><label>Even Better If (EBI)</label><textarea class="lr-ebi" data-student="${st.student_id||st.id}" rows="2" style="resize:vertical;">${rep.ebi||''}</textarea></div>
          <div class="field"><label>Previous homework marked</label>
            <select class="lr-hw-marked" data-student="${st.student_id||st.id}">
              <option value="false" ${!rep.homework_marked?'selected':''}>✗ Not marked</option>
              <option value="true" ${rep.homework_marked?'selected':''}>✓ Marked</option>
            </select>
          </div>
        </div>
        <div style="margin-top:12px;text-align:right;">
          <button class="btn btn-primary btn-sm" data-action="save-lr" data-student="${st.student_id||st.id}" data-session="${selId}">Save report</button>
        </div>`:'<div style="padding:8px 0;color:var(--text3);font-size:13px;">Student absent — no report needed</div>'}
      </div>`;
    }).join('')}
  </div>`:''}

  ${tab==='supervisor'?`
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div class="highlight-card" style="margin-bottom:8px;">
      <div style="font-size:13px;color:var(--accent-text);font-weight:600;margin-bottom:6px;">Supervisor check instructions</div>
      <div style="font-size:12px;color:var(--text2);line-height:1.8;">For each student: verify ✓ previous HW was marked · classwork was given · new HW was set · diary is complete. Then tick the supervisor check.</div>

const TS_SLOTS = {
  wd_main:{label:'17:00 – 19:00', paid_mins:120, day_type:'weekday'},

};

function renderTeacherSchedule(){
  const d=state.data.teacher_schedule||{};
  const teachers=d.teachers||[];
  const sessions=d.sessions||[];
  const weekStart=d.week||'';

  // build week days array
  const days=[];
  if(weekStart){
    const base=new Date(weekStart+'T00:00:00');
    for(let i=0;i<7;i++){
      const dt=new Date(base);dt.setDate(base.getDate()+i);
      days.push({date:dt.toISOString().slice(0,10),label:dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),isWe:(dt.getDay()===0||dt.getDay()===6)});
    }
  }

  // week nav
  let prevWeek='',nextWeek='';
  if(weekStart){
    const b=new Date(weekStart+'T00:00:00');
    const p=new Date(b);p.setDate(b.getDate()-7);
    const n=new Date(b);n.setDate(b.getDate()+7);
    const toISO=dt=>{const y=dt.getFullYear();const jan4=new Date(y,0,4);const diff=(dt-jan4)/86400000;const w=Math.ceil((diff+jan4.getDay()+1)/7);return y+'-W'+(w<10?'0'+w:w);};
    prevWeek=toISO(p);nextWeek=toISO(n);
  }

  // session lookup: date+slot_key → [teacher_name, session_id]
  const slotMap={};
  sessions.forEach(s=>{
    const k=s.date+'|'+s.slot_key;
    if(!slotMap[k])slotMap[k]=[];
    slotMap[k].push(s);
  });

  // hours summary per teacher this week
  const hoursMap={};
  sessions.forEach(s=>{hoursMap[s.staff_id]=(hoursMap[s.staff_id]||0)+s.paid_mins;});

  // summary bar
  const totalHrs=Object.values(hoursMap).reduce((a,b)=>a+b,0)/60;
  const totalSess=sessions.length;

  // grid
  const dayHeaders=days.map(d=>'<th style="padding:10px 8px;font-size:12px;font-weight:600;text-align:center;border-bottom:2px solid var(--border);white-space:nowrap;background:'+(d.isWe?'var(--accent-light,#eff6ff)':'var(--surface)')+';">'+d.label+'</th>').join('');

  // rows: one per slot type visible for that day type
  const weekdaySlots=['wd_main','wd_2'];
  const weekendSlots=['we_1','we_2','we_3','we_4'];

  let rows='';
  // weekday row
  rows+='<tr style="border-bottom:1px solid var(--border);"><td style="padding:8px 12px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--text2);background:var(--surface2);border-right:1px solid var(--border);">'+TS_SLOTS.wd_main.label+'<br><span style="font-size:10px;color:var(--text3);">Weekday · 4h</span></td>';
  days.forEach(function(day){

function renderModal(){const m=state.modal?.name||state.modal;
if(m==='admission-slip')return modalAdmissionSlip();
if(m==='reg-form'){
  const s=state.modal?.student||{};
  const field=(label,val)=>val?'<tr><td style="padding:5px 10px 5px 0;color:#6b7280;font-size:13px;width:40%;">'+label+'</td><td style="padding:5px 0;font-size:13px;font-weight:500;">'+val+'</td></tr>':'';
  const section=(title)=>'<tr><td colspan="2" style="padding:10px 0 4px;font-weight:700;color:#1e3a5f;font-size:14px;border-bottom:2px solid #2563eb;">'+title+'</td></tr>';
  const body='<div class="reg-form-wrap" id="reg-form-print">'+
    '<div style="text-align:center;margin-bottom:16px;">'+
    '<div style="font-size:22px;font-weight:800;color:#1e3a5f;">Fine Tutors</div>'+
    '<div style="font-size:14px;color:#2563eb;font-weight:600;">'+(s.branch_name||'')+'</div>'+
    '<div style="font-size:18px;font-weight:700;margin-top:6px;color:#111;">Contract Form</div></div>'+
    '<table style="width:100%;border-collapse:collapse;margin-bottom:16px;">'+
    section('Student Details')+
    field('Full Name',s.name)+
    field('Admission ID',s.admission_id)+
    field('Date of Birth',s.date_of_birth)+
    field('Gender',s.gender)+
    field('Year Group',s.year_group)+
    field('Current School',s.current_school)+
    section('Parent / Carer 1')+
    field('Name',(s.carer1_first_name||'')+' '+(s.carer1_last_name||''))+
    field('Address',s.carer1_address)+
    field('Postcode',s.carer1_postcode)+
    field('Telephone',s.carer1_telephone)+
    field('Mobile',s.carer1_mobile)+
    field('Email',s.carer1_email)+
    field('Occupation',s.carer1_occupation)+
    ((s.carer2_first_name||s.carer2_last_name)?
    section('Parent / Carer 2')+
    field('Name',(s.carer2_first_name||'')+' '+(s.carer2_last_name||''))+
    field('Address',s.carer2_address)+
    field('Postcode',s.carer2_postcode)+
    field('Telephone',s.carer2_telephone)+
    field('Mobile',s.carer2_mobile)+
    field('Email',s.carer2_email)+
    field('Occupation',s.carer2_occupation):'')+
    ((s.emergency_name)?
    section('Emergency Contact')+
    field('Name',s.emergency_name)+
    field('Telephone',s.emergency_telephone)+
    field('Relationship',s.emergency_relation):'')+
    '</table>'+
    '<div style="margin-top:16px;padding:14px;background:#f0f4ff;border-radius:8px;border-left:4px solid #2563eb;">'+
    '<div style="font-weight:700;color:#1e3a5f;font-size:15px;margin-bottom:12px;text-align:center;">Terms and Conditions</div>'+
    '<div style="font-weight:700;color:#1e3a5f;margin:10px 0 4px;">Parents — I agree to:</div>'+
    '<ol style="margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.8;">'+
    '<li>Attendance and punctuality are important for your child’s progress. Children must come on time for lessons.</li>'+
    '<li>If your child has been absent, they will have up to 30 days from the day of absence to book in a catch-up session.</li>'+
    '<li>If you have informed us about their absence prior to the lesson starting, your child will be entitled to a catch-up session.</li>'+
    '<li>Inform about any changes to lesson plan before the 25th of the month so that it can be changed for the following month.</li>'+
    '<li>Give 4 weeks’ notice required upon pausing or ending lessons.</li>'+
    '<li>Support my child at home with their learning and make sure homework is completed.</li></ol>'+
    '<hr style="border:none;border-top:1px solid #d1d5db;margin:8px 0;">'+
    '<div style="font-weight:700;color:#1e3a5f;margin:10px 0 4px;">Pupil — I agree to:</div>'+
    '<ol style="margin:0 0 10px;padding-left:20px;font-size:13px;line-height:1.8;">'+
    '<li>I will always come in for all my lessons and be on time at the beginning of the day, after lunch and breaks.</li>'+
    '<li>Come prepared with my books, stationery, notebooks and completed homework.</li>'+
    '<li>Treat others how you want to be treated, with kindness. Be respectful towards my classmates, teachers, and belongings.</li>'+
    '<li>I will listen to my teachers and wait for my turn when speaking.</li>'+
    '<li>Have a good attitude and positive behaviour when I come into class.</li>'+
    '<li>Use the bathroom before lesson starts and only allowed to use the bathroom once during the lesson (unless you have provided a medical note).</li>'+
    '<li>Do not eat or drink in class (except for water).</li>'+
    '<li>Come prepared with my snacks and will not leave my classroom during break times.</li>'+
    '<li>No phones allowed during lesson.</li></ol>'+
    '<div style="font-size:13px;margin-bottom:4px;"><u>If the following terms have not been met:</u></div>'+
    '<ul style="margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.8;">'+
    '<li><strong>First warning</strong> – Parents are informed, and pupil sent home.</li>'+
    '<li><strong>Second warning</strong> – Lessons will be suspended for one week and parents called in for a meeting.</li>'+
    '<li><strong>Final decision</strong> – Pupil will be suspended.</li></ul>'+
    '<hr style="border:none;border-top:1px solid #d1d5db;margin:8px 0;">'+
    '<div style="font-weight:700;color:#1e3a5f;margin:10px 0 4px;">Fine Tutors — I agree to:</div>'+
    '<ol style="margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.8;">'+
    '<li>Create a safe and welcoming environment.</li>'+
    '<li>Provide excellent learning support for all pupils.</li>'+
    '<li>Provide regular updates on pupil progress with parents. You are welcome to arrange a face-to-face appointment for updates on your child’s progress at any point in the year.</li></ol></div>'+
    '<table style="width:100%;margin-top:28px;border-collapse:collapse;">'+
    '<tr>'+
    '<td style="width:38%;border-top:1px solid #374151;padding-top:8px;font-size:12px;color:#6b7280;">Parent/Guardian Signature</td>'+
    '<td style="width:8%;"></td>'+
    '<td style="width:38%;border-top:1px solid #374151;padding-top:8px;font-size:12px;color:#6b7280;">Fine Tutors Signature</td>'+
    '<td style="width:8%;"></td>'+
    '<td style="width:8%;border-top:1px solid #374151;padding-top:8px;font-size:12px;color:#6b7280;">Date</td>'+
    '</tr></table>'+
    '</div>';
  const footer='<button class="btn no-print" onclick="printContractForm()">🖨 Print</button>'+
    '<button class="btn no-print" data-action="email-reg-form">✉ Email to parent</button>'+
    '<button class="btn no-print" data-action="save-reg-portal">💾 Save to portal</button>';
  return mWrap('📄 Contract Form — '+s.name,body,footer);}

function modalAdmissionSlip(){
  var s=state.modal&&state.modal.student||{};
  var tm=s.timetable||[];
  function getSubj(dt,slot){
    var ck=slot.replace(/[-–—]/g,'-').replace(/\s/g,'');
    for(var i=0;i<tm.length;i++){
      var r=tm[i];
      if(r.day_type===dt&&r.slot.replace(/[-–—]/g,'-').replace(/\s/g,'')==ck)return r.subject||'';
    }return '';
  }
  var subjects=[...new Set(tm.map(r=>r.subject).filter(Boolean))].sort();
  var today=new Date();
  var endYear=(today.getMonth()<7)?today.getFullYear():today.getFullYear()+1;
  var start=(s.created_at||'').slice(0,10);
  var end=endYear+'-07-31';
  var subjRows='';
  for(var i=0;i<4;i++){var v=subjects[i]||'';subjRows+='<tr><td style="border:1px solid #000;padding:5px 8px;">'+(i+1)+'. '+v+'</td></tr>';}
  var wdSlots=['17:00 - 19:00','19:00 - 21:00'];
  var weSlots=['09:00 - 11:00','11:15 - 13:15','14:00 - 16:00','16:15 - 18:15'];
  var wdRows='';
  wdSlots.forEach(function(sl){
    var subj=getSubj('weekday',sl);
    var cells=subj?'<td colspan="5" style="border:1px solid #000;padding:5px;text-align:center;">'+subj+'</td>':
      Array(5).fill('<td style="border:1px solid #000;padding:5px;"></td>').join('');
    wdRows+='<tr><td style="border:1px solid #000;padding:5px 8px;">'+sl+'</td>'+cells+'</tr>';
  });
  var weRows='';
  weSlots.forEach(function(sl){
    var ss=getSubj('saturday',sl),su=getSubj('sunday',sl);
    weRows+='<tr><td style="border:1px solid #000;padding:5px 8px;">'+sl+'</td>'+
      '<td style="border:1px solid #000;padding:5px;text-align:center;">'+ss+'</td>'+
      '<td style="border:1px solid #000;padding:5px;text-align:center;">'+su+'</td>'+
      '<td style="border:1px solid #000;padding:5px;"></td></tr>';
  });
  var tcHtml='<p style="text-decoration:underline;font-weight:bold;margin:8px 0 4px;font-size:13px;">Lesson Plan:</p>'+
    '<ul style="margin:0 0 6px 18px;line-height:1.7;font-size:12px;">'+

function previewWeekly(){
  var from=document.getElementById('f-from-date')?.value;
  var to=document.getElementById('f-to-date')?.value;
  if(!from||!to){document.getElementById('weekly-preview').textContent='Please set both dates first.';return;}
  var days=[...document.querySelectorAll('.gen-day:checked')].map(function(el){return parseInt(el.value);});
  if(!days.length){document.getElementById('weekly-preview').textContent='Select at least one day.';return;}
  var dates=[];var d=new Date(from+'T00:00:00');var end=new Date(to+'T00:00:00');
  while(d<=end){if(days.includes(d.getDay()))dates.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  document.getElementById('weekly-preview').textContent='Will create '+dates.length+' session(s) across '+dates.length+' date(s). First: '+(dates[0]||'—')+', Last: '+(dates[dates.length-1]||'—');
}

function modalAnnouncementPreview(){
  const m=state.modal||{};
  const title=m.title||'';
  const body=m.body||'';
  const target_type=m.target_type||'all';
  const delivery=m.delivery||'portal';
  const branch=m.branch||null;
  const students=state.data.students||[];

  // Count recipients
  var recips=[];
  if(target_type==='inactive'){
    recips=students.filter(function(s){return s.status==='inactive'||s.status==='paused';});
  }else if(target_type==='inactive_single'||target_type==='student'){
    var stu=m.student||null;
    recips=stu?[stu]:[];
  }else{
    recips=students.filter(function(s){return s.status==='active';});
  }
  var withEmail=recips.filter(function(s){return s.carer1_email||s.carer2_email;});
  var noEmail=recips.length-withEmail.length;

  // Branch footer
  var bName=branch?branch.name:'Fine Tutors';
  var footerParts=[];
  if(branch){
    if(branch.address)footerParts.push('📍 '+branch.address);
    if(branch.phone)footerParts.push('📞 '+branch.phone);
    if(branch.email)footerParts.push('✉️ '+branch.email);
    if(branch.website)footerParts.push('🌐 '+branch.website);
  }
  var footerHtml=footerParts.length?'<p style="font-size:12px;color:#6b7280;line-height:2;">'+footerParts.join('<br>')+'</p>':'';

  // Target label
  var targetLabel=target_type==='inactive'?'📢 Inactive & paused students only':target_type==='student'?'Specific student: '+(m.student?.name||''):('All active parents');
  var targetColor=target_type==='inactive'?'#92400e':target_type==='student'?'#1d4ed8':'#065f46';
  var targetBg=target_type==='inactive'?'#fef3c7':target_type==='student'?'#dbeafe':'#d1fae5';

  var emailPreview='<div style="font-family:Arial,sans-serif;max-width:100%;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">'+
    '<div style="background:#2563eb;padding:16px 20px;"><h2 style="color:#fff;margin:0;font-size:16px;">'+bName+'</h2></div>'+
    '<div style="background:#f9fafb;padding:20px;border-top:none;">'+
    '<h3 style="color:#111827;margin-top:0;font-size:15px;">'+escHtml(title)+'</h3>'+
    '<p style="color:#374151;line-height:1.7;white-space:pre-wrap;font-size:13px;">'+escHtml(body)+'</p>'+
    '<hr style="border:none;border-top:1px solid #e5e7eb;margin:16px 0;">'+
    footerHtml+
    '<p style="font-size:11px;color:#9ca3af;margin-top:8px;">This message was sent by '+bName+'.</p>'+
    '</div></div>';

  var bodyHtml='<div style="margin-bottom:14px;padding:10px 14px;border-radius:6px;background:'+targetBg+';border:1px solid '+targetColor+'20;">'+
    '<div style="font-size:12px;font-weight:600;color:'+targetColor+';margin-bottom:4px;">📋 Recipients: '+targetLabel+'</div>'+
    '<div style="font-size:12px;color:'+targetColor+';">'+
      '<strong>'+withEmail.length+'</strong> parents with email addresses will receive this'+
      (noEmail>0?' · <strong>'+noEmail+'</strong> have no email on file':'')+
    '</div>'+
    (delivery==='portal'?'<div style="font-size:11px;color:var(--text3);margin-top:4px;">Delivery: internal portal only (no email will be sent)</div>':
     delivery==='email'?'<div style="font-size:11px;color:var(--text3);margin-top:4px;">Delivery: email only</div>':
     '<div style="font-size:11px;color:var(--text3);margin-top:4px;">Delivery: portal + email</div>')+
    '</div>'+
    '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;">Email preview:</div>'+
    emailPreview;

  return mWrap('Preview announcement',bodyHtml,
    '<button class="btn" id="modal-cancel">Cancel</button>'+
    '<button class="btn btn-primary" id="modal-save" data-action="confirm-send-announcement">'+
    (delivery==='portal'?'Save to portal':'✉ Confirm & Send')+

}

function spSaveLinesAndUpdate(action,idx){
  // Save current line values into state before re-rendering
  const fts=[...document.querySelectorAll('.sp-fee-type')].map(el=>el.value);
  const descs=[...document.querySelectorAll('.sp-desc')].map(el=>el.value);
  const amts=[...document.querySelectorAll('.sp-amt')].map(el=>el.value);
  const lines=fts.map((ft,i)=>({ft,desc:descs[i]||'',amt:amts[i]||''}));
  if(action==='add'){lines.push({ft:'monthly_fee',desc:'',amt:''});}
  else if(action==='remove'&&idx!=null){lines.splice(idx,1);}
  state.modal.lines=lines;
  render();
}
async function smartPaymentLoadStudent(sid){
  if(!sid){state.modal.studentId=null;state.modal.invoices=null;state.modal.showCreate=false;render();return;}
  state.modal.studentId=parseInt(sid);state.modal.invoices=null;render();
  try{
    const all=await API.get('/api/invoices?student_id='+sid);
    state.modal.invoices=all.filter(i=>parseFloat(i.balance||0)>0);
    render();
  }catch(e){state.modal.invoices=[];render();}
}

function modalParentUser(){
  const pu=state.editTarget||{};
  const allStudents=(state.data.students||[]).filter(function(s){return s.status==='active';});
  if(pu.id){
    // Filter to family-related students only (linked + same surname/email/admid prefix)
    var linkedStudents=allStudents.filter(function(s){return(pu.student_ids||[]).includes(s.id);});
    var linkedSurnames=new Set(linkedStudents.map(function(s){return(s.carer1_last_name||'').toLowerCase();}).filter(Boolean));
    var linkedEmails=new Set(linkedStudents.map(function(s){return(s.carer1_email||'').toLowerCase();}).filter(Boolean));
    var linkedBases=new Set(linkedStudents.map(function(s){return(s.admission_id||'').replace(/[a-zA-Z]+$/,'');}).filter(Boolean));
    var relatedStudents=allStudents.filter(function(s){
      if((pu.student_ids||[]).includes(s.id))return true;
      var sur=(s.carer1_last_name||'').toLowerCase();
      var eml=(s.carer1_email||'').toLowerCase();
      var base=(s.admission_id||'').replace(/[a-zA-Z]+$/,'');
      return(sur&&linkedSurnames.has(sur))||(eml&&linkedEmails.has(eml))||(base&&linkedBases.has(base));
    });

function modalEditTableAlloc(){
  const alloc=state.editTarget||{};
  const staff=state.data.staff||[];
  var staffOpts='<option value="">— No teacher —</option>';
  var tableSubject=(alloc.subject||'').toLowerCase();
  var activeStaff=staff.filter(function(s){return s.status==='active';});
  // Sort: matching subject first, then others
  activeStaff.sort(function(a,b){
    var aMatch=tableSubject&&(a.subject||'').toLowerCase().includes(tableSubject)?0:1;
    var bMatch=tableSubject&&(b.subject||'').toLowerCase().includes(tableSubject)?0:1;
    if(aMatch!==bMatch)return aMatch-bMatch;
    return a.name.localeCompare(b.name);
  });
  var lastWasMatch=null;
  activeStaff.forEach(function(s){
    var isMatch=tableSubject&&(s.subject||'').toLowerCase().includes(tableSubject);
    // Add divider between matching and non-matching
    if(lastWasMatch===true&&!isMatch){
      staffOpts+='<option disabled>─── Other staff ───</option>';
    }
    var label=s.name+' ('+s.role+(s.subject?' · '+s.subject:'')+')';
    if(isMatch)label='★ '+label;
    staffOpts+='<option value="'+s.id+'" '+(s.id===alloc.staff_id?'selected':'')+'>'+label+'</option>';
    lastWasMatch=isMatch;
  });
  const footer='<button class="btn" id="modal-cancel">Cancel</button><button class="btn btn-primary" id="modal-save">Save</button>';
  return mWrap('Assign teacher — Table '+alloc.table_no,
    '<div class="form-grid">'+
    '<div class="field" style="grid-column:1/-1;"><label>Teacher</label><select id="f-teacher-id">'+staffOpts+'</select></div>'+
    '<div class="field" style="grid-column:1/-1;"><label>Max students</label><select id="f-max-students"><option value="5" '+(alloc.max_students===5?'selected':'')+'>5 (standard)</option><option value="6" '+(alloc.max_students===6?'selected':'')+'>6 (short-staffed)</option></select></div>'+
    '<div class="field" style="grid-column:1/-1;"><label>Notes</label><input type="text" id="f-notes" value="'+(alloc.notes||'')+'" placeholder="Optional notes"></div>'+
    '</div>',footer);
}

function modalAddStudentToTable(){
  const t=state.editTarget||{};
  const allocs=state.data['table_allocs_'+t.session_id]||[];
  const alloc=allocs.find(function(a){return a.id===t.alloc_id;});
  const sess=(state.data.sessions||[]).find(function(s){return s.id===t.session_id;});
  const assignedHere=(alloc&&alloc.students)?alloc.students.map(function(s){return s.student_id;}):[];
  const placedAnywhere=[];
  allocs.forEach(function(ta){(ta.students||[]).forEach(function(s){if(!placedAnywhere.includes(s.student_id))placedAnywhere.push(s.student_id);});});
  const branchStudents=(state.data.students||[]).filter(function(s){
    return s.status==='active'&&(!sess||s.branch_id===sess.branch_id);
  });
  const allTT=state.data.all_timetables||[];
  const sessSlot=sess?sess.slot:'';
  const timetabledIds=allTT.filter(function(e){return e.slot===sessSlot;}).map(function(e){return e.student_id;});
  const pendingStudents=branchStudents.filter(function(s){return timetabledIds.includes(s.id)&&!placedAnywhere.includes(s.id)&&!assignedHere.includes(s.id);});
  const otherStudents=branchStudents.filter(function(s){return !timetabledIds.includes(s.id)&&!placedAnywhere.includes(s.id)&&!assignedHere.includes(s.id);});
  const placedStudents=branchStudents.filter(function(s){return placedAnywhere.includes(s.id)&&!assignedHere.includes(s.id);});
  var studOpts='';
  if(pendingStudents.length){
    studOpts+='<optgroup label="⏳ Pending — timetabled, not yet placed ('+pendingStudents.length+')">';
    pendingStudents.forEach(function(s){studOpts+='<option value="'+s.id+'">'+s.admission_id+' — '+s.name+'</option>';});
    studOpts+='</optgroup>';
  }
  if(otherStudents.length){
    studOpts+='<optgroup label="👥 Other students ('+otherStudents.length+')">';
    otherStudents.forEach(function(s){studOpts+='<option value="'+s.id+'">'+s.admission_id+' — '+s.name+'</option>';});
    studOpts+='</optgroup>';
  }
  if(placedStudents.length){
    studOpts+='<optgroup label="✅ Already placed on another table ('+placedStudents.length+')">';
    placedStudents.forEach(function(s){studOpts+='<option value="'+s.id+'" disabled>'+s.admission_id+' — '+s.name+'</option>';});
    studOpts+='</optgroup>';
  }
  const footer='<button class="btn" id="modal-cancel">Cancel</button><button class="btn btn-primary" id="modal-save">Add student</button>';
  return mWrap('Add student to Table '+(alloc?alloc.table_no:''),
    '<div style="margin-bottom:12px;display:flex;gap:8px;">'+
    '<span class="badge badge-amber">'+pendingStudents.length+' pending</span>'+
    '<span class="badge badge-success">'+placedStudents.length+' placed</span>'+
    '<span class="badge badge-gray">'+otherStudents.length+' other</span></div>'+
    '<div class="form-grid">'+
    '<div class="field" style="grid-column:1/-1;"><label>Select student</label>'+
    '<select id="f-student-id" size="10" style="height:240px;">'+studOpts+'</select></div>'+
    '<div class="field" style="grid-column:1/-1;"><label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="f-is-catchup"> This is a catch-up student</label></div>'+
    '</div>',footer);
}

async function doSave(overrideAction){const action=overrideAction||null;const m=state.modal?.name||state.modal;const modal=state.modal;const v=id=>document.getElementById(id)?.value;const saveBtn=document.getElementById('modal-save');if(saveBtn)saveBtn.disabled=true;

  }

  const body={

    parent_contact:v('f-c1-mobile'),status:v('f-status'),notes:v('f-comments')||v('f-notes')||''
  };
  try{

document.getElementById('f-student-lookup')?.addEventListener('change',function(){
  const opt=this.options[this.selectedIndex];
  if(!opt||!opt.value)return;
  const stuId=parseInt(opt.value);
  const parentName=opt.dataset.name||'';
  const parentEmail=(opt.dataset.email||'').toLowerCase();
  const parentSurname=(opt.dataset.surname||'').toLowerCase();
  const baseAdmid=(opt.dataset.admid||'').replace(/[a-zA-Z]+$/,'');
  // Auto-fill name and email
  const nameEl=document.getElementById('f-name');
  const emailEl=document.getElementById('f-email');
  if(nameEl)nameEl.value=parentName;
  if(emailEl)emailEl.value=opt.dataset.email||'';
  // Auto-check sibling checkboxes - match by ID, surname, email, or admission ID prefix
  const summary=document.getElementById('f-linked-summary');
  const cbs=document.querySelectorAll('#f-students-list .f-student-cb');
  if(!cbs.length)return;
  var linked=[];
  cbs.forEach(function(cb){
    cb.checked=false;
    var isSibling=parseInt(cb.value)===stuId;
    if(!isSibling&&parentSurname){var s=(cb.dataset.surname||'').toLowerCase();if(s&&s===parentSurname)isSibling=true;}
    if(!isSibling&&parentEmail){var e=(cb.dataset.email||'').toLowerCase();if(e&&e===parentEmail)isSibling=true;}
    if(!isSibling&&baseAdmid){var b=(cb.dataset.admid||'').replace(/[a-zA-Z]+$/,'');if(b&&b===baseAdmid)isSibling=true;}
    if(isSibling){cb.checked=true;var lbl=cb.closest('label');linked.push(lbl?lbl.textContent.trim().split('—')[0].trim():'?');}
  });
  if(summary)summary.textContent=linked.length>1?'Auto-linked '+linked.length+' siblings: '+linked.join(', '):'1 student linked';
});

document.getElementById('ts-filter-date')?.addEventListener('change',e=>{state.tsFilterDate=e.target.value;render();});
document.getElementById('lr-date-select')?.addEventListener('change',async function(e){
  state.lrDate=e.target.value||'';
  if(state.lrDate){
    var daySess=(state.data.sessions||[]).filter(function(s){return s.date===state.lrDate;});
    var loads=[];
    daySess.forEach(function(s){
      loads.push(loadData('lr_'+s.id,'/api/lesson-reports/'+s.id));
      loads.push(loadData('lr_att_'+s.id,'/api/attendance/'+s.id));
      loads.push(loadData('sess_students_'+s.id,'/api/sessions/'+s.id+'/students'));
    });
    await Promise.all(loads);
  }
  render();
});
document.getElementById('lr-session-select')?.addEventListener('change',async e=>{
  state.lrSessionId=e.target.value?parseInt(e.target.value):null;
  state.lrTab='report';
  if(state.lrSessionId){
    await Promise.all([
      loadData('lr_'+state.lrSessionId,'/api/lesson-reports/'+state.lrSessionId),

    ]);
  }
  render();
});
document.getElementById('tr-student-select')?.addEventListener('change',async e=>{
  state.trStudentId=e.target.value?parseInt(e.target.value):null;
  if(state.trStudentId)await loadData('tr_'+state.trStudentId,'/api/test-records',{student_id:state.trStudentId});
  render();
});
document.getElementById('sr-date-select')?.addEventListener('change',async e=>{
  state.srDate=e.target.value||'';
  if(state.srDate){
    const ds=(state.data.sessions||[]).filter(s=>s.date===state.srDate);
    const b=branchParam();
    await Promise.all([
      loadData('session_report_'+state.srDate,'/api/session-report/'+state.srDate),
      loadData('students','/api/students',b),

        loadData('sr_att_'+s.id,'/api/attendance/'+s.id),
        loadData('sr_prog_'+s.id,'/api/progress',{session_id:s.id})

    ]);
  }
  render();
