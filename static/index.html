document.getElementById('sr-select')?.addEventListener('change',async e=>{state.sessionReportId=e.target.value?parseInt(e.target.value):null;if(state.sessionReportId){await Promise.all([loadData('sr_att_'+state.sessionReportId,'/api/attendance/'+state.sessionReportId),loadData('sr_prog_'+state.sessionReportId,'/api/progress',{session_id:state.sessionReportId})]);}render();});}

function bindParentEvents(){document.getElementById('parent-logout-btn')?.addEventListener('click',async()=>{await API.post('/api/logout');state.parentUser=null;state.data={};render();});document.querySelectorAll('.parent-tab-btn').forEach(btn=>{btn.addEventListener('click',()=>{state.parentTabs=state.parentTabs||{};state.parentTabs[parseInt(btn.dataset.sid)]=btn.dataset.tab;render();});});}
function closeModal(){state.modal=null;state.editTarget=null;render();}

async function handleAction(action,id,el,e){
if(state.currentUser?.role==='reports_viewer'){
  const allowedPrefixes=['export','inv-filter','inv-tab','fin-tab','fin-clear-month','mgmt-tab','filter','sort','search','print-statement','tr-tab','att-tab','session-report-tab','sr-tab','profile-tab','view-student-profile','close-student-profile'];
  const isAllowed=allowedPrefixes.some(p=>action===p||action.startsWith(p+'-')||action.startsWith(p));
  if(!isAllowed){
    toast('Your account has read-only access to reports.','error');
    return;
  }
}
if(action==='add-student'){state.modal='add-student';state.editTarget=null;const branches=state.data.branches||[];const defBranch=state.currentBranch||branches[0]?.id;if(defBranch){try{const r=await API.get('/api/students/next-id/'+defBranch);state.editTarget={admission_id:r.next_id};}catch(err){}}render();return;}
if(action==='view-student-profile'){
  const vs=(state.data.students||[]).find(function(s){return s.id===parseInt(el.dataset.id);});
  if(vs){state.profileStudent=vs;state.profileTab='overview';state.page='student_profile';
    await Promise.all([loadData('profile_invoices_'+vs.id,'/api/invoices',{student_id:vs.id}),loadData('timetable_'+vs.id,'/api/student-timetable',{student_id:vs.id})]);
    render();}return;}
if(action==='close-student-profile'){state.page='students';state.profileStudent=null;render();return;}
if(action==='profile-tab'){state.profileTab=el.dataset.tab;render();return;}
if(action==='profile-gen-invoice'){
  const pstu=state.profileStudent;
  if(!pstu||!pstu.monthly_fee){toast('No monthly fee set','error');return;}
  const today=new Date().toISOString().slice(0,7);
  const r=await API.post('/api/invoices',{student_id:pstu.id,branch_id:pstu.branch_id,month:today,amount:parseFloat(pstu.monthly_fee),fee_type:'monthly_fee',description:'Monthly fee',status:'due'});
  if(r?.error){toast(r.error,'error');return;}
  await loadData('profile_invoices_'+pstu.id,'/api/invoices',{student_id:pstu.id});
  state.profileTab='invoices';toast('Invoice generated for '+today);render();return;}
if(action==='edit-student'){
  state.modal='edit-student';
  state.editTarget=(state.data.students||[]).find(s=>s.id===id);
  await loadData('timetable_'+id,'/api/student-timetable',{student_id:id});
  render();return;
}
if(action==='del-student'){if(!confirm('Delete this student?'))return;await API.delete('/api/students/'+id);toast('Student deleted');refreshPage();return;}
if(action==='add-staff'){state.modal='add-staff';state.editTarget=null;render();return;}
if(action==='edit-staff'){state.modal='edit-staff';state.editTarget=(state.data.staff||[]).find(s=>s.id===id);render();return;}
if(action==='del-staff'){if(!confirm('Delete?'))return;await API.delete('/api/staff/'+id);toast('Staff deleted');refreshPage();return;}
if(action==='add-session'){state.modal='add-session';state.editTarget=null;await loadData('staff','/api/staff',branchParam());render();return;}
if(action==='gen-weekly-sessions'){state.modal='gen-weekly-sessions';state.editTarget=null;await loadData('staff','/api/staff',branchParam());render();return;}
if(action==='del-session'){if(!confirm('Delete?'))return;await API.delete('/api/sessions/'+id);toast('Session deleted');refreshPage();return;}
if(action==='toggle-session-students'){
  if(!state.expandedSessionStudents)state.expandedSessionStudents={};
  if(state.expandedSessionStudents[id]){
    delete state.expandedSessionStudents[id];
    render();
  }else{
    state.expandedSessionStudents[id]=true;
    if(!state.data['sess_students_'+id]){
      await loadData('sess_students_'+id,'/api/sessions/'+id+'/students');
    }
    render();
  }
  return;
}
if(action==='mark-att'){state.page='attendance';state.attSessionId=id;refreshPage();return;}
if(action==='add-user'){state.modal='add-user';state.editTarget=null;render();return;}
if(action==='edit-user'){state.modal='edit-user';state.editTarget=(state.data.users||[]).find(u=>u.id===id);render();return;}
if(action==='del-user'){if(!confirm('Delete?'))return;await API.delete('/api/users/'+id);toast('User deleted');refreshPage();return;}
if(action==='add-branch'){state.modal='add-branch';state.editTarget=null;render();return;}
if(action==='edit-branch'){state.modal='edit-branch';state.editTarget=(state.data.branches||[]).find(b=>b.id===id);render();return;}
if(action==='del-branch'){if(!confirm('Delete branch?'))return;await API.delete('/api/branches/'+id);toast('Branch deleted');refreshPage();return;}
if(action==='add-parent-user'){state.modal='add-parent-user';state.editTarget=null;render();return;}
if(action==='edit-parent-user'){state.modal='edit-parent-user';state.editTarget=(state.data.parent_users||[]).find(p=>p.id===id);render();return;}
if(action==='del-parent-user'){if(!confirm('Delete?'))return;await API.delete('/api/parent-users/'+id);toast('Account deleted');refreshPage();return;}
if(action==='confirm-smart-payment'||action==='sp-create-and-pay'){await doSave(action);return;}
if(action==='add-payment'){state.modal={name:'smart-payment',studentId:state.finStudentId||null,invoices:state.finStudentId?null:null,showCreate:false,lineCount:1};render();if(state.finStudentId)smartPaymentLoadStudent(state.finStudentId);return;}
if(action==='edit-payment'){state.modal='edit-payment';state.editTarget=(state.data.payments||[]).find(p=>p.id===id);render();return;}
if(action==='del-payment'){if(!confirm('Delete this payment?'))return;await API.delete('/api/payments/'+id);toast('Payment deleted');refreshPage();return;}
if(action==='add-instalment-plan'){state.modal='add-instalment-plan';state.editTarget=null;render();return;}
if(action==='del-instalment-plan'){if(!confirm('Delete this plan?'))return;await API.delete('/api/instalment-plans/'+id);toast('Plan deleted');refreshPage();return;}
if(action==='preview-announcement'){
  const title=(document.getElementById('ai-title')?.value||'').trim();
  const body=(document.getElementById('ai-body')?.value||'').trim();
  var target_type=document.getElementById('ai-target')?.value||'all';
  const active=document.getElementById('ai-active')?.checked!==false;
  const delivery=document.getElementById('ai-delivery')?.value||'portal';
  if(!title){toast('Title is required','error');return;}
  if(!body){toast('Message is required','error');return;}
  // Re-engagement: resolve to single student if scope=single
  var student_id=null;
  if(target_type==='inactive'&&state.annReengScope==='single'){
    student_id=state.annReengStudentId||(parseInt(document.getElementById('ai-reeng-student-id')?.value||'0')||null);
    if(!student_id){toast('Please select a student','error');return;}
    target_type='inactive_single';
  }else if(target_type==='student'){
    student_id=parseInt(document.getElementById('ai-student-id')?.value||'0')||null;
    if(!student_id){toast('Please select a student','error');return;}
  }
  const stu=student_id?(state.data.students||[]).find(s=>s.id===student_id):null;
  const branch_id=stu?stu.branch_id:(state.currentUser?.branch_id||null);
  const branch=(state.data.branches||[]).find(function(b){return b.id===branch_id;})||null;
  state.modal={name:'preview-announcement',title,body,target_type,active,student_id,student:stu,branch_id,branch,delivery};
  render();return;}
if(action==='confirm-send-announcement'){
  const m=state.modal||{};
  const api_target=m.target_type==='inactive_single'?'student':m.target_type;
  const r=await API.post('/api/announcements',{title:m.title,body:m.body,target_type:api_target,student_id:m.student_id,active:m.active,branch_id:m.branch_id});
  if(r&&r.error){toast(r.error,'error');return;}
  await loadData('announcements','/api/announcements',branchParam());
  state.modal=null;state.annInlineTarget=null;
  const titleEl=document.getElementById('ai-title');if(titleEl)titleEl.value='';
  const bodyEl=document.getElementById('ai-body');if(bodyEl)bodyEl.value='';
  if(m.delivery==='email'||m.delivery==='both'){
    const er=await API.post('/api/announcements/'+r.id+'/send-email',{});
    if(er&&er.error){toast('Saved but email failed: '+er.error,'error');}
    else{toast('Sent to '+er.sent+' parent'+(er.sent!==1?'s':'')+' by email'+(m.delivery==='both'?' + portal':''));}
  } else {toast('Announcement saved to parent portal');}
  render();return;}
if(action==='save-inline-announcement'){
  const title=(document.getElementById('ai-title')?.value||'').trim();
  const body=(document.getElementById('ai-body')?.value||'').trim();
  const target_type=document.getElementById('ai-target')?.value||'all';
  const active=document.getElementById('ai-active')?.checked!==false;
  const student_id=target_type==='student'?(parseInt(document.getElementById('ai-student-id')?.value||'0')||null):null;
  if(!title){toast('Title is required','error');return;}
  if(!body){toast('Message is required','error');return;}
  if(target_type==='student'&&!student_id){toast('Please select a student','error');return;}
  const stu=student_id?(state.data.students||[]).find(s=>s.id===student_id):null;
  const branch_id=stu?stu.branch_id:(state.currentUser?.branch_id||null);
  const r=await API.post('/api/announcements',{title,body,target_type,student_id,active,branch_id});
  if(r&&r.error){toast(r.error,'error');return;}
  await loadData('announcements','/api/announcements',branchParam());
  const t=document.getElementById('ai-title');if(t)t.value='';
  const b=document.getElementById('ai-body');if(b)b.value='';
  state.annInlineTarget=null;
  const delivery=document.getElementById('ai-delivery')?.value||'portal';
  if(delivery==='email'||delivery==='both'){
    const er=await API.post('/api/announcements/'+r.id+'/send-email',{});
    if(er&&er.error){toast('Saved but email failed: '+er.error,'error');}
    else{toast('Announcement sent to '+er.sent+' parent'+(er.sent!==1?'s':'')+' by email'+(delivery==='both'?' + portal':''));}
  } else {toast('Announcement saved to parent portal');}
  render();return;}
if(action==='send-announcement-email'){
  const ann=(state.data.announcements||[]).find(a=>a.id===id);
  const target=ann?.target_type==='student'?(' to '+ann.student_name):'to all parents';
  if(!confirm('Send \''+ann?.title+'\' by email '+target+'?'))return;
  const r=await API.post('/api/announcements/'+id+'/send-email',{});
  if(r&&r.error){toast(r.error,'error');return;}
  toast('Sent to '+r.sent+' parent'+(r.sent!==1?'s':'')+(r.failed?' ('+r.failed+' failed)':''));return;}
if(action==='reg-form'){
  e.stopPropagation();
  const stu=(state.data.students||[]).find(s=>s.id===id)||{id};
  state.modal={name:'reg-form',student:stu};render();
  try{
    const rd=await API.get('/api/students/'+id+'/registration-form');
    state.modal={name:'reg-form',student:rd};render();
  }catch(err){
    toast((err&&err.error)||'Could not load registration form','error');
    state.modal=null;render();
  }
  return;}
if(action==='admission-slip'){
  e.stopPropagation();
  const stu=(state.data.students||[]).find(s=>s.id===id)||{id};
  state.modal={name:'admission-slip',student:stu};render();
  try{
    const rd=await API.get('/api/students/'+id+'/admission-slip');
    state.modal={name:'admission-slip',student:rd};render();
  }catch(err){
    toast((err&&err.error)||'Could not load admission slip','error');
    state.modal=null;render();
  }
  return;}
if(action==='email-admission-slip'){
  if(!confirm('Send this admission slip to the parent email? This cannot be undone.'))return;
  const sid=state.modal&&state.modal.student&&state.modal.student.id;
  if(!sid)return;
  try{
    const r=await API.post('/api/students/'+sid+'/email-admission-slip',{});
    toast('Admission slip sent to: '+r.sent_to.join(', '));
  }catch(err){toast((err&&err.error)||'Failed to send','error');}
  return;}
if(action==='email-reg-form'){
  const sid=state.modal?.student?.id;
  if(!sid)return;
  if(!confirm('Send this contract form to the parent\'s email address? This cannot be undone.'))return;
  const r=await API.post('/api/students/'+sid+'/email-registration',{});
  if(r&&r.error){toast(r.error,'error');return;}
  toast('Registration form sent to: '+r.sent_to.join(', '));
  state.modal.student._reg_sent=true;render();return;}
if(action==='save-reg-portal'){
  const sid=state.modal?.student?.id;
  if(!sid)return;
  await API.post('/api/students/'+sid+'/save-registration',{});
  toast('Saved to parent portal');
  state.modal.student._reg_sent=true;render();return;}
if(action==='send-fee-reminder'){
  const cc=state.data.credit_control||[];
  const st=cc.find(r=>r.student_id===id);
  if(!st){toast('Student not found','error');return;}
  if(!st.parent_email){toast('No parent email found for this student','error');return;}
  state.modal={name:'fee-reminder-preview',student:st};render();return;}
if(action==='view-reminder-history'){
  const logs=await API.get('/api/credit-control/history/'+id);
  if(!logs||logs.error){toast(logs?.error||'Failed to load history','error');return;}
  const cc=state.data.credit_control||[];
  const st=cc.find(r=>r.student_id===id);
  const tableRows=logs.length?logs.map(l=>'<tr>'+
    '<td style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;">'+l.sent_at+'</td>'+
    '<td style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;">'+l.recipient_email+'</td>'+
    '<td style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;">£'+parseFloat(l.outstanding_amt).toFixed(2)+'</td>'+
    '<td style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;">'+l.invoices_count+' invoice'+(l.invoices_count!==1?'s':'')+'</td>'+
    '<td style="padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text3);">'+(l.sent_by_name||'System')+'</td>'+
    '</tr>').join(''):'<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--text3);">No reminders sent yet for this student.</td></tr>';
  const body='<table style="width:100%;border-collapse:collapse;">'+
    '<thead><tr>'+
    '<th style="padding:8px 12px;text-align:left;font-size:12px;color:var(--text3);border-bottom:2px solid var(--border);">Sent At</th>'+
    '<th style="padding:8px 12px;text-align:left;font-size:12px;color:var(--text3);border-bottom:2px solid var(--border);">Sent To</th>'+
    '<th style="padding:8px 12px;text-align:left;font-size:12px;color:var(--text3);border-bottom:2px solid var(--border);">Amount</th>'+
    '<th style="padding:8px 12px;text-align:left;font-size:12px;color:var(--text3);border-bottom:2px solid var(--border);">Invoices</th>'+
    '<th style="padding:8px 12px;text-align:left;font-size:12px;color:var(--text3);border-bottom:2px solid var(--border);">Sent By</th>'+
    '</tr></thead><tbody>'+tableRows+'</tbody></table>';
  state.modal={name:'reminder-history',html:body,studentName:st?.student_name||''};render();return;}
if(action==='confirm-assign-teacher'){
  const tid=parseInt(document.getElementById('at-teacher')?.value||'0');
  const notes=document.getElementById('at-notes')?.value||'';
  const m=state.modal;
  if(!tid){toast('Select a teacher','error');return;}
  const r=await API.post('/api/teacher-sessions',{staff_id:tid,date:m.date,slot_key:m.slotKey,notes});
  if(r&&r.error){toast(r.error,'error');return;}
  state.modal=null;await loadTeacherSchedule();return;}
if(action==='create-batch-invoice'){
  state.modal='create-batch-invoice';window._lineCount=1;render();return;}
if(action==='save-batch-invoice'){
  const sid=parseInt(document.getElementById('bi-student')?.value||'0');
  const month=document.getElementById('bi-month')?.value||'';
  if(!sid){toast('Please select a student','error');return;}
  if(!month){toast('Please select a month','error');return;}
  const items=[];
  document.querySelectorAll('.line-item-row').forEach(function(row){
    const ft=row.querySelector('.li-type')?.value||'monthly_fee';
    const amt=parseFloat(row.querySelector('.li-amount')?.value||'0');
    const desc=row.querySelector('.li-desc')?.value||'';
    if(amt>0) items.push({fee_type:ft,amount:amt,description:desc});
  });
  if(!items.length){toast('Add at least one charge','error');return;}
  const r=await API.post('/api/invoices/batch',{student_id:sid,month,items});
  if(r&&r.error){toast(r.error,'error');return;}
  await loadData('invoices','/api/invoices',branchParam());
  await loadData('invoices','/api/invoices',branchParam());
  state.modal={name:'batch-invoice-result',batch:r.items,batch_id:r.batch_id};render();return;}
if(action==='email-smart-receipt'){
  if(!confirm('Email this receipt to the parent?'))return;
  const results=state.modal?.results||[];
  if(!results.length)return;
  const method=state.modal?.method||'cash';
  const reference=state.modal?.reference||'';
  // Email receipt for each invoice that was paid
  let sent=[];
  for(const r of results){
    if(!r.id)continue;
    try{
      const res=await API.post('/api/invoices/'+r.id+'/email-receipt',{amount_paid:r.amtPaid,method,reference});
      if(res.sent_to)sent=[...sent,...res.sent_to];
    }catch(e){}
  }
  const unique=[...new Set(sent)];
  if(unique.length)toast('Receipt emailed to: '+unique.join(', '));
  else toast('No parent email found','error');
  return;}
if(action==='email-payment-receipt'){
  const inv=state.modal?.invoice||{};
  const sid=inv.student_id;
  if(!sid){toast('No student found','error');return;}
  if(!confirm('Email this receipt to the parent?'))return;
  try{
    const amtPaid=state.modal?.amtPaid||0;
    const method=state.modal?.method||'cash';
    const reference=state.modal?.reference||'';
    const r=await API.post('/api/invoices/'+inv.id+'/email-receipt',{amount_paid:amtPaid,method,reference});
    toast('Receipt emailed to: '+r.sent_to.join(', '));
  }catch(err){toast((err&&err.error)||'Failed to send','error');}
  return;}
if(action==='confirm-batch-payment'){
  const batchId=state.modal?.batch_id;
  if(!batchId)return;
  const inputs=[...document.querySelectorAll('.pay-amount-input')];
  const payments=inputs.map(el=>({invoice_id:parseInt(el.dataset.iid),amount_paid:parseFloat(el.value)||0})).filter(p=>p.amount_paid>0);
  if(!payments.length){toast('Enter at least one payment amount','error');return;}
  const method=document.getElementById('pay-method')?.value||'cash';
  const reference=document.getElementById('pay-ref')?.value||'';
  try{
    const r=await API.post('/api/invoices/batch/'+batchId+'/pay',{payments,method,reference});
    await loadData('invoices','/api/invoices',branchParam());
    state.modal={name:'batch-invoice-result',batch:r.items,batch_id:batchId,showReceipt:true,paymentInfo:{method,reference}};
    render();toast('Payment recorded');
  }catch(err){toast((err&&err.error)||'Payment failed','error');}
  return;}
if(action==='email-batch-invoice'){
  const bid=state.modal?.batch_id;if(!bid)return;
  const r=await API.post('/api/invoices/batch/'+bid+'/email',{});
  if(r&&r.error){toast(r.error,'error');return;}
  toast('Invoice emailed to: '+r.sent_to.join(', '));return;}
if(action==='confirm-fee-reminder'){
  const st=state.modal?.student;
  if(!st){return;}
  const r=await API.post('/api/credit-control/send-reminder/'+st.student_id,{});
  if(r&&r.error){toast(r.error,'error');return;}

if(action==='lp-generate'){
  var lpDate=state.lpDate||new Date().toISOString().slice(0,10);
  var maxPer=state.lpMaxPer||5;
  function getDT(d){var w=new Date(d+'T00:00:00').getDay();return w===6?'saturday':w===0?'sunday':'weekday';}
  // Key Stage grouping: KS1/2 = Y1-6, KS3 = Y7-9, KS4 = Y10-11
  function getKS(yearGroup){
    var m=(yearGroup||'').match(/\d+/);
    var y=m?parseInt(m[0]):0;
    if(y<=6)return '1_KS1\/2';
    if(y<=9)return '2_KS3';
    return '3_KS4';
  }
  function ksLabel(ks){return ks.slice(2);}
  var dayType=getDT(lpDate);
  var allTT=state.data.all_timetables||[];
  var lpMode=state.lpMode||'full';
  var lpSlot=state.lpSlot||'';
  var lpSubject=state.lpSubject||'';
  var allForDay=allTT.filter(function(t){return t.day_type===dayType;});
  function slotIsAM3(slot){var m=(slot||'').match(/\((\d+):/);return m&&parseInt(m[1])<14;}
  var expected=lpMode==='am'?allForDay.filter(function(t){return slotIsAM3(t.slot);}):lpMode==='pm'?allForDay.filter(function(t){return !slotIsAM3(t.slot);}):lpMode==='single'&&lpSlot&&lpSubject?allForDay.filter(function(t){return t.slot===lpSlot&&t.subject===lpSubject;}):allForDay;
  // Group by slot + subject + Key Stage
  var groups={};
  expected.forEach(function(t){
    var ks=getKS(t.year_group);
    var k=t.slot+'||'+t.subject+'||'+ks;
    if(!groups[k])groups[k]={slot:t.slot,subject:t.subject,ks:ks,students:[]};
    groups[k].students.push(t);
  });
  // Split into tables, ordered by slot → subject → KS; number resets per slot
  var tables=[];
  var slotCounters={};
  Object.keys(groups).sort().forEach(function(k){
    var g=groups[k];
    if(!slotCounters[g.slot])slotCounters[g.slot]=1;
    var studs=g.students.slice().sort(function(a,b){
      var ya=parseInt((a.year_group||'0').match(/\d+/)||0);
      var yb=parseInt((b.year_group||'0').match(/\d+/)||0);
      return ya-yb;
    });
    for(var i=0;i<studs.length;i+=maxPer){
      tables.push({table_no:slotCounters[g.slot]++,slot:g.slot,subject:g.subject,ks:ksLabel(g.ks),teacher_id:null,students:studs.slice(i,i+maxPer)});
    }
  });
  state.planDraft={date:lpDate,dayType:dayType,tables:tables};
  render();return;
}

  const wb=XLSX.utils.book_new();

    ['Student Name','Parent/Carer Name','Parent Email','Year Group','Branch','Notes'],
    ['Example Student','Jane Smith','jane@example.com','Year 6','Harlesden',''],
  ]);
  ws['!cols']=[{wch:20},{wch:22},{wch:28},{wch:12},{wch:16},{wch:20}];

if(action==='import-students-preview'){
  const fileInput=document.getElementById('import-file-input');
  if(!fileInput||!fileInput.files.length){toast('Please select a file first','warn');return;}
  const file=fileInput.files[0];
  const reader=new FileReader();
  reader.onload=async function(e){
    let rows=[];
    try{
      if(file.name.endsWith('.csv')){
        const text=e.target.result;
        const lines=text.trim().split('\n');
        const headers=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
        rows=lines.slice(1).map((line,i)=>{
          const vals=line.split(',').map(v=>v.replace(/^"|"$/g,'').trim());
          const obj={row:i+2};
          headers.forEach((h,j)=>{obj[h]=vals[j]||'';});
          return obj;
        }).filter(r=>Object.values(r).some((v,i)=>i>0&&v));
      } else {
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const data=XLSX.utils.sheet_to_json(ws,{defval:''});
        rows=data.map((r,i)=>({row:i+2,...r}));
      }
    } catch(ex){toast('Could not parse file: '+ex.message,'error');return;}
    // Validate rows client-side
    const branches=(state.data.branches||[]).filter(b=>b.status==='active');
    const branchNames=branches.map(b=>b.name.trim().toLowerCase());
    const valid=[],skipped=[],errors=[];
    rows.forEach(r=>{
      const name=(r['Student Name']||r['name']||'').trim();
      const email=(r['Parent Email']||r['carer_email']||'').trim().toLowerCase();
      const branch=(r['Branch']||r['branch']||'').trim().toLowerCase();
      if(!name){errors.push({row:r.row,reason:'Missing student name'});return;}
      if(!branchNames.includes(branch)){errors.push({row:r.row,name,reason:`Branch "${r['Branch']||branch}" not found`});return;}
      const bObj=branches.find(b=>b.name.trim().toLowerCase()===branch);
      valid.push({row:r.row,name,year_group:(r['Year Group']||r['year_group']||'').trim(),branch:bObj?bObj.name:branch,carer_name:(r['Parent/Carer Name']||r['carer_name']||'').trim(),carer_email:email,notes:(r['Notes']||r['notes']||'').trim()});
    });
    state.importPreview={rows,valid,skipped,errors};
    state._importValidRows=valid;
    render();
  };
  if(file.name.endsWith('.csv')) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
  return;}
if(action==='import-students-back'){state.importPreview=null;render();return;}

function exportStatement(stmt){
  const rows=[];
  rows.push(['FTApp — Statement of account']);
  rows.push(['Student',stmt.student.name]);
  rows.push(['Admission ID',stmt.student.admission_id]);
  rows.push(['Branch',stmt.student.branch_name]);
  rows.push(['Year group',stmt.student.year_group||'']);
  rows.push(['Date produced',new Date().toLocaleDateString('en-GB')]);
  rows.push([]);
  rows.push(['Date','Description','Charged (Dr)','Paid (Cr)','Balance']);
  stmt.transactions.forEach(t=>{
    rows.push([
      t.date||'',
      t.description+(t.notes?' — '+t.notes:''),
      t.debit>0?t.debit.toFixed(2):'',
      t.credit>0?t.credit.toFixed(2):'',
      t.balance.toFixed(2)
    ]);
  });
  rows.push([]);
  rows.push(['','','Total charged',stmt.summary.total_charged.toFixed(2),'']);
  rows.push(['','','Total paid',stmt.summary.total_paid.toFixed(2),'']);
  rows.push(['','','Closing balance',stmt.summary.closing_balance.toFixed(2),'']);
  exportXLSX(rows, `Statement_${stmt.student.admission_id}_${stmt.student.name.replace(/\s+/g,'_')}.xlsx`, 'Statement');
  toast('Statement exported');
}

// Global nav function - called directly from onclick in iOS
window.navTo=function(el){
  try{
    const page=typeof el==='string'?el:(el&&el.dataset?el.dataset.page:el);
    if(!page)return false;
    const sb=document.querySelector('.sidebar');
    const ov=document.getElementById('sidebar-overlay');
    if(sb)sb.classList.remove('open');
    if(ov)ov.classList.remove('open');
    // Update bottom nav active state
    document.querySelectorAll('.bottom-nav a').forEach(function(a){
      a.classList.toggle('active',a.dataset.page===page);
    });
    state.page=page;
    render();
    refreshPage();
  }catch(e){console.error('Nav error:',e);}
  return false;
};

// STATIC BOTTOM NAV - wired once at boot, never destroyed
function initMobileNav(){
  var nav=document.getElementById('mobile-bottom-nav');
  if(!nav)return;
  if(window.innerWidth<=768&&state.currentUser)nav.style.display='flex';
  window.addEventListener('resize',function(){
    nav.style.display=window.innerWidth<=768?'flex':'none';
  });
}

// PERSISTENT DELEGATED NAV - survives re-renders, works on mobile touch
var _navLock=false;
function _doNav(el){
  if(_navLock)return;
  _navLock=true;
  setTimeout(function(){_navLock=false;},400);
  const sb=document.querySelector('.sidebar');
  const ov=document.getElementById('sidebar-overlay');
  if(sb)sb.classList.remove('open');
  if(ov)ov.classList.remove('open');
  state.page=el.dataset.page;
  refreshPage();
}
document.addEventListener('touchstart',function(e){
  const navEl=e.target.closest('[data-page]');
  if(navEl){_doNav(navEl);}
},{passive:true});
document.addEventListener('click',function(e){
  const navEl=e.target.closest('[data-page]');
  if(navEl){_doNav(navEl);}
});
