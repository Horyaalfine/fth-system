<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTApp — Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Core backgrounds - cream/warm white main area */
  --bg:#f5f0e8;--surface:#fffdf7;--surface2:#f0ebe0;--surface3:#e8e2d6;
  --border:#d4c9b8;--border2:#bfb5a4;
  /* Text - navy/blue for readability on cream */
  --text:#1a2744;--text2:#2d3f6b;--text3:#4a5a8a;
  /* Accent colours */
  --accent:#2563eb;--accent-bg:rgba(37,99,235,0.1);--accent-text:#1d4ed8;
  --success:#16a34a;--success-bg:rgba(22,163,74,0.1);--success-text:#15803d;
  --warning:#d97706;--warning-bg:rgba(217,119,6,0.1);
  --danger:#dc2626;--danger-bg:rgba(220,38,38,0.1);--danger-text:#b91c1c;
  --purple:#7c3aed;--purple-bg:rgba(124,58,237,0.1);--purple-text:#6d28d9;
  --teal:#0d9488;--teal-bg:rgba(13,148,136,0.1);--teal-text:#0f766e;
  --amber:#b45309;--amber-bg:rgba(180,83,9,0.1);--amber-text:#92400e;
  --blue:#2563eb;--blue-bg:rgba(37,99,235,0.1);--blue-text:#1d4ed8;
  --pink:#be185d;--pink-bg:rgba(190,24,93,0.1);
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  /* Inter font - highly readable at all sizes */
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 4px 24px rgba(26,39,68,0.1);--shadow-lg:0 8px 40px rgba(26,39,68,0.15);
  --glow:0 0 20px rgba(37,99,235,0.15);
  /* Sidebar-specific (kept dark) */
  --sb-bg:#0f2557;--sb-surface:#1a3570;--sb-surface2:#1e3d80;
  --sb-border:#2a4d9c;--sb-text:#f9fafb;--sb-text2:#d1d5db;--sb-text3:#9ca3af;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:100vh;background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(37,99,235,0.04) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(13,148,136,0.03) 0%,transparent 60%);pointer-events:none;z-index:0;}
.app{display:flex;min-height:100vh;}
.sidebar{width:240px;background:var(--sb-bg);border-right:1px solid var(--sb-border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;overflow-y:scroll;}
.main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:rgba(245,240,232,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.mobile-nav-test{display:none;}
@media(max-width:768px){.mobile-nav-test{display:flex;gap:6px;padding:8px;background:#0f2557;overflow-x:auto;position:sticky;top:60px;z-index:997;width:100%;box-sizing:border-box;}
.mobile-nav-test a{color:#fff;font-size:12px;white-space:nowrap;padding:6px 10px;background:rgba(255,255,255,0.15);border-radius:6px;text-decoration:none;flex-shrink:0;}}
.content{padding:28px;}

/* SIDEBAR */
.sidebar-brand{padding:24px 20px 20px;border-bottom:1px solid var(--sb-border);}
.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(108,99,255,0.3);}
.brand-name{font-size:17px;font-weight:700;color:var(--sb-text);letter-spacing:-0.2px;}
.brand-sub{font-size:11px;color:var(--sb-text3);margin-top:1px;letter-spacing:0.5px;text-transform:uppercase;}
.branch-switcher{margin:12px 14px 0;background:rgba(37,99,235,0.15);border-radius:var(--radius);border:1px solid rgba(37,99,235,0.3);padding:10px 12px;}
.branch-switcher label{font-size:10px;color:var(--accent);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:5px;}
.branch-switcher select{width:100%;background:transparent;border:none;font-family:var(--font);font-size:13px;font-weight:500;color:#f9fafb;cursor:pointer;outline:none;}
.branch-switcher select option{background:var(--sb-surface2);color:var(--sb-text);}
.nav-section{padding:12px 10px 0;flex:1;}
.nav-label{font-size:10px;color:var(--sb-text3);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:0 10px;margin:12px 0 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:var(--radius);cursor:pointer;color:var(--sb-text2);font-size:13px;font-weight:400;transition:all 0.15s;margin-bottom:2px;border:1px solid transparent;touch-action:manipulation;-webkit-tap-highlight-color:rgba(37,99,235,0.2);user-select:none;width:100%;background:none;text-align:left;font-family:var(--font);text-decoration:none;overflow:hidden;white-space:nowrap;}
.nav-item:hover{background:var(--sb-surface2);color:var(--sb-text);border-color:var(--sb-border);}
.nav-item.active{background:rgba(37,99,235,0.2);color:#93c5fd;font-weight:500;border-color:rgba(37,99,235,0.3);}
.nav-item svg{flex-shrink:0;opacity:0.7;}
.nav-item.active svg{opacity:1;}
.sidebar-footer{padding:14px 12px;border-top:1px solid var(--sb-border);}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);background:var(--sb-surface2);border:1px solid var(--sb-border);}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.av-purple{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;}
.av-blue{background:linear-gradient(135deg,var(--blue),var(--accent));color:#fff;}
.av-teal{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;}
.av-amber{background:linear-gradient(135deg,var(--amber),var(--pink));color:#fff;}

/* TOPBAR */
.page-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.3px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:0.02em;}
.badge-purple{background:#ffffff;color:#111827;border:1px solid #d1d5db;}
.badge-blue{background:var(--blue-bg);color:var(--blue-text);border:1px solid rgba(59,130,246,0.2);}
.badge-teal{background:var(--teal-bg);color:var(--teal-text);border:1px solid rgba(20,184,166,0.2);}
.badge-amber{background:var(--amber-bg);color:var(--amber-text);border:1px solid rgba(245,158,11,0.2);}
.badge-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.badge-success{background:var(--success-bg);color:var(--success-text);border:1px solid rgba(34,197,94,0.2);}
.badge-danger{background:var(--danger-bg);color:var(--danger-text);border:1px solid rgba(239,68,68,0.2);}
.badge-accent{background:#ffffff;color:#111827;border:1px solid #d1d5db;}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;transition:border-color 0.2s;box-shadow:0 1px 4px rgba(26,39,68,0.06);}
.metric-card:hover{border-color:var(--border2);}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.metric-card:nth-child(1)::before{background:linear-gradient(90deg,var(--accent),var(--purple));}
.metric-card:nth-child(2)::before{background:linear-gradient(90deg,var(--teal),var(--blue));}
.metric-card:nth-child(3)::before{background:linear-gradient(90deg,var(--amber),var(--pink));}
.metric-card:nth-child(4)::before{background:linear-gradient(90deg,var(--success),var(--teal));}
.metric-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.metric-label{font-size:11px;color:var(--text2);font-weight:700;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;}
.metric-value{font-size:30px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-0.5px;}
.metric-sub{font-size:11px;color:var(--text2);margin-top:6px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;box-shadow:0 1px 4px rgba(26,39,68,0.06);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.card-title{font-size:15px;font-weight:600;color:var(--text);}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px;}

/* TABLES */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;font-weight:700;color:var(--text);padding:11px 14px;border-bottom:2px solid var(--border2);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;background:var(--surface2);}
th:first-child{border-radius:8px 0 0 0;}
th:last-child{border-radius:0 8px 0 0;}
td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text);font-size:14px;}
td strong{color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.id-code{font-family:var(--mono);font-size:11px;background:var(--accent-bg);padding:3px 8px;border-radius:6px;color:var(--accent);border:1px solid rgba(37,99,235,0.2);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--surface3);border-color:var(--border2);color:var(--text);}
.btn-primary{background:var(--accent);color:#fff;border:none;box-shadow:0 2px 8px rgba(37,99,235,0.25);}
.btn-primary:hover{opacity:0.9;box-shadow:0 6px 16px rgba(108,99,255,0.4);transform:translateY(-1px);}
.btn-success{background:var(--success-bg);color:var(--success-text);border-color:rgba(34,197,94,0.2);}
.btn-danger{background:var(--danger-bg);color:var(--danger-text);border-color:rgba(239,68,68,0.2);}
.btn-danger:hover{background:rgba(239,68,68,0.2);}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important;}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.01em;margin-bottom:4px;}
.field input,.field select,.field textarea{border:1.5px solid var(--border2);border-radius:var(--radius);padding:11px 14px;font-family:var(--font);font-size:14px;background:var(--surface);color:var(--text);outline:none;transition:all 0.15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.15);background:var(--surface);}
.field input::placeholder{color:var(--text3);}
.field select option{background:#fffdf7;color:#1a2744;}
select{background:#fffdf7;color:#1a2744;}select option{background:#fffdf7;color:#1a2744;}
.field .hint{font-size:11px;color:var(--text3);}

/* MODALS */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-lg{max-width:720px;}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:17px;font-weight:700;color:var(--text);}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--surface2);border-radius:0 0 var(--radius-xl) var(--radius-xl);}

/* TOAST */
.toast-container{position:fixed;bottom:28px;right:28px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.bottom-nav{display:none;}
@media(max-width:768px){
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#0f2557;z-index:9999;border-top:1px solid #2a4d9c;justify-content:space-around;align-items:stretch;}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#d1d5db;font-size:10px;text-decoration:none;gap:2px;padding:4px 2px;border:none;background:none;font-family:var(--font);}
.bottom-nav a.active{color:#fff;background:rgba(255,255,255,0.1);}
.bottom-nav a svg{width:20px;height:20px;}
.main{padding-bottom:70px !important;}
.toast-container{bottom:80px;}
}
.toast{padding:14px 18px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;animation:slideIn 0.25s ease;display:flex;align-items:center;gap:10px;min-width:260px;box-shadow:var(--shadow);border:1px solid;}
.toast-success{background:var(--surface);color:var(--success-text);border-color:rgba(34,197,94,0.3);}
.toast-error{background:var(--surface);color:var(--danger-text);border-color:rgba(239,68,68,0.3);}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}

/* MISC */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:220px;display:flex;gap:0;}
.search-wrap input{width:100%;padding-left:14px;border-radius:var(--radius) 0 0 var(--radius);border-right:none;}
.search-btn{background:var(--accent);color:#fff;border:1.5px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:0 16px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;transition:background 0.15s;}
.search-btn:hover{background:var(--accent-text);}
.search-icon{display:none;}
.section-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-0.3px;}
.section-sub{font-size:13px;color:var(--text2);margin-bottom:22px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;}
.dot-green{background:var(--success);}
.dot-red{background:var(--danger);}
.dot-amber{background:var(--amber);}
.empty-state{text-align:center;padding:56px 24px;color:var(--text2);font-size:14px;}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
.row-actions{display:flex;gap:6px;}
.bar-row{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:13px;border-bottom:1px solid var(--border);}
.bar-row:last-child{border-bottom:none;}
.bar-bg{flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease;}
.notice-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.notice-item:last-child{border-bottom:none;}
.notice-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.att-cell{border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all 0.15s;background:var(--surface2);}
.att-cell.present{background:var(--success-bg);border-color:rgba(34,197,94,0.3);}
.att-cell.absent{background:var(--danger-bg);border-color:rgba(239,68,68,0.3);}
.att-cell:hover{border-color:var(--accent);transform:translateY(-1px);}
.att-cell{position:relative;}
.att-remove{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--danger-bg);color:var(--danger);border:none;cursor:pointer;font-size:10px;line-height:16px;text-align:center;opacity:0;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;padding:0;}
.att-cell:hover .att-remove{opacity:1;}
.att-name{font-size:12px;font-weight:600;color:var(--text);}
.att-id{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.att-status{font-size:10px;margin-top:5px;font-weight:600;letter-spacing:0.05em;}
.sibling-badge{font-size:10px;background:var(--teal-bg);color:var(--teal-text);padding:2px 7px;border-radius:8px;font-weight:600;border:1px solid rgba(20,184,166,0.2);}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:11px 20px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.stat-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2);}
.highlight-card{background:linear-gradient(135deg,var(--accent-bg),var(--purple-bg));border:1px solid rgba(108,99,255,0.2);border-radius:var(--radius-lg);padding:20px 24px;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(37,99,235,0.06) 0%,transparent 70%);}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px;width:100%;max-width:400px;position:relative;box-shadow:var(--shadow-lg);}
.login-logo-wrap{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:6px;}
.login-logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;box-shadow:0 6px 16px rgba(108,99,255,0.35);}
.login-logo{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.5px;}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:32px;margin-top:2px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:0.02em;}
.login-field input{width:100%;border:1px solid var(--border2);border-radius:var(--radius);padding:11px 14px;font-family:var(--font);font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:all 0.15s;}
.login-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,0.15);}
.login-field input::placeholder{color:var(--text3);}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;transition:all 0.15s;box-shadow:0 4px 12px rgba(37,99,235,0.3);}
.login-btn:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 6px 16px rgba(108,99,255,0.4);}
.login-btn.secondary{background:var(--surface2);color:var(--teal-text);border:1px solid rgba(20,184,166,0.2);box-shadow:none;margin-top:10px;}
.login-btn.secondary:hover{background:var(--teal-bg);box-shadow:none;}
.login-error{color:var(--danger-text);font-size:12px;margin-top:10px;text-align:center;min-height:18px;}
.login-hint{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.8;}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:80px;color:var(--text3);font-size:13px;}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin-right:12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ASSESSMENT / LEARNING PLAN SPECIFIC */
.level-badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;}
.level-1{background:var(--success-bg);color:var(--success-text);}
.level-2{background:var(--blue-bg);color:var(--blue-text);}
.level-3{background:var(--amber-bg);color:var(--amber-text);}

const API={async call(method,path,body){const opts={method,credentials:'include',headers:{'Content-Type':'application/json'}};if(body)opts.body=JSON.stringify(body);const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);opts.signal=controller.signal;try{const res=await fetch(path,opts);clearTimeout(timer);if(res.status===401){state.currentUser=null;state.parentUser=null;render();return null;}return res.ok?res.json():Promise.reject(await res.json());}catch(e){clearTimeout(timer);if(e.name==='AbortError')console.warn('Timeout:',path);throw e;}},get:(p,q)=>API.call('GET',q?p+'?'+new URLSearchParams(q):p),post:(p,body)=>API.call('POST',p,body),put:(p,body)=>API.call('PUT',p,body),delete:(p)=>API.call('DELETE',p)};

function exportXLSX(rows, filename, sheetName){
  try{
    const headers = rows[0];
    // Detect column types from header names
    const CUR_RE = /^(amount|total|balance|fee|paid|due|owing|owed|price|rate|cost|hours?|paid\s*hrs?|clock\s*hrs?)/i;
    const CUR_MATCH = /£|\(£\)|amount|balance|total|collected|outstanding|invoiced|owing|fee|charged|\(dr\)|\(cr\)|received/i;
    const DATE_MATCH = /date|issued|paid date|due date|month|dob|d\.o\.b/i;
    const colTypes = headers.map(function(h){
      const hs = String(h||'');
      if(CUR_MATCH.test(hs)) return 'currency';
      if(DATE_MATCH.test(hs) && !/month name|month group/i.test(hs)) return 'date';
      return 'text';
    });

    // Build worksheet from data, converting types
    const wsRows = rows.map(function(r, ri){
      if(ri===0) return r; // header row stays as-is
      return r.map(function(v, ci){
        const t = colTypes[ci];
        if(v==null || v==='' || v==='—') return '';
        if(t==='currency'){
          const n = parseFloat(String(v).replace(/[£,]/g,''));
          return isNaN(n) ? v : n;
        }
        if(t==='date'){
          // YYYY-MM-DD or YYYY-MM -> real Date object
          const s = String(v);
          if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
            const [y,m,d] = s.split('-').map(Number);
            return new Date(y, m-1, d);
          }
          if(/^\d{4}-\d{2}$/.test(s)){
            const [y,m] = s.split('-').map(Number);
            return new Date(y, m-1, 1);
          }
          return v;
        }
        // Try numeric for plain numbers (e.g. counts)
        if(typeof v==='number') return v;
        if(/^-?\d+(\.\d+)?$/.test(String(v))) return parseFloat(v);
        return v;
      });
    });

    const ws = XLSX.utils.aoa_to_sheet(wsRows);

    // Apply number formats per column
    const range = XLSX.utils.decode_range(ws['!ref']);
    for(let R=range.s.r+1; R<=range.e.r; R++){
      for(let C=range.s.c; C<=range.e.c; C++){
        const addr = XLSX.utils.encode_cell({r:R,c:C});
        const cell = ws[addr];
        if(!cell) continue;
        if(colTypes[C]==='currency' && typeof cell.v==='number'){
          cell.z = '£#,##0.00';
        } else if(colTypes[C]==='date' && cell.v instanceof Date){
          cell.t = 'd';
          const headerStr = String(headers[C]||'');
          cell.z = /month/i.test(headerStr) && !/date/i.test(headerStr) ? 'mmm yyyy' : 'dd/mm/yyyy';
        }
      }
    }

    // Bold header row
    for(let C=range.s.c; C<=range.e.c; C++){
      const addr = XLSX.utils.encode_cell({r:0,c:C});
      if(ws[addr]) ws[addr].s = {font:{bold:true}};
    }

    // Auto column widths
    const colWidths = headers.map(function(h, ci){
      let maxLen = String(h||'').length;
      wsRows.forEach(function(r){
        const v = r[ci];
        let len;
        if(v instanceof Date) len = 10;
        else if(typeof v==='number') len = colTypes[ci]==='currency' ? String(v.toFixed(2)).length+1 : String(v).length;
        else len = (v==null?'':String(v)).length;
        if(len>maxLen) maxLen=len;
      });
      return {wch: Math.min(40, maxLen+2)};
    });
    ws['!cols'] = colWidths;

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName||'Sheet1');
    XLSX.writeFile(wb, filename, {cellStyles:true});
  }catch(e){
    console.error('Excel export failed:',e);
    if(typeof toast==='function') toast('Export failed: '+(e.message||e),'error');
  }
}

function printLessonPlanReport(){
  var rptDate=state.rptDate;
  if(!rptDate){alert('No report loaded.');return;}
  var sessions=state.data.sessions||[];
  var staff=state.data.staff||[];
  var daySessions=sessions.filter(function(s){return s.date===rptDate;});
  var bySlot={};
  daySessions.forEach(function(s){if(!bySlot[s.slot])bySlot[s.slot]=[];bySlot[s.slot].push(s);});
  var rptSlots=Object.keys(bySlot).sort();
  var dateLabel=new Date(rptDate+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var html='<h2 style="margin:0 0 4px 0;font-size:20px;">Lesson Plan Report</h2>';
  html+='<div style="font-size:13px;color:#555;margin-bottom:20px;">'+dateLabel+'</div>';
  rptSlots.forEach(function(slot,si){
    var slotTables=bySlot[slot];
    html+='<div style="margin-bottom:20px;page-break-inside:avoid;">';
    html+='<div style="background:#1e3a8a;color:#fff;padding:8px 14px;font-size:14px;font-weight:700;border-radius:4px 4px 0 0;">Session '+(si+1)+': '+slot+'</div>';
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0;border:2px solid #1e3a8a;border-top:none;border-radius:0 0 4px 4px;overflow:hidden;">';
    slotTables.forEach(function(s,ti){
      var studs=state.data['sess_students_'+s.id]||[];
      var attRecs=state.data['rpt_att_'+s.id]||[];
      var attMap={};attRecs.forEach(function(a){attMap[a.student_id]={status:a.status};});
      var teacher=staff.find(function(t){return t.id===s.staff_id;});
      var borderL=ti>0?'border-left:1px solid #cbd5e1;':'';
      html+='<div style="padding:10px 12px;'+borderL+'border-top:1px solid #cbd5e1;">';
      html+='<div style="font-weight:700;font-size:13px;">Table '+s.table_no+'</div>';
      var _pyr=parseInt(((studs[0]||{}).year_group||'0').match(/\d+/)||0);
      var _pks=studs.length>0?(_pyr<=6?'KS1/2':_pyr<=9?'KS3':'KS4'):'';
      html+='<div style="font-size:11px;color:#555;margin-bottom:6px;">'+(s.subject||'—')+(_pks?' · '+_pks:'')+' · Teacher: '+(teacher?teacher.name:'Unassigned')+'</div>';
      if(studs.length===0){html+='<div style="font-size:11px;font-style:italic;color:#888;">No students</div>';}
      else{
        html+='<table style="width:100%;border-collapse:collapse;font-size:11px;">';
        html+='<thead><tr style="background:#f1f5f9;"><th style="padding:3px 6px 3px 0;text-align:left;">Ad No.</th><th style="padding:3px 6px 3px 0;text-align:left;">Name</th><th style="padding:3px 6px 3px 0;text-align:left;">Year</th><th style="padding:3px 0;text-align:left;">Att.</th></tr></thead><tbody>';
        studs.forEach(function(st){
          var att=(attMap[st.student_id]||attMap[st.id]||{}).status||'—';
          var attClr=att==='present'?'#166534':att==='absent'?'#991b1b':'#555';
          html+='<tr style="border-top:1px solid #e2e8f0;">';
          html+='<td style="padding:3px 6px 3px 0;color:#555;">'+(st.admission_id||'—')+'</td>';
          html+='<td style="padding:3px 6px 3px 0;font-weight:500;">'+(st.name||st.student_name||'—')+'</td>';
          html+='<td style="padding:3px 6px 3px 0;">'+(st.year_group||'—')+'</td>';
          html+='<td style="padding:3px 0;color:'+attClr+';font-weight:600;">'+att+'</td>';
          html+='</tr>';
        });
        html+='</tbody></table>';
      }
      html+='</div>';
    });
    html+='</div></div>';
  });
  var win=window.open('','_blank','width=1000,height=750');
  win.document.write('<html><head><title>Lesson Plan Report - '+dateLabel+'</title>');
  win.document.write('<style>body{font-family:Arial,sans-serif;margin:20px;color:#000;}@media print{body{margin:10px;}}</style>');
  win.document.write('</head><body>'+html+'</body></html>');
  win.document.close();
  setTimeout(function(){win.print();},500);
}

function printTeacherPlanner(){

function exportLessonPlanExcel(){
  var rptDate=state.rptDate;
  if(!rptDate){alert('No report loaded.');return;}
  var sessions=state.data.sessions||[];
  var staff=state.data.staff||[];
  var daySessions=sessions.filter(function(s){return s.date===rptDate;});
  var bySlot={};
  daySessions.forEach(function(s){if(!bySlot[s.slot])bySlot[s.slot]=[];bySlot[s.slot].push(s);});
  var rptSlots=Object.keys(bySlot).sort();
  var wb=XLSX.utils.book_new();
  rptSlots.forEach(function(slot,si){
    var slotTables=bySlot[slot].slice().sort(function(a,b){return (a.table_no||0)-(b.table_no||0);});
    var rows=[];
    // Session header
    rows.push(['SESSION '+(si+1)+': '+slot,'','','','']);
    rows.push(['','','','','']);
    slotTables.forEach(function(s){
      var studs=state.data['sess_students_'+s.id]||[];
      var attRecs=state.data['rpt_att_'+s.id]||[];
      var attMap={};attRecs.forEach(function(a){attMap[a.student_id]={status:a.status};});
      var teacher=staff.find(function(t){return t.id===s.staff_id;});
      var teacherName=teacher?teacher.name:'Unassigned';
      var ks=s.ks?(' · '+s.ks):'';
      // Table header row
      rows.push(['Table '+s.table_no+' — '+(s.subject||'—')+ks,'','','Teacher: '+teacherName,'']);
      // Column headers
      rows.push(['Ad No.','Student Name','Year Group','Attendance','']);
      // Students
      if(studs.length===0){
        rows.push(['—','No students assigned','','','']);
      }else{
        studs.forEach(function(st){
          var att=(attMap[st.student_id]||attMap[st.id]||{}).status||'—';
          rows.push([st.admission_id||'—',st.name||st.student_name||'',st.year_group||'',att,'']);
        });
      }
      rows.push(['','','','','']); // blank row between tables
    });
    var sheetName=('S'+(si+1)+' '+slot).slice(0,31);
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:28},{wch:12},{wch:24},{wch:4}];
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });
  XLSX.writeFile(wb,'LessonPlan_'+rptDate+'.xlsx');
}

  var isMob=window.innerWidth<=768;
  if(_mbnav)_mbnav.style.display=(isMob&&state.currentUser&&!state.loading)?'flex':'none';
  if(_mlout)_mlout.style.display=(isMob&&state.currentUser)?'block':'none';document.body.classList.toggle('readonly-user',state.currentUser?.role==='reports_viewer');const app=document.getElementById('app');if(!state.currentUser&&!state.parentUser){app.innerHTML=renderLogin();bindLoginEvents();return;}if(state.parentUser&&!state.currentUser){app.innerHTML=`<div style="max-width:900px;margin:0 auto;padding:28px;">${renderParentPortal()}</div>`;bindParentEvents();return;}if(state.loading){app.innerHTML=`<div class="app">${renderSidebar()}

// Re-wire static mobile nav after every render
(function(){
  var pages=['dashboard','students','staff','sessions','session_plan','attendance','invoices','finance','reports','session_reports','lesson_reports','staff_timesheets','mgmt_reports','test_records','catchup'];
  pages.forEach(function(pg){
    var el=document.getElementById('mnav-'+pg);
    if(!el)return;
    el.onclick=function(e){
      e.preventDefault();
      e.stopPropagation();
      state.page=pg;
      state.loading=false;
      render();
      var b=branchParam();
      if(pg==='students') loadData('students','/api/students',{...b,q:state.studentSearch||''}).then(function(){state.loading=false;render();});
      else if(pg==='sessions') loadData('sessions','/api/sessions',b).then(function(){state.loading=false;render();});
      else if(pg==='attendance') Promise.all([loadData('sessions','/api/sessions',b),loadData('students','/api/students',b),loadData('all_timetables','/api/student-timetable',b)]).then(function(){state.loading=false;render();});
      else if(pg==='finance') Promise.all([loadData('invoices','/api/invoices',b),loadData('students','/api/students',b)]).then(function(){state.loading=false;render();});
      else if(pg==='staff') loadData('staff','/api/staff',b).then(function(){state.loading=false;render();});
      else if(pg==='session_plan') Promise.all([loadData('sessions','/api/sessions',b),loadData('students','/api/students',b),loadData('staff','/api/staff',b)]).then(function(){state.loading=false;render();});
      else if(pg==='invoices') Promise.all([loadData('invoices','/api/invoices',b),loadData('students','/api/students',b)]).then(function(){state.loading=false;render();});
      else if(pg==='reports') loadData('summary','/api/reports/summary',b).then(function(){state.loading=false;render();});
      else if(pg==='session_reports') Promise.all([loadData('sessions','/api/sessions',b),loadData('staff','/api/staff',b)]).then(function(){state.loading=false;render();});
      else if(pg==='lesson_reports') loadData('sessions','/api/sessions',b).then(function(){state.loading=false;render();});
      else if(pg==='staff_timesheets') Promise.all([loadData('staff','/api/staff',b),loadData('staff_att','/api/staff-attendance',b)]).then(function(){state.loading=false;render();});
      else if(pg==='mgmt_reports'){var b2m=branchParam();Promise.all([
        loadData('mgmt_summary','/api/reports/management/summary',b2m),
        loadData('mgmt_yearly','/api/reports/management/yearly',b2m)
      ]).then(function(){state.loading=false;render();});}
      else if(pg==='notes')Promise.all([loadData('meeting_notes','/api/meeting-notes',b),loadData('students','/api/students',b),loadData('branches','/api/branches')]).then(function(){state.loading=false;render();});else if(pg==='test_records') Promise.all([loadData('students','/api/students',b),loadData('test_records','/api/test-records',b),loadData('branches','/api/branches')]).then(function(){state.loading=false;render();});
      else if(pg==='catchup') Promise.all([loadData('students','/api/students',b),loadData('catchup','/api/catchup',b)]).then(function(){state.loading=false;render();});
      else Promise.all([loadData('branches','/api/branches'),loadData('summary','/api/reports/summary',b)]).then(function(){state.loading=false;render();});
      return false;
    };
  });
  // Re-wire profile tabs
  document.querySelectorAll('[data-action="profile-tab"]').forEach(function(tab){
    tab.onclick=function(){
      state.profileTab=this.dataset.tab;
      render();
    };
  });
  // Also re-wire sidebar nav items (data-nav) after every render
  document.querySelectorAll('[data-nav]').forEach(function(el){
    el.onclick=function(e){
      e.preventDefault();
      e.stopPropagation();
      var pg=this.dataset.nav;
      var sb=document.querySelector('.sidebar');
      var ov=document.getElementById('sidebar-overlay');
      if(sb)sb.classList.remove('open');
      if(ov)ov.classList.remove('open');
      state.page=pg;
      if(this.dataset.action){state.modal=this.dataset.action;state.editTarget=null;}
      refreshPage();
      return false;
    };
  });
})();}

function bindLoginEvents(){document.getElementById('login-btn')?.addEventListener('click',doLogin);document.getElementById('parent-login-btn')?.addEventListener('click',doParentLogin);document.getElementById('l-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});}

async function doLogin(){const email=document.getElementById('l-email')?.value.trim();const pass=document.getElementById('l-pass')?.value;document.getElementById('login-err').textContent='';try{const user=await API.post('/api/login',{email,password:pass});if(!user)return;state.currentUser=user;state.currentBranch=(user.role==='super_admin'||user.role==='head_of_branches')?null:(user.branch_id||null);state.page='dashboard';refreshPage();}catch(e){document.getElementById('login-err').textContent=e.error||'Login failed';}}

async function doParentLogin(){const email=document.getElementById('l-email')?.value.trim();const pass=document.getElementById('l-pass')?.value;document.getElementById('login-err').textContent='';try{const pu=await API.post('/api/parent-login',{email,password:pass});if(!pu)return;state.parentUser=pu;const children=await API.get('/api/parent/children');state.data.parent_children=children||[];for(const child of(children||[])){state.data['p_att_'+child.id]=await API.get('/api/parent/attendance/'+child.id)||[];
        state.data['p_diary_'+child.id]=await API.get('/api/parent/diary/'+child.id)||[];
        state.data['p_tests_'+child.id]=await API.get('/api/parent/test-records/'+child.id)||[];state.data['p_mnotes_'+child.id]=await API.get('/api/parent/meeting-notes/'+child.id)||[];
        state.data['p_ann_'+child.id]=await API.get('/api/parent/announcements/'+child.id)||[];state.data['p_inv_'+child.id]=await API.get('/api/parent/invoices/'+child.id)||[];state.data['p_prog_'+child.id]=await API.get('/api/parent/progress/'+child.id)||[];state.data['p_contract_'+child.id]=await API.get('/api/parent/contract/'+child.id).catch(()=>({available:false}))||{available:false};}render();}catch(e){document.getElementById('login-err').textContent=e.error||'Login failed';}}

    if(s.monthly_fee)html+='<button class="btn" data-action="profile-gen-invoice" style="background:var(--success);color:#fff;border-color:var(--success);">⚡ Generate this monthly invoice (£'+parseFloat(s.monthly_fee).toFixed(0)+')</button>';
    html+='</div></div>';

    html+='<div style="font-size:13px;color:var(--text3);">'+totalInv+' invoices</div>';
    if(s.monthly_fee)html+='<button class="btn" data-action="profile-gen-invoice" style="background:var(--success);color:#fff;border-color:var(--success);">⚡ Generate this monthly invoice</button>';
    html+='</div>';
    if(invoices.length){
      html+='<div class="card" style="padding:0;overflow:hidden;"><div class="table-wrap"><table>';

        html+='<tr><td style="font-weight:600;">'+(inv.month||'—')+'</td>';
        html+='<td style="font-size:12px;">'+(inv.description||inv.fee_type||'Monthly fee')+'</td>';
        html+='<td>£'+parseFloat(inv.amount||0).toFixed(2)+'</td>';
        html+='<td style="color:var(--success-text);">£'+parseFloat(inv.amount_paid||0).toFixed(2)+'</td>';
        html+='<td style="font-weight:600;color:'+(parseFloat(inv.balance||0)>0?'var(--danger-text)':'var(--success-text)')+';">£'+parseFloat(inv.balance||0).toFixed(2)+'</td>';
        html+='<td><span style="color:'+sc+';font-weight:600;text-transform:capitalize;">'+inv.status+'</span></td>';

        html+='<td><button class="btn btn-sm" data-action="mark-paid" data-id="'+inv.id+'" '+(inv.status==='paid'?'disabled':'')+'>Mark paid</button></td></tr>';
      });
      html+='</tbody></table></div></div>';
      if(outstanding>0)html+='<div style="margin-top:12px;padding:10px 14px;background:var(--warning-bg);border-radius:var(--radius);font-size:13px;color:var(--amber-text);font-weight:600;">Outstanding balance: £'+outstanding.toFixed(2)+'</div>';
      else html+='<div style="margin-top:12px;padding:10px 14px;background:rgba(16,185,129,0.1);border-radius:var(--radius);font-size:13px;color:var(--success-text);font-weight:600;">✓ All invoices paid</div>';
    } else html+='<div class="empty-state">No invoices yet.</div>';

  else if(profileTab==='timetable'){
    if(timetable.length){

      html+='</tbody></table></div></div>';

  }
  return html;
}
