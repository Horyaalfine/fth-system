function renderSessions(){
  const sessions=state.data.sessions||[];
  const sessMonth=state.sessionMonth||'';
  const sessDate=state.sessionDate||'';
  const sessSlot=state.sessionSlot||'';
  const sessTeacher=state.sessionTeacher||'';
  const sessSubject=state.sessionSubject||'';

  // ── Step 1: months ──
  const months=[...new Set(sessions.map(function(s){return s.date?s.date.slice(0,7):'';}).filter(Boolean))].sort().reverse();

  // ── Step 2: specific dates available in selected month ──
  const monthSrc=sessMonth?sessions.filter(function(s){return s.date&&s.date.slice(0,7)===sessMonth;}):sessions;
  const dateSet={};
  monthSrc.forEach(function(s){if(s.date)dateSet[s.date]=true;});
  const dates=Object.keys(dateSet).sort().reverse();

  // ── Step 3: slot times for selected month+date ──
  const dateSrc=sessDate?monthSrc.filter(function(s){return s.date===sessDate;}):monthSrc;
  const slots=[...new Set(dateSrc.map(function(s){return s.slot;}).filter(Boolean))].sort();

  // ── Step 4: teachers for selected month+date+slot ──
  const slotSrc=dateSrc.filter(function(s){return !sessSlot||s.slot===sessSlot;});
  const teacherMap={};
  slotSrc.forEach(function(s){if(s.staff_id&&s.staff_name)teacherMap[s.staff_id]=s.staff_name;});
  const teachers=Object.entries(teacherMap).map(function(e){return{id:e[0],name:e[1]};}).sort(function(a,b){return a.name.localeCompare(b.name);});

  // ── Step 5: subjects for selected month+date+slot+teacher ──
  const teacherSrc=slotSrc.filter(function(s){return !sessTeacher||String(s.staff_id)===sessTeacher;});
  const subjects=[...new Set(teacherSrc.map(function(s){return s.subject;}).filter(Boolean))].sort();

  // ── Apply all filters ──
  const filtered=sessions.filter(function(s){
    if(sessMonth&&(!s.date||s.date.slice(0,7)!==sessMonth))return false;
    if(sessDate&&s.date!==sessDate)return false;
    if(sessSlot&&s.slot!==sessSlot)return false;
    if(sessTeacher&&String(s.staff_id)!==sessTeacher)return false;
    if(sessSubject&&s.subject!==sessSubject)return false;
    return true;
  });

  // Group by date
  const byDate={};
  filtered.forEach(function(s){const d=s.date||'';if(!byDate[d])byDate[d]=[];byDate[d].push(s);});
  const groupedDates=Object.keys(byDate).sort().reverse();

  const totalPresent=filtered.reduce(function(s,x){return s+(x.present_count||0);},0);
  const totalStudents=filtered.reduce(function(s,x){return s+(x.total_count||0);},0);
  const activeFilters=[sessMonth,sessDate,sessSlot,sessTeacher,sessSubject].filter(Boolean).length;

  var html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">';
  html+='<div><div class="section-title">Sessions</div>';
  const uniqueSlots=[...new Set(filtered.map(function(s){return s.date+'|'+s.slot;}))];
  html+='<div class="section-sub">'+uniqueSlots.length+' session'+(uniqueSlots.length!==1?'s':'')+' ('+filtered.length+' table'+(filtered.length!==1?'s':'')+') shown'+(activeFilters?' · '+activeFilters+' filter'+(activeFilters>1?'s':'')+' active':'')+' · '+totalPresent+'/'+totalStudents+' attendance</div></div>';
  html+='<button class="btn btn-primary" data-action="add-session">+ Add session</button><button class="btn" data-action="gen-weekly-sessions" style="margin-left:8px;">📅 Weekly</button>';
  html+='</div>';

  // Filter bar
  html+='<div class="card" style="margin-bottom:16px;padding:14px 18px;">';
  html+='<div style="display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px;align-items:end;">';

  // Month
  html+='<div class="field" style="margin:0;"><label>Month</label><select id="session-month-filter">';
  html+='<option value="">All months</option>';
  months.forEach(function(m){
    html+='<option value="'+m+'" '+(m===sessMonth?'selected':'')+'>'+new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</option>';
  });
  html+='</select></div>';

  // Date — shows day + full date e.g. "Wed, 4 Jun 2026"
  html+='<div class="field" style="margin:0;"><label>Date</label><select id="session-date-filter">';
  html+='<option value="">All dates</option>';
  dates.forEach(function(d){
    var label=new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    html+='<option value="'+d+'" '+(d===sessDate?'selected':'')+'>'+label+'</option>';
  });
  html+='</select></div>';

  // Slot time
  html+='<div class="field" style="margin:0;"><label>Slot time</label><select id="session-slot-filter">';
  html+='<option value="">All slots</option>';
  slots.forEach(function(sl){html+='<option value="'+sl+'" '+(sl===sessSlot?'selected':'')+'>'+sl+'</option>';});
  html+='</select></div>';

  // Teacher
  html+='<div class="field" style="margin:0;"><label>Teacher</label><select id="session-teacher-filter">';
  html+='<option value="">All teachers</option>';
  teachers.forEach(function(t){html+='<option value="'+t.id+'" '+(String(t.id)===sessTeacher?'selected':'')+'>'+t.name+'</option>';});
  html+='</select></div>';

  // Subject
  html+='<div class="field" style="margin:0;"><label>Subject</label><select id="session-subject-filter">';
  html+='<option value="">All subjects</option>';
  subjects.forEach(function(s){html+='<option value="'+s+'" '+(s===sessSubject?'selected':'')+'>'+s+'</option>';});
  html+='</select></div>';

  // Clear
  html+='<div style="padding-bottom:1px;">';
  if(activeFilters){html+='<button class="btn btn-sm" data-action="session-clear-filters" style="white-space:nowrap;">✕ Clear</button>';}
  html+='</div>';
  html+='</div></div>';

  // Results — grouped by slot within each day
  if(groupedDates.length===0){
    html+='<div class="empty-state" style="padding:40px;">No sessions match these filters.</div>';
  }

  groupedDates.forEach(function(date){
    const daySessions=byDate[date];
    const dayLabel=new Date(date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const dayPresent=daySessions.reduce(function(s,x){return s+(x.present_count||0);},0);
    const dayTotal=daySessions.reduce(function(s,x){return s+(x.total_count||0);},0);
    // Group tables by slot
    const slotMap={};
    daySessions.forEach(function(s){if(!slotMap[s.slot])slotMap[s.slot]=[];slotMap[s.slot].push(s);});
    const slotKeys=Object.keys(slotMap).sort();
    html+='<div style="margin-bottom:14px;">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;">'+dayLabel+'</div>';
    html+='<div style="font-size:12px;color:var(--text3);">'+slotKeys.length+' session'+(slotKeys.length!==1?'s':'')+' · '+daySessions.length+' table'+(daySessions.length!==1?'s':'')+' · '+dayPresent+'/'+dayTotal+' present</div>';
    html+='</div>';
    html+='<div class="card" style="padding:0;overflow:hidden;">';
    slotKeys.forEach(function(slot,si){
      const tables=slotMap[slot];
      const slotPresent=tables.reduce(function(s,x){return s+(x.present_count||0);},0);
      const slotTotal=tables.reduce(function(s,x){return s+(x.total_count||0);},0);
      const borderTop=si>0?'border-top:2px solid var(--border);':'';
      html+='<div style="'+borderTop+'">';
      // Session header row
      html+='<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface2);">';
      html+='<div style="font-size:13px;font-weight:700;flex:1;">'+slot+'</div>';
      html+='<div style="font-size:12px;color:var(--text3);">'+tables.length+' table'+(tables.length!==1?'s':'')+'</div>';
      html+='<span class="badge '+(slotPresent>0?'badge-success':'badge-gray')+'">'+slotPresent+'/'+slotTotal+' present</span>';
      html+='</div>';
      // Tables sub-rows
      html+='<div class="table-wrap"><table style="margin:0;">';
      html+='<thead><tr style="background:transparent;"><th style="padding:5px 16px;font-size:11px;">Table</th><th style="padding:5px 16px;font-size:11px;">Teacher</th><th style="padding:5px 16px;font-size:11px;">Subject</th><th style="padding:5px 16px;font-size:11px;">Attendance</th><th></th></tr></thead><tbody>';
      tables.forEach(function(s){
        var expanded=(state.expandedSessionStudents||{})[s.id];
        var studs=state.data['sess_students_'+s.id]||[];
        html+='<tr style="border-top:1px solid var(--border);">';
        html+='<td style="padding:7px 16px;font-size:13px;font-weight:600;color:var(--text2);">T'+s.table_no+'</td>';
        html+='<td style="padding:7px 16px;">'+(s.staff_name||'<span style="color:var(--text3);">—</span>')+'</td>';
        html+='<td style="padding:7px 16px;"><span class="badge badge-gray">'+(s.subject||'—')+'</span></td>';
        html+='<td style="padding:7px 16px;"><span class="badge '+(s.present_count>0?'badge-success':'badge-gray')+'">'+s.present_count+'/'+s.total_count+'</span></td>';
        html+='<td style="padding:7px 16px;"><div class="row-actions"><button class="btn btn-sm btn-outline" data-action="toggle-session-students" data-id="'+s.id+'">'+(expanded?'▲ Hide':'▼ Students')+'</button><button class="btn btn-sm btn-success" data-action="mark-att" data-id="'+s.id+'">Attendance</button><button class="btn btn-sm btn-danger" data-action="del-session" data-id="'+s.id+'">Del</button></div></td>';
        html+='</tr>';
        if(expanded){
          html+='<tr style="background:var(--surface2);border-top:1px solid var(--border);">';
          html+='<td colspan="5" style="padding:8px 16px 12px 32px;">';
          if(studs.length===0){
            html+='<span style="font-size:12px;color:var(--text3);">No students allocated to this table</span>';
          }else{
            html+='<table style="margin:0;font-size:12px;width:auto;">';
            html+='<thead><tr><th style="padding:3px 12px 3px 0;color:var(--text3);font-weight:600;">Ad No.</th><th style="padding:3px 12px 3px 0;color:var(--text3);font-weight:600;">Name</th><th style="padding:3px 12px 3px 0;color:var(--text3);font-weight:600;">Year</th></tr></thead><tbody>';
            studs.forEach(function(st){
              html+='<tr>';
              html+='<td style="padding:3px 12px 3px 0;color:var(--text3);">'+(st.admission_id||'—')+'</td>';
              html+='<td style="padding:3px 12px 3px 0;font-weight:500;">'+(st.name||'—')+'</td>';
              html+='<td style="padding:3px 12px 3px 0;">'+(st.year_group||'—')+'</td>';
              html+='</tr>';
            });
            html+='</tbody></table>';
          }
          html+='</td></tr>';
        }
      });
      html+='</tbody></table></div></div>';
    });
    html+='</div></div>';
  });

  // Also fix the count in the sub-header to show slot count not table count
  // (already done above via slotKeys.length)
  return html;
}

function renderQuickAttendance(){
  const allTT=state.data.all_timetables||[];
  const sessions=state.data.sessions||[];
  const students=state.data.students||[];

  const qDate=state.qaDate||new Date().toISOString().slice(0,10);
  const qSlot=state.qaSlot||'';
  const qStatus=state.qaStatusFilter||'all';

  // Determine day type from selected date
  function getDayType(dateStr){
    const d=new Date(dateStr+'T00:00:00');
    const day=d.getDay();
    if(day===6)return'saturday';
    if(day===0)return'sunday';
    return'weekday';
  }
  const dayType=getDayType(qDate);

  // Unique slots available for this day type from timetable
  const availableSlots=[...new Set(allTT.filter(function(e){return e.day_type===dayType;}).map(function(e){return e.slot;}))].sort();

  // Students timetabled for this date+slot
  const timetabledStudents=qSlot?allTT.filter(function(e){
    return e.day_type===dayType&&e.slot===qSlot;
  }):[];

  // Build unique student list with their subjects for this slot
  const stuMap={};
  timetabledStudents.forEach(function(e){
    if(!stuMap[e.student_id]){
      stuMap[e.student_id]={id:e.student_id,name:e.student_name,admission_id:e.admission_id,year_group:e.year_group,subjects:[]};
    }
    stuMap[e.student_id].subjects.push(e.subject);
  });
  const stuList=Object.values(stuMap).sort(function(a,b){return a.admission_id>b.admission_id?1:-1;});

  // Find sessions for this date+slot (to save attendance against)
  const daySessions=sessions.filter(function(s){return s.date===qDate&&s.slot===qSlot;});

  // Local attendance state key
  const qaKey='qa_'+qDate+'_'+qSlot;
  if(!state.qaRecords)state.qaRecords={};
  const localAtt=state.qaRecords[qaKey]||{};

  // Counts
  const presentCount=Object.values(localAtt).filter(function(a){return a==='present';}).length;
  const absentCount=Object.values(localAtt).filter(function(a){return a==='absent';}).length;
  const unmarkedCount=stuList.length-presentCount-absentCount;

  // Filter by status
  const visibleStudents=stuList.filter(function(st){
    if(qStatus==='all')return true;
    if(qStatus==='unmarked')return !localAtt[st.id];
    return localAtt[st.id]===qStatus;
  });

  var html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">';
  html+='<div><div class="section-title">Quick Attendance</div>';
  html+='<div class="section-sub">Mark attendance by date and slot — across all tables</div></div>';
  html+='</div>';

  // Date + Slot selector
  html+='<div class="card" style="margin-bottom:16px;">';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
  html+='<div class="field" style="margin:0;"><label>Date</label><input type="date" id="qa-date" value="'+qDate+'"></div>';
  html+='<div class="field" style="margin:0;"><label>Slot</label><select id="qa-slot">';
  html+='<option value="">— select slot —</option>';
  availableSlots.forEach(function(sl){html+='<option value="'+sl+'" '+(sl===qSlot?'selected':'')+'>'+sl+'</option>';});
  html+='</select></div>';
  html+='</div>';

  // Hint about day type
  if(qDate){
    var dayLabel=new Date(qDate+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    html+='<div style="margin-top:10px;font-size:12px;color:var(--text3);">'+dayLabel+' · '+dayType.charAt(0).toUpperCase()+dayType.slice(1)+' slots shown</div>';
  }
  html+='</div>';

  if(qSlot&&stuList.length>0){
    // Summary + save
    html+='<div class="card" style="margin-bottom:16px;">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
    html+='<div style="display:flex;gap:8px;flex-wrap:wrap;">';
    html+='<span class="badge badge-success">'+presentCount+' present</span>';
    html+='<span class="badge badge-danger">'+absentCount+' absent</span>';
    html+='<span class="badge badge-gray">'+unmarkedCount+' unmarked</span>';
    html+='<span class="badge badge-accent">'+stuList.length+' total</span>';
    html+='</div>';
    html+='<button class="btn btn-primary" data-action="save-quick-att" data-date="'+qDate+'" data-slot="'+qSlot+'">Save attendance</button>';
    html+='</div>';

    // Status filter
    html+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">';
    html+='<span style="font-size:12px;color:var(--text3);font-weight:600;align-self:center;">Show:</span>';
    [['all','All ('+stuList.length+')'],['present','Present ('+presentCount+')'],['absent','Absent ('+absentCount+')'],['unmarked','Unmarked ('+unmarkedCount+')']].forEach(function(f){
      html+='<button class="btn btn-sm '+(qStatus===f[0]?'btn-primary':'')+'" data-action="qa-status-filter" data-filter="'+f[0]+'" style="'+(qStatus===f[0]?'':'background:var(--surface2);')+'">'+f[1]+'</button>';
    });
    html+='</div>';

    if(daySessions.length===0){
      html+='<div style="margin-top:10px;padding:8px 12px;background:var(--warning-bg);border-radius:var(--radius);font-size:12px;color:var(--amber-text);">⚠ No sessions created for this date/slot yet. Create sessions first, or attendance will be saved when sessions are created.</div>';
    }
    html+='</div>';

    // Mark all buttons
    html+='<div style="display:flex;gap:8px;margin-bottom:12px;">';
    html+='<button class="btn btn-sm btn-success" data-action="qa-mark-all" data-status="present">✓ Mark all present</button>';
    html+='<button class="btn btn-sm btn-danger" data-action="qa-mark-all" data-status="absent">✗ Mark all absent</button>';
    html+='<button class="btn btn-sm" data-action="qa-mark-all" data-status="clear">↩ Clear all</button>';
    html+='</div>';

    // Student grid
    html+='<div class="att-grid">';
    visibleStudents.forEach(function(st){
      var status=localAtt[st.id]||'';
      var color=status==='present'?'var(--success-text)':status==='absent'?'var(--danger-text)':'var(--text3)';
      html+='<div class="att-cell '+status+'" data-action="qa-toggle" data-student="'+st.id+'">';
      html+='<div class="att-name">'+st.name+'</div>';
      html+='<div class="att-id">'+st.admission_id+(st.subjects.length?' · '+st.subjects.join(', '):'')+'</div>';
      html+='<div class="att-status" style="color:'+color+';">'+(status?status.toUpperCase():'—')+'</div>';
      html+='</div>';
    });
    if(visibleStudents.length===0){
      html+='<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--text3);">No students match this filter</div>';
    }
    html+='</div>';

  } else if(qSlot&&stuList.length===0){
    html+='<div class="empty-state" style="padding:40px;">No students timetabled for this slot. Set up student timetables in the Lesson Plan → Student timetables tab.</div>';
  } else if(!qSlot&&qDate){
    html+='<div class="empty-state" style="padding:30px;">Select a slot to see students.</div>';
  }

  return html;
}

function renderWeeklyPlanner(){
  const allTT=state.data.all_timetables||[];
  const sessions=state.data.sessions||[];
  const staff=state.data.staff||[];

  // Get week start (Monday) for selected week
  const wpWeek=state.wpWeek||'';
  const today=new Date();
  today.setHours(0,0,0,0);

  function getWeekStart(d){
    var day=d.getDay();
    var diff=d.getDate()-day+(day===0?-6:1);
    var mon=new Date(d);
    mon.setDate(diff);
    mon.setHours(0,0,0,0);
    return mon;
  }

  // Build week dates using local date arithmetic to avoid UTC timezone issues
  function addDays(dateStr, n){
    var parts=dateStr.split('-');
    var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2])+n);
    var y=d.getFullYear();
    var m=String(d.getMonth()+1).padStart(2,'0');
    var dd=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+dd;
  }
  function fmt(d){
    if(typeof d==='string')return d;
    var y=d.getFullYear();
    var m=String(d.getMonth()+1).padStart(2,'0');
    var dd=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+dd;
  }
  // Get Monday of current week as a string
  var todayStr=fmt(today);
  var weekStartStr=wpWeek||fmt(getWeekStart(today));
  var weekDates=[];
  for(var i=0;i<7;i++){
    weekDates.push(addDays(weekStartStr,i));
  }
  var weekStart={toString:function(){return weekStartStr;}};
  function fmtLabel(d){return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
  function getDayType(d){var day=d.getDay();if(day===6)return'saturday';if(day===0)return'sunday';return'weekday';}

  // All unique slots from timetable
  const allSlots=['Weekday Session 1 (17:00-19:00)','Weekday Session 2 (19:00-21:00)',
    'Saturday Session 1 (09:00-11:00)','Saturday Session 2 (11:15-13:15)','Saturday Session 3 (14:00-16:00)','Saturday Session 4 (16:15-18:15)',
    'Sunday Session 1 (09:00-11:00)','Sunday Session 2 (11:15-13:15)','Sunday Session 3 (14:00-16:00)','Sunday Session 4 (16:15-18:15)'];

  var prevWeek=addDays(weekStartStr,-7);
  var nextWeek=addDays(weekStartStr,7);

  var html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">';
  html+='<div><div class="section-title">Weekly Planner</div><div class="section-sub">Projected students per slot — plan tables and teachers</div></div>';
  html+='</div>';

  // Week navigation
  html+='<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;">';
  html+='<button class="btn btn-sm" data-action="wp-week" data-week="'+prevWeek+'">← Prev week</button>';
  html+='<div style="font-weight:600;font-size:14px;">'+fmtLabel(new Date(weekDates[0]+'T12:00:00'))+' — '+fmtLabel(new Date(weekDates[6]+'T12:00:00'))+'</div>';
  html+='<button class="btn btn-sm" data-action="wp-week" data-week="'+nextWeek+'">Next week →</button>';
  html+='<button class="btn btn-sm" data-action="wp-week" data-week="'+fmt(getWeekStart(today))+'">Today</button>';
  html+='</div>';

  // Week grid
  html+='<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:700px;">';
  html+='<thead><tr><th style="padding:8px;border:1px solid var(--border);background:var(--surface2);font-size:12px;white-space:nowrap;">Slot</th>';
  weekDates.forEach(function(dateStr){
    var d=new Date(dateStr+'T12:00:00');
    var isToday=dateStr===todayStr;
    html+='<th style="padding:8px;border:1px solid var(--border);background:'+(isToday?'rgba(37,99,235,0.1)':'var(--surface2)')+';font-size:12px;white-space:nowrap;text-align:center;">'+
      '<div style="font-weight:700;color:'+(isToday?'var(--accent)':'var(--text)')+';">'+d.toLocaleDateString('en-GB',{weekday:'short'})+'</div>'+
      '<div style="color:var(--text3);font-weight:400;">'+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</div>'+
      '</th>';
  });
  html+='</tr></thead><tbody>';

  allSlots.forEach(function(slot){
    html+='<tr>';
    html+='<td style="padding:8px;border:1px solid var(--border);font-size:12px;white-space:nowrap;font-weight:600;background:var(--surface2);">'+slot+'</td>';
    weekDates.forEach(function(dateStr){
      var d=new Date(dateStr+'T12:00:00');
      var dayType=getDayType(d);
      var isToday=dateStr===todayStr;

      // Check if this slot applies to this day type
      var slotDayType=slot.toLowerCase().startsWith('saturday')?'saturday':slot.toLowerCase().startsWith('weekday')?'weekday':'sunday';
      if(slotDayType!==dayType){
        html+='<td style="padding:6px;border:1px solid var(--border);background:var(--surface3);"></td>';
        return;
      }

      // Students timetabled for this slot
      var timetabledStudents=[...new Set(allTT.filter(function(e){return e.slot===slot&&e.day_type===dayType;}).map(function(e){return e.student_id;}))];
      var count=timetabledStudents.length;

      // Sessions already created for this date+slot
      var existingSessions=sessions.filter(function(s){return s.date===dateStr&&s.slot===slot;});
      var tablesCreated=existingSessions.length;

      html+='<td style="padding:6px;border:1px solid var(--border);vertical-align:top;background:'+(isToday?'rgba(37,99,235,0.03)':'')+';">';
      if(count>0){
        html+='<div style="font-size:12px;"><span class="badge badge-accent">'+count+' students</span></div>';
        if(tablesCreated>0){
          html+='<div style="font-size:11px;color:var(--success-text);margin-top:3px;">'+tablesCreated+' table'+(tablesCreated>1?'s':'')+' created</div>';
          existingSessions.forEach(function(s){
            html+='<div style="font-size:11px;color:var(--text3);">T'+s.table_no+': '+(s.staff_name||'No teacher')+'</div>';
          });
        } else {
          html+='<div style="font-size:11px;color:var(--amber-text);margin-top:3px;">No sessions yet</div>';
        }
        html+='<button class="btn btn-sm" data-action="wp-quick-session" data-date="'+dateStr+'" data-slot="'+encodeURIComponent(slot)+'" style="margin-top:4px;font-size:11px;padding:3px 8px;">'+
          (tablesCreated>0?'+ Add table':'+ Create session')+'</button>';
        html+='<button class="btn btn-sm" data-action="wp-auto-plan" data-date="'+dateStr+'" data-slot="'+encodeURIComponent(slot)+'" style="margin-top:4px;font-size:11px;padding:3px 8px;background:var(--accent);color:#fff;border-color:var(--accent);">⚡ Auto-plan</button>';
        html+='<button class="btn btn-sm btn-success" data-action="wp-quick-att" data-date="'+dateStr+'" data-slot="'+encodeURIComponent(slot)+'" style="margin-top:4px;font-size:11px;padding:3px 8px;">✓ Attend</button>';
      } else {
        html+='<td style="padding:6px;border:1px solid var(--border);background:var(--surface3);"></td>';
        return;
      }
      html+='</td>';
    });
    html+='</tr>';
  });

  html+='</tbody></table></div>';

  // Legend
  html+='<div style="display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--text3);">';
  html+='<span><span class="badge badge-accent">N students</span> timetabled for that slot</span>';
  html+='<span style="color:var(--success-text);">Green = sessions already created</span>';
  html+='<span style="color:var(--amber-text);">Orange = no sessions yet</span>';
  html+='</div>';

  return html;
}

function renderAttendance(){
  const sessions=state.data.sessions||[];
  const students=state.data.students||[];
  const selId=state.attSessionId;
  const selSess=sessions.find(function(s){return s.id===selId;});
  const attData=selId?(state.data['attendance_'+selId]||[]):[];
  if(selId&&!state.attRecords[selId]){state.attRecords[selId]={};attData.forEach(function(a){state.attRecords[selId][a.student_id]={status:a.status,notes:a.notes||''};});}
  const localAtt=selId?(state.attRecords[selId]||{}):{};

  const attDateFilter=state.attDateFilter||'';
  const attSlotFilter=state.attSlotFilter||'';
  const attTeacherFilter=state.attTeacherFilter||'';
  const attStatusFilter=state.attStatusFilter||'all';

  // ── Step 1: unique dates (most recent first) ──
  const dates=[...new Set(sessions.map(function(s){return s.date;}).filter(Boolean))].sort().reverse();

  // ── Step 2: slots available on the selected date (or all) ──
  const slotSessions=attDateFilter?sessions.filter(function(s){return s.date===attDateFilter;}):sessions;
  const slots=[...new Set(slotSessions.map(function(s){return s.slot;}).filter(Boolean))].sort();

  // ── Step 3: teachers available for selected date+slot (or all) ──
  const teacherSessions=slotSessions.filter(function(s){return !attSlotFilter||s.slot===attSlotFilter;});
  const teacherMap={};
  teacherSessions.forEach(function(s){if(s.staff_id&&s.staff_name)teacherMap[s.staff_id]=s.staff_name;});
  const teachers=Object.entries(teacherMap).map(function(e){return{id:e[0],name:e[1]};}).sort(function(a,b){return a.name.localeCompare(b.name);});

  // ── Step 4: sessions shown in select (apply all 3 filters) ──
  const filteredSessions=sessions.filter(function(s){
    if(attDateFilter&&s.date!==attDateFilter)return false;
    if(attSlotFilter&&s.slot!==attSlotFilter)return false;
    if(attTeacherFilter&&String(s.staff_id)!==attTeacherFilter)return false;
    return true;
  });

  // ── Students: from table allocations if loaded, else branch fallback ──
  var sessionStudents=[];
  if(selSess){
    const sessStus=state.data['sess_students_'+selId]||[];
    if(sessStus.length){
      // Students from lesson plan (table allocations)
      sessionStudents=sessStus.map(function(s){return{id:s.student_id,name:s.student_name||s.name,admission_id:s.admission_id,table_no:s.table_no,source:s.source};});
    } else {
      // Fallback: pull from student timetable for this slot
      const allTT=state.data.all_timetables||[];
      var ttStudents=allTT.filter(function(t){return t.slot===selSess.slot;});
      if(ttStudents.length){
        // De-duplicate by student_id
        var seen={};
        sessionStudents=ttStudents.filter(function(t){if(seen[t.student_id])return false;seen[t.student_id]=true;return true;})
          .map(function(t){return{id:t.student_id,name:t.student_name,admission_id:t.admission_id,subject:t.subject,source:'timetable'};});
      } else {
        // Last resort: all active branch students
        sessionStudents=students.filter(function(s){return s.branch_id===selSess.branch_id&&s.status==='active';}).map(function(s){return{id:s.id,name:s.name,admission_id:s.admission_id};});
      }
    }
  }

  const presentCount=Object.values(localAtt).filter(function(a){return a.status==='present';}).length;
  const absentCount=Object.values(localAtt).filter(function(a){return a.status==='absent';}).length;
  const unmarkedCount=sessionStudents.length-presentCount-absentCount;

  const visibleStudents=sessionStudents.filter(function(st){
    if(attStatusFilter==='all')return true;
    const rec=localAtt[st.id];
    if(attStatusFilter==='unmarked')return !rec;
    return rec&&rec.status===attStatusFilter;
  });

  const attTab=state.attTab||'quick';
  var html='';
  html+='<div class="tab-bar" style="margin-bottom:16px;">';
  html+='<div class="tab '+(attTab==='quick'?'active':'')+'" data-action="att-tab" data-tab="quick">⚡ Quick mark</div>';
  html+='<div class="tab '+(attTab==='session'?'active':'')+'" data-action="att-tab" data-tab="session">📋 By session</div>';
  html+='</div>';
  if(attTab==='quick')return renderQuickAttendance();
  html+='<div class="section-title" style="margin-bottom:4px;">Session Attendance</div>';
  html+='<div class="section-sub">Pick a date and session → see expected students → mark present or absent.</div>';

  html+='<div class="card" style="margin-bottom:16px;">';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;align-items:end;">';

  // Date filter
  html+='<div class="field" style="margin:0;"><label>Date</label><select id="att-date-filter">';
  html+='<option value="">All dates</option>';
  dates.forEach(function(d){
    var label=new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    html+='<option value="'+d+'" '+(d===attDateFilter?'selected':'')+'>'+label+'</option>';
  });
  html+='</select></div>';

  // Session/slot filter — options depend on selected date
  html+='<div class="field" style="margin:0;"><label>Session</label><select id="att-slot-filter">';
  html+='<option value="">All sessions</option>';
  slots.forEach(function(sl){html+='<option value="'+sl+'" '+(sl===attSlotFilter?'selected':'')+'>'+sl+'</option>';});
  html+='</select></div>';

  // Table/session select — narrowed by date+slot
  var allSessionsId='all:'+filteredSessions.map(function(s){return s.id;}).join(',');
  html+='<div class="field" style="margin:0;"><label>Table <span style="font-size:11px;color:var(--text3);">('+filteredSessions.length+' shown)</span></label><select id="att-session-select">';
  html+='<option value="">— choose a table —</option>';
  if(filteredSessions.length>1){
    var allLabel=attDateFilter&&attSlotFilter?'All tables — '+new Date(attDateFilter+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · '+attSlotFilter:attDateFilter?'All sessions — '+new Date(attDateFilter+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'All '+filteredSessions.length+' sessions';
    html+='<option value="'+allSessionsId+'" '+(state.attAllSessions===allSessionsId?'selected':'')+'>📋 '+allLabel+' ('+filteredSessions.length+' sessions)</option>';
  }
  filteredSessions.forEach(function(s){
    var dateLabel=new Date(s.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    html+='<option value="'+s.id+'" '+(s.id===selId?'selected':'')+'>'+dateLabel+' · '+s.slot+' · T'+s.table_no+' · '+(s.staff_name||'No teacher')+'</option>';
  });
  html+='</select></div>';

  html+='</div>';

  // Hint row
  if(attDateFilter&&attSlotFilter&&!attTeacherFilter&&filteredSessions.length>1){
    html+='<div style="margin-top:10px;padding:8px 12px;background:var(--accent-bg);border-radius:var(--radius);font-size:12px;color:var(--accent);">';
    html+='<strong>'+filteredSessions.length+' sessions</strong> match this slot on '+new Date(attDateFilter+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' (one per table/teacher). Select a teacher above to narrow to one, or pick a session directly.';
    html+='</div>';
  }
  html+='</div>';

  // ── All sessions view ──
  if(state.attAllSessions&&!selSess){
    const allIds=state.attAllSessions.replace('all:','').split(',').map(Number);
    const allSessions=allIds.map(function(id){return sessions.find(function(s){return s.id===id;});}).filter(Boolean);
    // Build merged student list from all table allocs
    const mergedStudents=[];
    const seenIds={};
    var totalPresent=0,totalAbsent=0,totalUnmarked=0;
    allSessions.forEach(function(sess){
      const sessStusA=state.data['sess_students_'+sess.id]||[];
      const localA=state.attRecords[sess.id]||{};
      var stuList=[];
      if(sessStusA.length){
        sessStusA.forEach(function(ts){if(!seenIds[ts.student_id+'_'+sess.id]){seenIds[ts.student_id+'_'+sess.id]=true;stuList.push({id:ts.student_id,name:ts.student_name,admission_id:ts.admission_id,table_no:ts.table_no,session_id:sess.id,slot:sess.slot,teacher:sess.staff_name||'—'});}});
      }
      stuList.forEach(function(st){
        const rec=localA[st.id];
        if(rec&&rec.status==='present')totalPresent++;
        else if(rec&&rec.status==='absent')totalAbsent++;
        else totalUnmarked++;
        mergedStudents.push({...st,rec:rec});
      });
    });

    var html2='';
    if(attDateFilter){
      html2+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--accent);">';
      html2+='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
      html2+='<div><div class="card-title">'+new Date(attDateFilter+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(attSlotFilter?' · '+attSlotFilter:'')+'</div>';
      html2+='<div style="font-size:12px;color:var(--text3);margin-top:2px;">'+allSessions.length+' sessions · '+mergedStudents.length+' student seats total</div></div>';
      html2+='<div style="display:flex;gap:8px;flex-wrap:wrap;">';
      html2+='<span class="badge badge-success">'+totalPresent+' present</span>';
      html2+='<span class="badge badge-danger">'+totalAbsent+' absent</span>';
      html2+='<span class="badge badge-gray">'+totalUnmarked+' unmarked</span>';
      html2+='</div></div></div>';
    }

    // Show a card per session
    allSessions.forEach(function(sess){
      const sessStusB=state.data['sess_students_'+sess.id]||[];
      const localA=state.attRecords[sess.id]||{};
      var stuList=[];
      if(sessStusB.length){sessStusB.forEach(function(ts){stuList.push({id:ts.student_id,name:ts.student_name,admission_id:ts.admission_id,table_no:ts.table_no});});}
      const p=stuList.filter(function(st){const r=localA[st.id];return r&&r.status==='present';}).length;
      const a=stuList.filter(function(st){const r=localA[st.id];return r&&r.status==='absent';}).length;
      const u=stuList.length-p-a;
      html2+='<div class="card" style="margin-bottom:12px;">';
      html2+='<div class="card-header">';
      html2+='<div><div style="font-weight:600;">'+sess.slot+' · Table '+sess.table_no+' · '+(sess.staff_name||'No teacher')+'</div><div style="font-size:12px;color:var(--text3);">'+sess.branch_name+'</div></div>';
      html2+='<div style="display:flex;gap:8px;align-items:center;">';
      html2+='<span class="badge badge-success">'+p+' present</span><span class="badge badge-danger">'+a+' absent</span><span class="badge badge-gray">'+u+' unmarked</span>';
      html2+='<button class="btn btn-sm btn-primary" data-action="save-att" data-id="'+sess.id+'">Save</button>';
      html2+='</div></div>';
      html2+='<div class="att-grid">';
      stuList.forEach(function(st){
        var rec=localA[st.id];
        html2+='<div class="att-cell '+(rec?rec.status:'')+'" data-action="toggle-att" data-student="'+st.id+'" data-session="'+sess.id+'">';
        html2+='<button class="att-remove" data-action="att-remove-student" data-student="'+st.id+'" data-session="'+sess.id+'" title="Remove from this session">✕</button>';
        html2+='<div class="att-name">'+st.name+'</div>';
        html2+='<div class="att-id">'+st.admission_id+' · T'+st.table_no+'</div>';
        html2+='<div class="att-status" style="color:'+(rec?(rec.status==='present'?'var(--success-text)':'var(--danger-text)'):'var(--text3)')+'">'+( rec?rec.status.toUpperCase():'—')+'</div>';
        html2+='</div>';
      });
      if(!stuList.length)html2+='<div style="color:var(--text3);font-size:13px;padding:10px;">No students found — set up table allocations in Lesson Plan</div>';
      html2+='</div></div>';
    });
    html+=html2;
  }

  // ── Single session card ──
  if(selSess){
    var allocs=state.data['table_allocs_'+selId]||[];
    html+='<div class="card">';
    html+='<div class="card-header">';
    html+='<div>';
    html+='<div class="card-title">'+new Date(selSess.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div>';
    html+='<div style="font-size:12px;color:var(--text3);margin-top:2px;">'+selSess.slot+' · Table '+selSess.table_no+' · '+(selSess.staff_name||'No teacher')+' · '+selSess.branch_name+'</div>';
    html+='</div>';
    html+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">';
    html+='<span class="badge badge-success">'+presentCount+' present</span>';
    html+='<span class="badge badge-danger">'+absentCount+' absent</span>';
    html+='<span class="badge badge-gray">'+unmarkedCount+' unmarked</span>';
    html+='<button class="btn btn-sm btn-primary" data-action="save-att" data-id="'+selId+'">Save attendance</button>';
    html+='</div></div>';

    // Status filter buttons
    html+='<div style="display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap;">';
    html+='<span style="font-size:12px;color:var(--text3);font-weight:600;">Show:</span>';
    [['all','All ('+sessionStudents.length+')'],['present','Present ('+presentCount+')'],['absent','Absent ('+absentCount+')'],['unmarked','Unmarked ('+unmarkedCount+')']].forEach(function(f){
      html+='<button class="btn btn-sm '+(attStatusFilter===f[0]?'btn-primary':'')+'" data-action="att-status-filter" data-filter="'+f[0]+'" style="'+(attStatusFilter===f[0]?'':'background:var(--surface2);')+'">'+f[1]+'</button>';
    });
    html+='</div>';

    if(!state.data['sess_students_'+selId]){
      html+='<div style="padding:12px 16px;background:var(--accent-bg);border-radius:var(--radius);font-size:13px;color:var(--accent);margin-bottom:12px;">Loading students…</div>';
    } else if(sessionStudents.length===0){
      html+='<div style="padding:12px 16px;background:var(--warning-bg);border-radius:var(--radius);font-size:13px;color:var(--amber-text);margin-bottom:12px;">⚠ No students found. Set up table allocations in Lesson Plan, or assign students via session_students.</div>';
    }

    html+='<p style="font-size:12px;color:var(--text3);margin-bottom:14px;">Click a card to toggle · Showing '+visibleStudents.length+(attStatusFilter!=='all'?' of '+sessionStudents.length:'')+' students</p>';
    html+='<div class="att-grid">';
    visibleStudents.forEach(function(st){
      var rec=localAtt[st.id];
      html+='<div class="att-cell '+(rec?rec.status:'')+'" data-action="toggle-att" data-student="'+st.id+'" data-session="'+selId+'">';
      html+='<button class="att-remove" data-action="att-remove-student" data-student="'+st.id+'" data-session="'+selId+'" title="Remove from this session">✕</button>';
      html+='<div class="att-name">'+st.name+'</div>';
      html+='<div class="att-id">'+st.admission_id+(st.table_no?' · T'+st.table_no:'')+'</div>';
      html+='<div class="att-status" style="color:'+(rec?(rec.status==='present'?'var(--success-text)':'var(--danger-text)'):'var(--text3)')+'">'+( rec?rec.status.toUpperCase():'—')+'</div>';
      html+='</div>';
    });
    if(visibleStudents.length===0){html+='<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--text3);font-size:13px;">No students match this filter</div>';}
    html+='</div></div>';
  }
  return html;
}

function renderInvoices(){
  const invs=state.data.invoices||[];
  const tab=state.invTab||'list';
  const f=state.invoiceFilter||'all';
  const feeFilter=state.invFeeFilter||'all';
  const monthFilter=state.invMonthFilter||'';

  const total=invs.reduce((s,i)=>s+parseFloat(i.amount||0),0);
  const paid=invs.reduce((s,i)=>s+parseFloat(i.amount_paid||0),0);
  const out=invs.filter(i=>i.status!=='paid').reduce((s,i)=>s+parseFloat(i.balance||0),0);

  const feeLabels={monthly_fee:'Monthly fee',opening_balance:'Opening balance',admission_fee:'Admission fee',book_fee:'Book fee',past_papers_fee:'Past papers fee',miscellaneous:'Miscellaneous'};
  const feeColors={monthly_fee:'var(--accent)',opening_balance:'var(--danger)',admission_fee:'var(--teal)',book_fee:'var(--purple)',past_papers_fee:'var(--amber-text)',miscellaneous:'var(--text3)'};

  // Get unique months for filter
  const months=[...new Set(invs.map(i=>i.month).filter(Boolean))].sort().reverse();

  const searchTerm=(state.invSearch||'').trim().toLowerCase();

  // Apply all filters
  let filtered=invs;
  if(f==='unpaid') filtered=filtered.filter(i=>i.status!=='paid'); else if(f==='unpaid') filtered=filtered.filter(i=>i.status!=='paid'); else if(f!=='all') filtered=filtered.filter(i=>i.status===f);
  if(feeFilter!=='all') filtered=filtered.filter(i=>(i.fee_type||'monthly_fee')===feeFilter);
  if(monthFilter) filtered=filtered.filter(i=>i.month===monthFilter);
  if(searchTerm) filtered=filtered.filter(i=>
    (i.student_name||'').toLowerCase().includes(searchTerm) ||
    (i.admission_id||'').toLowerCase().includes(searchTerm)
  );

  // Sort by admission ID (natural sort: H103, H103a, H104, H104a...)
  filtered=[...filtered].sort((a,b)=>{
    const re=/^([A-Za-z]*)(\d+)([A-Za-z]*)$/;
    const ma=(a.admission_id||'').match(re), mb=(b.admission_id||'').match(re);
    if(ma&&mb){
      if(ma[1]!==mb[1]) return ma[1]<mb[1]?-1:1;
      const na=parseInt(ma[2]), nb=parseInt(mb[2]);
      if(na!==nb) return na-nb;
      return ma[3]<mb[3]?-1:ma[3]>mb[3]?1:0;
    }
    return (a.admission_id||'').localeCompare(b.admission_id||'');
  });

  function invBadge(s){
    return s==='paid'?'<span class="badge badge-success">Paid</span>':
           s==='partial'?'<span class="badge badge-blue">Partial</span>':
           s==='overdue'?'<span class="badge badge-danger">Overdue</span>':
           '<span class="badge badge-amber">Due</span>';}

  function feeBadge(ft){
    const label=feeLabels[ft||'monthly_fee']||ft||'Monthly fee';
    const color=feeColors[ft||'monthly_fee']||'var(--text3)';
    return '<span class="badge" style="color:'+color+';border-color:'+color+';">'+label+'</span>';}

  function buildTable(list){
    if(!list.length) return '<tr><td colspan="11"><div class="empty-state" style="padding:30px;">No invoices found</div></td></tr>';
    return list.map(function(inv){
      return '<tr>'+
        '<td><strong>'+inv.student_name+'</strong></td>'+
        '<td><span class="id-code">'+inv.admission_id+'</span></td>'+
        '<td><span class="badge badge-accent">'+(inv.branch_name||'?')+'</span></td>'+
        '<td style="color:var(--text2);">'+inv.month+'</td>'+
        '<td>'+feeBadge(inv.fee_type)+'</td>'+
        '<td><strong style="color:var(--text);">£'+parseFloat(inv.amount||0).toFixed(2)+'</strong>'+
          (inv.status==='partial'?'<div style="font-size:11px;color:var(--text3);">Paid £'+parseFloat(inv.amount_paid||0).toFixed(2)+' · Bal £'+parseFloat(inv.balance||0).toFixed(2)+'</div>':'')+
        '</td>'+
        '<td>'+invBadge(inv.status)+'</td>'+
        '<td style="font-size:12px;color:var(--text3);">'+(inv.issued||'—')+'</td>'+
        '<td style="font-size:12px;color:var(--text3);">'+(inv.paid_date||'—')+'</td>'+
        '<td style="font-size:12px;color:var(--text3);max-width:160px;overflow:hidden;text-overflow:ellipsis;">'+(inv.notes||inv.description||'—')+'</td>'+
        '<td><div class="row-actions">'+
          (inv.status!=='paid'?'<button class="btn btn-sm btn-success" data-action="mark-paid" data-id="'+inv.id+'">'+(inv.status==='partial'?'Add payment':'Mark paid')+'</button>':'')+
          '<button class="btn btn-sm" data-action="edit-invoice" data-id="'+inv.id+'">Edit</button>'+
          '<button class="btn btn-sm btn-danger" data-action="del-invoice" data-id="'+inv.id+'">Del</button>'+
        '</div></td>'+
      '</tr>';
    }).join('');
  }

  function exportInvoicesExcel(list, filename){
    const rows=[['Student','Admission ID','Branch','Month','Fee Type','Amount (£)','Status','Issued','Paid Date','Notes/Description']];
    list.forEach(function(inv){
      rows.push([inv.student_name,inv.admission_id,inv.branch_name||'',inv.month,feeLabels[inv.fee_type||'monthly_fee']||'Monthly fee',parseFloat(inv.amount||0).toFixed(2),inv.status,inv.issued||'',inv.paid_date||'',inv.notes||inv.description||'']);
    });
    exportXLSX(rows, filename, 'Invoices');
  }
  window._exportInvExcel=exportInvoicesExcel;

  let html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">';
  html+='<div><div class="section-title">Invoices & fees</div><div class="section-sub">Fee tracking, editing and management</div></div>';
  html+='<div style="display:flex;gap:8px;">';
  html+='<button class="btn btn-primary" data-action="create-batch-invoice">📋 Create Invoice</button>';
  html+='<button class="btn btn-success" data-action="gen-monthly-fees" style="background:var(--success);color:#fff;border-color:var(--success);">⚡ Generate monthly fees</button>';
  html+='</div></div>';

  // Metric cards
  html+='<div class="metrics-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">';
  html+='<div class="metric-card" style="border-top:3px solid var(--accent);"><div class="metric-label">Total invoiced</div><div class="metric-value">£'+total.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div></div>';
  html+='<div class="metric-card" style="border-top:3px solid var(--success);"><div class="metric-label">Collected</div><div class="metric-value" style="color:var(--success-text);">£'+paid.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div><div class="metric-sub">'+(total?Math.round(paid/total*100):0)+'% of total</div></div>';
  html+='<div class="metric-card" style="border-top:3px solid var(--danger);"><div class="metric-label">Outstanding</div><div class="metric-value" style="color:var(--danger-text);">£'+out.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div><div class="metric-sub">'+(total?Math.round(out/total*100):0)+'% of total · '+invs.filter(i=>i.status!=='paid').length+' invoices</div></div>';
  html+='<div class="metric-card" style="border-top:3px solid var(--danger);"><div class="metric-label">Overdue</div><div class="metric-value" style="color:var(--danger-text);">'+(function(){var c=invs.filter(i=>i.status==='overdue'||(i.status!=='paid'&&i.due_date&&new Date(i.due_date)<new Date())).length;return c+' invoice'+(c!==1?'s':'');})()+'</div><div class="metric-sub">£'+invs.filter(i=>i.status==='overdue'||(i.status!=='paid'&&i.due_date&&new Date(i.due_date)<new Date())).reduce((s,i)=>s+parseFloat(i.amount||0)-parseFloat(i.amount_paid||0),0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})+' outstanding</div></div>';
  html+='</div>';

  // Tabs
  html+='<div class="tab-bar" style="margin-bottom:16px;">';
  html+='<div class="tab '+(tab==='list'?'active':'')+'" data-action="inv-tab" data-tab="list">All invoices ('+invs.length+')</div>';
  html+='<div class="tab '+(tab==='generated'?'active':'')+'" data-action="inv-tab" data-tab="generated">Monthly fees ('+invs.filter(i=>(i.fee_type||'monthly_fee')==='monthly_fee').length+')</div>';
  html+='<div class="tab '+(tab==='other'?'active':'')+'" data-action="inv-tab" data-tab="other">Other fees ('+invs.filter(i=>i.fee_type&&i.fee_type!=='monthly_fee').length+')</div>';
  html+='</div>';

  // Search bar
  html+='<div style="margin-bottom:10px;">';
  html+='<input type="text" id="inv-search" value="'+(state.invSearch||'')+'" placeholder="Search by student name or admission ID (e.g. H103a)..." style="width:100%;max-width:400px;border:1px solid var(--border2);border-radius:var(--radius);padding:7px 12px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">';
  html+='</div>';

  // Filter bar
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">';
  // Status filter
  ['all','unpaid','due','partial','paid','overdue'].forEach(function(fl){
    html+='<button class="btn btn-sm '+(f===fl?'btn-primary':'')+'" data-action="inv-filter" data-filter="'+fl+'">'+fl.charAt(0).toUpperCase()+fl.slice(1)+'</button>';
  });
  html+='<div style="margin-left:8px;display:flex;gap:6px;align-items:center;">';
  // Month filter
  html+='<select id="inv-month-filter" style="border:1px solid var(--border2);border-radius:var(--radius);padding:5px 10px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">';
  html+='<option value="">All months</option>';
  months.forEach(function(m){html+='<option value="'+m+'" '+(m===monthFilter?'selected':'')+'>'+m+'</option>';});
  html+='</select>';
  // Export button
  html+='<button class="btn btn-sm" data-action="export-inv-excel">⬇ Export Excel</button>';
  html+='</div></div>';

  // Determine which invoices to show based on tab
  let tabInvs=filtered;
  if(tab==='generated') tabInvs=filtered.filter(i=>(i.fee_type||'monthly_fee')==='monthly_fee');
  if(tab==='other') tabInvs=filtered.filter(i=>i.fee_type&&i.fee_type!=='monthly_fee');

  // Store for export
  window._currentFilteredInvoices=tabInvs;

  html+='<div style="margin-bottom:6px;font-size:12px;color:var(--text3);">'+tabInvs.length+' invoice'+(tabInvs.length!==1?'s':'')+' · Total: £'+tabInvs.reduce(function(s,i){return s+parseFloat(i.amount||0);},0).toFixed(2)+'</div>';
  html+='<div class="card" style="padding:0;overflow:hidden;"><div class="table-wrap"><table>';
  html+='<thead><tr><th>Student</th><th>ID</th><th>Branch</th><th>Month</th><th>Fee type</th><th>Amount</th><th>Status</th><th>Issued</th><th>Paid date</th><th>Notes</th><th></th></tr></thead>';
  html+='<tbody>'+buildTable(tabInvs)+'</tbody></table></div></div>';
  return html;
}


function renderSessionReports(){
  const sessions=state.data.sessions||[];
  const srTab=state.srTab||'daily';
  const selId=state.sessionReportId;
  const sel=sessions.find(function(s){return s.id===selId;});
  const dates=[...new Set(sessions.map(function(s){return s.date;}).filter(Boolean))].sort().reverse();
  const selDate=state.srDate||dates[0]||'';
  const report=state.data['session_report_'+selDate]||{slots:[]};

  function attBadge(status){
    if(status==='present') return '<span style="display:inline-block;width:16px;height:16px;background:var(--success);border-radius:50%;vertical-align:middle;"></span>';
    if(status==='absent')  return '<span style="display:inline-block;width:16px;height:16px;background:var(--danger);border-radius:50%;vertical-align:middle;"></span>';
    return '<span style="display:inline-block;width:16px;height:16px;background:var(--border2);border-radius:50%;vertical-align:middle;"></span>';
  }

  function exportDailyReport(){
    const rows=[['FTApp — Session Report | '+selDate],[]];
    (report.slots||[]).forEach(function(slot){
      rows.push(['SLOT: '+slot.slot]);
      rows.push(['Table','Teacher','Subject','#','Student ID','Student Name','Attendance','Notes']);
      (slot.tables||[]).forEach(function(t){
        (t.students||[]).forEach(function(s,i){
          rows.push([
            i===0?'Table '+t.table_no:'',
            i===0?(t.teacher_name||'—'):'',
            i===0?(t.subject||'—'):'',
            i+1,
            s.admission_id||'—',
            s.student_name||'—',
            s.att_status||'—',
            s.att_notes||''
          ]);
        });
        rows.push(['','','','Total:',t.students?t.students.length:0]);
        rows.push([]);
      });
      rows.push(['SLOT TOTAL: '+slot.slot,'','','',slot.total_students||0]);
      rows.push([]);
    });
    exportXLSX(rows, 'fth-session-report-'+selDate+'.xlsx', 'Session Report');
  }  window._exportDailyReport=exportDailyReport;

  var html='';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">';
  html+='<div><div class="section-title" style="margin-bottom:2px;">Session reports</div>';
  html+='<div class="section-sub">Attendance register by slot, table and teacher</div></div>';
  html+='</div>';

  html+='<div class="tab-bar" style="margin-bottom:16px;">';
  html+='<div class="tab '+(srTab==='daily'?'active':'')+'" data-action="sr-tab" data-tab="daily">Daily report (all slots)</div>';
  html+='<div class="tab '+(srTab==='single'?'active':'')+'" data-action="sr-tab" data-tab="single">Single session</div>';
  html+='</div>';

  // ── DAILY REPORT ──
  if(srTab==='daily'){
    // Date selector + export
    html+='<div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;">';
    html+='<div class="field" style="margin:0;"><label>Select date</label>';
    html+='<select id="sr-date-select" style="border:1px solid var(--border2);border-radius:var(--radius);padding:7px 10px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">';
    html+='<option value="">— choose date —</option>';
    dates.forEach(function(d){
      html+='<option value="'+d+'" '+(d===selDate?'selected':'')+'>'+new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</option>';
    });
    html+='</select></div>';
    html+='<button class="btn btn-sm" onclick="window._exportDailyReport()">⬇ Export Excel</button>';
    html+='</div>';

    if(!selDate){
      html+='<div class="empty-state" style="padding:40px;">Select a date to view the session report</div>';
    } else if(!report.slots||!report.slots.length){
      html+='<div class="empty-state" style="padding:40px;">No sessions found for '+selDate+'. Make sure table allocations have been set up in the Session planner.</div>';
    } else {
      // Grand total bar
      var grandTotal=report.slots.reduce(function(t,s){return t+(s.total_students||0);},0);
      var grandPresent=report.slots.reduce(function(t,s){return t+(s.present||0);},0);
      var grandAbsent=report.slots.reduce(function(t,s){return t+(s.absent||0);},0);

        html+='<td style="text-align:center;">'+slot.tables_used+'</td>';
        html+='<td style="text-align:center;color:var(--success-text);">'+free+'</td>';
        html+='<td style="text-align:center;font-weight:600;">'+slot.total_students+'</td>';
        html+='<td style="text-align:center;color:var(--text3);">40</td>';
        html+='<td><strong>'+(util>80?'<span style="color:var(--success-text);">':'<span style="color:var(--text3);">')+util+'%</span></strong></td>';
        html+='</tr>';
      });
      html+='<tr style="background:var(--surface2);font-weight:700;">';
      html+='<td>DAY TOTAL</td><td></td><td style="text-align:center;">'+report.slots.reduce(function(t,s){return t+s.tables_used;},0)+'</td><td></td>';
      html+='<td style="text-align:center;">'+grandTotal+'</td><td style="text-align:center;color:var(--text3);">'+( report.slots.length*40)+'</td>';
      html+='<td><strong>'+Math.round(grandTotal/(report.slots.length*40||1)*100)+'%</strong></td>';
      html+='</tr>';
      html+='</tbody></table></div></div>';
    }
  }

  // ── SINGLE SESSION ──
  else{
    var sessOpts='<option value="">— choose session —</option>';
    sessions.forEach(function(s){
      sessOpts+='<option value="'+s.id+'" '+(s.id===selId?'selected':'')+'>'+new Date(s.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+s.slot+' · '+(s.branch_name||'')+' · '+(s.staff_name||'?')+'</option>';
    });
    html+='<div class="card" style="margin-bottom:16px;">';
    html+='<div class="field"><label>Select session</label><select id="sr-select">'+sessOpts+'</select></div>';
    html+='</div>';
    if(sel){
      var attRecs=state.data['sr_att_'+selId]||[];
      var progRecs=state.data['sr_prog_'+selId]||[];
      html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">';
      html+='<div class="metric-card"><div class="metric-label">Date</div><div class="metric-value" style="font-size:14px;">'+new Date(sel.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</div></div>';
      html+='<div class="metric-card"><div class="metric-label">Slot</div><div class="metric-value" style="font-size:13px;">'+sel.slot+'</div></div>';
      html+='<div class="metric-card"><div class="metric-label">Present</div><div class="metric-value" style="color:var(--success-text);">'+attRecs.filter(function(a){return a.status==='present';}).length+'/'+attRecs.length+'</div></div>';
      html+='<div class="metric-card"><div class="metric-label">Notes</div><div class="metric-value" style="color:var(--accent-text);">'+progRecs.length+'</div></div>';
      html+='</div>';
    }
  }
  return html;
}


function renderStaffTimesheets(){
  const summary=state.data.staff_att_summary||[];
  const records=state.data.staff_att||[];
  const tab=state.staffAttTab||'summary';
  const month=state.staffAttMonth||new Date().toISOString().slice(0,7);
  const sessions=state.data.sessions||[];
  const staffList=state.data.staff||[];

  const totalPresent=summary.reduce((s,r)=>s+(r.present||0),0);
  const totalAbsent=summary.reduce((s,r)=>s+(r.absent||0),0);
  const totalLate=summary.reduce((s,r)=>s+(r.late||0),0);
  const totalNoSignOut=summary.reduce((s,r)=>s+(r.no_sign_out||0),0);
  const totalHours=summary.reduce((s,r)=>s+(parseFloat(r.total_clock_hours)||parseFloat(r.total_hours)||0),0);const totalPaidHours=summary.reduce((s,r)=>s+(parseFloat(r.total_paid_hours)||0),0);

  // Filter states
  const filterStaff=state.tsFilterStaff||'';
  const filterRole=state.tsFilterRole||'';
  const filterStatus=state.tsFilterStatus||'';
  const filterDate=state.tsFilterDate||'';

  // Get unique roles from staff list
  const roles=[...new Set(staffList.map(s=>s.role).filter(Boolean))].sort();

  // Apply filters to summary
  const filteredSummary=summary.filter(function(r){
    if(filterStaff&&r.name!==filterStaff) return false;
    if(filterRole&&r.role!==filterRole) return false;
    return true;
  });

  // Apply filters to records (full log)
  const filteredRecords=records.filter(function(r){
    if(filterStaff&&(r.staff_name||'')!==filterStaff) return false;
    if(filterRole&&r.staff_role!==filterRole) return false;
    if(filterStatus&&r.status!==filterStatus) return false;
    if(filterDate&&r.date!==filterDate) return false;
    return true;
  });

  function statusBadge(s){
    if(s==='present')  return`<span class="badge badge-success">Present</span>`;
    if(s==='absent')   return`<span class="badge badge-danger">Absent</span>`;
    if(s==='late')     return`<span class="badge badge-amber">Late</span>`;
    if(s==='no_sign_out') return`<span class="badge" style="background:rgba(168,85,247,0.12);color:var(--purple-text);border:1px solid rgba(168,85,247,0.2);">No sign-out</span>`;
    return`<span class="badge badge-gray">${s}</span>`;
  }

  return`
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
    <div><div class="section-title">Staff timesheets</div><div class="section-sub">Sign-in/sign-out records, hours, and absence tracking</div></div>
    <div style="display:flex;gap:10px;align-items:center;">
      <input type="month" id="staff-att-month" value="${month}" style="border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-family:var(--font);font-size:13px;background:var(--surface2);color:var(--text);outline:none;">
      <button class="btn btn-primary" data-action="add-staff-att">+ Log attendance</button>
      <button class="btn btn-sm" data-action="dedup-staff-att" title="Remove exact duplicate timesheet rows" style="background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-text);">🧹 Remove Duplicates</button>
      <button class="btn btn-sm" data-action="print-all-timesheets">🖨 Print All</button>
      <button class="btn btn-sm" data-action="export-all-timesheets">⬇ Export All</button>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;" title="Only include staff who have at least one record in the selected period"><input type="checkbox" id="ts-worked-only" ${state.tsWorkedOnly?"checked":""} onchange="state.tsWorkedOnly=this.checked"> Worked only</label>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card"><div class="metric-icon" style="background:var(--success-bg);">${icoCheck(18)}</div><div class="metric-label">Sessions attended</div><div class="metric-value">${totalPresent}</div><div class="metric-sub">This month</div></div>
    <div class="metric-card"><div class="metric-icon" style="background:var(--danger-bg);">${icoX(18)}</div><div class="metric-label">Absences</div><div class="metric-value" style="color:var(--danger-text);">${totalAbsent}</div><div class="metric-sub">This month</div></div>
    <div class="metric-card"><div class="metric-icon" style="background:var(--amber-bg);">${icoClock(18)}</div><div class="metric-label">Late arrivals</div><div class="metric-value" style="color:var(--amber-text);">${totalLate}</div><div class="metric-sub">+ ${totalNoSignOut} no sign-out</div></div>
    <div class="metric-card"><div class="metric-icon" style="background:var(--accent-bg);">${icoClipboard(18)}</div><div class="metric-label">Clock hours</div><div class="metric-value" style="color:var(--text3);">${totalHours.toFixed(1)}</div><div class="metric-sub">Total time logged</div><div class="metric-sub">Logged this month</div></div>
    <div class="metric-card" style="border-top:3px solid var(--purple);"><div class="metric-label">Paid hours</div><div class="metric-value" style="color:var(--purple-text);">${totalPaidHours.toFixed(1)}</div><div class="metric-sub">After break deductions</div></div>
  </div>

  <div class="tab-bar">
    <div class="tab ${tab==='summary'?'active':''}" data-action="staff-att-tab" data-tab="summary">Summary by staff</div>
    <div class="tab ${tab==='log'?'active':''}" data-action="staff-att-tab" data-tab="log">Full log (${filteredRecords.length})</div>
    <div class="tab ${tab==='flags'?'active':''}" data-action="staff-att-tab" data-tab="flags">Flags & alerts</div>
  </div>

  <div class="card" style="margin-bottom:14px;padding:12px 16px;">
    <div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-items:end;">
      <div class="field" style="margin:0;"><label style="font-size:11px;">Month</label>
        <input type="month" id="sa-month" value="${month}" style="width:100%;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 10px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">
      </div>
      <div class="field" style="margin:0;"><label style="font-size:11px;">Staff member</label>
        <select id="ts-filter-staff" style="width:100%;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 10px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">
          <option value="">All staff</option>
          ${staffList.map(s=>`<option value="${s.name}" ${s.name===filterStaff?'selected':''}>${s.name}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin:0;"><label style="font-size:11px;">Role</label>
        <select id="ts-filter-role" style="width:100%;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 10px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">
          <option value="">All roles</option>
          ${roles.map(r=>`<option value="${r}" ${r===filterRole?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin:0;"><label style="font-size:11px;">Status</label>
        <select id="ts-filter-status" style="width:100%;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 10px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">
          <option value="">All statuses</option>
          <option value="present" ${filterStatus==='present'?'selected':''}>Present</option>
          <option value="absent" ${filterStatus==='absent'?'selected':''}>Absent</option>
          <option value="late" ${filterStatus==='late'?'selected':''}>Late</option>
          <option value="no_sign_out" ${filterStatus==='no_sign_out'?'selected':''}>No sign-out</option>
        </select>
      </div>
      <div class="field" style="margin:0;"><label style="font-size:11px;">Specific date</label>
        <input type="date" id="ts-filter-date" value="${filterDate}" style="width:100%;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 10px;background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;">
      </div>
      <div style="display:flex;align-items:flex-end;">
        <button class="btn btn-sm" data-action="ts-clear-filters" style="width:100%;">✕ Clear</button>
      </div>
    </div>
  </div>

  ${tab==='summary'?`
  <div class="card" style="padding:0;overflow:hidden;"><div class="table-wrap"><table>
    <div style="margin-bottom:12px;padding:10px 14px;background:rgba(167,139,250,0.1);border-radius:var(--radius);border-left:4px solid var(--purple);font-size:12px;color:var(--text2);"><strong style="color:var(--purple-text);">Unpaid break deductions:</strong> Weekend full day (after 16:15): −1h 30min · Morning (13:15–16:15): −1h 15min · Slot 2 only (11:15–13:15): −15 min · Afternoon only (14:00+, after 16:15): −15 min · Weekdays: none</div>
    <thead><tr><th>Staff member</th><th>Branch</th><th>Role</th><th>Present</th><th>Absent</th><th>Late</th><th>No sign-out</th><th>Clock hrs</th><th>Paid hrs</th><th>Actions</th></tr></thead>
    <tbody>${filteredSummary.map(r=>`<tr>
      <td><div style="display:flex;align-items:center;gap:10px;"><div class="avatar av-teal" style="width:30px;height:30px;font-size:11px;">${avatarInitials(r.name)}</div><strong>${r.name}</strong></div></td>
      <td><span class="badge badge-accent">${r.branch_name}</span></td>
      <td>${roleBadge(r.role==='teacher'?'teacher':'receptionist')}</td>
      <td><span class="badge badge-success">${r.present||0}</span></td>
      <td><span class="badge ${r.absent>0?'badge-danger':'badge-gray'}">${r.absent||0}</span></td>
      <td><span class="badge ${r.late>0?'badge-amber':'badge-gray'}">${r.late||0}</span></td>
      <td><span class="badge ${r.no_sign_out>0?'badge-purple':'badge-gray'}">${r.no_sign_out||0}</span></td>
      <td><strong style="color:var(--text3);">${r.total_hours||r.total_clock_hours||'0.0'}h</strong></td><td><strong style="color:var(--purple-text);">${r.total_paid_hours!=null?r.total_paid_hours+'h':'—'}</strong></td>
      <td style="white-space:nowrap;"><button class="btn btn-sm" data-action="export-staff-timesheet" data-id="${r.id}">Export</button> <button class="btn btn-sm" data-action="print-staff-timesheet" data-id="${r.id}">Print</button></td>
    </tr>`).join('')||`<tr><td colspan="9"><div class="empty-state">No records for this month</div></td></tr>`}</tbody>
  </table></div></div>` : ''}

  ${tab==='log'?`
  <div class="card" style="padding:0;overflow:hidden;"><div class="table-wrap"><table>
    <thead><tr>
      <th>Date</th><th>Staff</th><th>Branch</th><th>Role</th>
      <th>Sign in</th><th>Sign out</th><th>Clock hrs</th><th>Paid hrs</th>
      <th>Status</th><th>Session</th><th>Notes</th><th></th>
    </tr></thead>
    <tbody>${(function(){
      if(!filteredRecords.length) return '<tr><td colspan="12"><div class="empty-state">No records for this period</div></td></tr>';

      // Group by date+staff for summary rows
      const groups={};
      const groupOrder=[];
      filteredRecords.forEach(function(r){
        const key=r.date+'|'+r.staff_name;
        if(!groups[key]){groups[key]=[];groupOrder.push(key);}
        groups[key].push(r);
      });

      let html='';
      groupOrder.forEach(function(key){
        const recs=groups[key];
        const first=recs[0];
        const totalClock=recs.reduce(function(t,r){
          if(!r.sign_in||!r.sign_out) return t;
          try{const a=r.sign_in.slice(0,5).split(':');const b=r.sign_out.slice(0,5).split(':');return t+(parseInt(b[0])*60+parseInt(b[1]))-(parseInt(a[0])*60+parseInt(a[1]));}catch(e){return t;}
        },0);
        const totalPaid=recs.reduce(function(t,r){return t+(r.paid_hours||0);},0);
        const clkStr=totalClock>0?(Math.floor(totalClock/60)+'h'+(totalClock%60?(' '+totalClock%60+'m'):'')):'—';
        const multiDay=recs.length>1;

        if(multiDay){
          // Summary row for multiple records on same date
          html+='<tr style="background:var(--surface2);">';
          html+='<td><strong>'+new Date(first.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</strong></td>';
          html+='<td><strong>'+first.staff_name+'</strong></td>';
          html+='<td><span class="badge badge-accent">'+first.branch_name+'</span></td>';
          html+='<td style="font-size:12px;color:var(--text3);">'+first.staff_role+'</td>';
          html+='<td style="font-size:12px;color:var(--text3);" colspan="2">'+recs.length+' records</td>';
          html+='<td style="color:var(--text3);font-size:12px;">'+clkStr+'</td>';
          html+='<td><strong style="color:var(--purple-text);">'+(totalPaid>0?totalPaid.toFixed(2)+'h':'—')+'</strong></td>';
          html+='<td colspan="3"></td><td></td>';
          html+='</tr>';
        }

        // Individual rows
        recs.forEach(function(r){
          const hrs=(r.sign_in&&r.sign_out)?(function(){
            try{const a=r.sign_in.slice(0,5).split(':');const b=r.sign_out.slice(0,5).split(':');
            const m=(parseInt(b[0])*60+parseInt(b[1]))-(parseInt(a[0])*60+parseInt(a[1]));
            return Math.floor(m/60)+'h'+(m%60?(' '+m%60+'m'):'');}catch(e){return '—';}
          })():'—';
          const rowStyle=multiDay?'padding-left:20px;':'' ;
          const noSO=r.sign_in&&!r.sign_out;
          html+='<tr style="'+(noSO?'background:rgba(167,139,250,0.08);':'')+'">';
          html+='<td style="'+rowStyle+'">'+(multiDay?'↳ ':'<strong>')+new Date(r.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+(multiDay?'':'</strong>')+'</td>';
          html+='<td>'+(multiDay?'<span style="color:var(--text3);font-size:12px;">'+r.staff_name+'</span>':'<strong>'+r.staff_name+'</strong>')+'</td>';
          html+='<td><span class="badge badge-accent">'+r.branch_name+'</span></td>';
          html+='<td style="font-size:12px;color:var(--text3);">'+r.staff_role+'</td>';
          html+='<td><span style="font-family:var(--mono);font-size:12px;color:var(--success-text);">'+(r.sign_in||'—')+'</span></td>';
          html+='<td><span style="font-family:var(--mono);font-size:12px;color:'+(r.sign_out?'var(--text2)':'var(--danger-text)')+';">'+(r.sign_out||'<strong>Missing</strong>')+'</span></td>';
          html+='<td style="color:var(--text3);font-size:12px;">'+hrs+'</td>';
          html+='<td><strong style="color:var(--purple-text);">'+(r.paid_hours!=null?r.paid_hours+'h':'—')+'</strong></td>';
          html+='<td>'+((r.status==='present'?'<span class="badge badge-success">Present</span>':r.status==='absent'?'<span class="badge badge-danger">Absent</span>':r.status==='late'?'<span class="badge badge-amber">Late</span>':'<span class="badge badge-gray">'+r.status+'</span>'))+'</td>';
          html+='<td style="font-size:11px;color:var(--text3);">'+(r.slot||r.session_subject||'—')+'</td>';
          html+='<td style="font-size:12px;color:var(--text3);">'+(r.notes||'—')+'</td>';
          html+='<td><div class="row-actions">';
          html+='<button class="btn btn-sm" data-action="edit-staff-att" data-id="'+r.id+'">Edit</button>';
          html+='<button class="btn btn-sm btn-danger" data-action="del-staff-att" data-id="'+r.id+'">Del</button>';
          html+='</div></td>';
          html+='</tr>';
        });
      });
      return html;
    })()}</tbody>
  </table></div></div>` : ''}

  ${tab==='log'?`
  <div class="card" style="padding:0;overflow:hidden;"><div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Staff</th><th>Branch</th><th>Session</th><th>Sign in</th><th>Sign out</th><th>Clock hrs</th><th>Paid hrs</th><th>Status</th><th>Notes</th><th></th></tr></thead>
    <tbody>${filteredRecords.map(r=>{
      const hrs=(r.sign_in&&r.sign_out)?calcHours(r.sign_in,r.sign_out):'—';
      return`<tr>
        <td><strong>${new Date(r.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</strong></td>
        <td>${r.staff_name}</td>
        <td><span class="badge badge-accent">${r.branch_name}</span></td>
        <td style="font-size:12px;color:var(--text3);">${r.slot||r.session_subject||'—'}</td>
        <td><span style="font-family:var(--mono);font-size:12px;color:var(--success-text);">${r.sign_in||'—'}</span></td>
        <td><span style="font-family:var(--mono);font-size:12px;color:${r.sign_out?'var(--text2)':'var(--danger-text)'};">${r.sign_out||'Missing'}</span></td>
        <td style="color:var(--text3);font-size:12px;">${hrs}</td>
        <td><strong style="color:var(--purple-text);">${r.paid_hours!=null?r.paid_hours+'h':'—'}</strong></td>
        <td>${statusBadge(r.status)}</td>
        <td style="font-size:12px;color:var(--text3);max-width:140px;">${r.notes||r.absence_reason||'—'}</td>
        <td><div class="row-actions">
          <button class="btn btn-sm" data-action="edit-staff-att" data-id="${r.id}">Edit</button>
          <button class="btn btn-sm btn-danger" data-action="del-staff-att" data-id="${r.id}">Del</button>
        </div></td>
      </tr>`;
    }).join('')||`<tr><td colspan="10"><div class="empty-state">No records for this month</div></td></tr>`}</tbody>
  </table></div></div>` : ''}

  ${tab==='flags'?`
  <div style="display:flex;flex-direction:column;gap:12px;">
    ${records.filter(r=>r.status==='no_sign_out').length>0?`
    <div class="card" style="border-left:3px solid var(--purple);">
      <div class="card-title" style="color:var(--purple-text);margin-bottom:12px;">⚠ No sign-out recorded (${records.filter(r=>r.status==='no_sign_out').length})</div>
      ${records.filter(r=>r.status==='no_sign_out').map(r=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <div><strong>${r.staff_name}</strong> <span style="color:var(--text3);">— ${new Date(r.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</span></div>
        <div style="display:flex;gap:8px;align-items:center;"><span style="font-family:var(--mono);font-size:12px;color:var(--success-text);">In: ${r.sign_in||'?'}</span><button class="btn btn-sm" data-action="edit-staff-att" data-id="${r.id}">Add sign-out</button></div>
      </div>`).join('')}
    </div>` : ''}
    ${records.filter(r=>r.status==='absent').length>0?`
    <div class="card" style="border-left:3px solid var(--danger);">
      <div class="card-title" style="color:var(--danger-text);margin-bottom:12px;">✕ Absences (${records.filter(r=>r.status==='absent').length})</div>
      ${records.filter(r=>r.status==='absent').map(r=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <div><strong>${r.staff_name}</strong> <span style="color:var(--text3);">— ${new Date(r.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</span></div>
        <span style="font-size:12px;color:var(--text3);">${r.absence_reason||'No reason given'}</span>
      </div>`).join('')}
    </div>` : ''}

function calcHours(sin, sout){
  try{
    const[h1,m1]=sin.split(':').map(Number);
    const[h2,m2]=sout.split(':').map(Number);
    const mins=(h2*60+m2)-(h1*60+m1);
    if(mins<=0)return'—';
    return(mins/60).toFixed(1)+'h';
  }catch(e){return'—';}
}

    ledger=`<div class="card" style="border-top:3px solid var(--success);">
